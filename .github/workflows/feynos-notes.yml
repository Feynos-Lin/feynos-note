              dirtySinceBackup = false;
              meta.settings.lastBackupAt = now();
              meta.settings.lastBackupNote = note || '';
              saveMeta(true);
            }

            function validateBackup(data) {
              if (!data || data.app !== 'FeynosNotes') throw new Error("That file isn't a Feynos Notes backup.");
              if ((data.format || 0) > FORMAT) throw new Error('This backup was made by a newer version of the app. Please update first.');
              if (!Array.isArray(data.notebooks) || !Array.isArray(data.sections) || !Array.isArray(data.pages)) throw new Error('The backup file is damaged.');
              return data;
            }

            /* mode: 'replace' wipes everything first; 'merge' keeps the newer copy of anything with the same id */
            async function importData(data, mode, sanitize) {
              validateBackup(data);
              const clean = h => (sanitize ? sanitize(h || '') : (h || ''));
              const stats = { notebooks: 0, sections: 0, pages: 0 };

              if (mode === 'replace') {
                // everything currently here disappears - tell the server too
                for (const nb of meta.notebooks) touch('notebook', nb.id);
                for (const s of meta.sections) touch('section', s.id);
                for (const id of pages.keys()) touch('page', id);
                await tx(['pages'], 'readwrite', t => { t.objectStore('pages').clear(); });
                pages.clear();
                meta.notebooks = []; meta.sections = [];
              }
              const upsert = (arr, item) => {
                const i = arr.findIndex(x => x.id === item.id);
                if (i < 0) { arr.push(item); return true; }
                if ((item.updated || 0) > (arr[i].updated || 0)) { arr[i] = item; return true; }
                return false;
              };
              for (const nb of data.notebooks) if (nb && nb.id && upsert(meta.notebooks, { ...nb })) { stats.notebooks++; touch('notebook', nb.id); }
              for (const s of data.sections) if (s && s.id && upsert(meta.sections, { ...s })) { stats.sections++; touch('section', s.id); }

              const toSave = [];
              for (const raw of data.pages) {
                if (!raw || !raw.id) continue;
                const p = { ...raw, html: clean(raw.html) };
                p.text = htmlToText(p.html);
                const cur = pages.get(p.id);
                if (!cur || (p.updated || 0) > (cur.updated || 0)) { pages.set(p.id, p); toSave.push(p); touch('page', p.id); stats.pages++; }
              }
              await tx(['pages'], 'readwrite', t => { const st = t.objectStore('pages'); for (const p of toSave) st.put(p); });

              if (mode === 'replace' && data.settings) Object.assign(meta.settings, data.settings);
              if (!meta.notebooks.length) await seed();
              meta.onlySeed = false;
              dirtySinceBackup = mode !== 'replace';
              await saveMeta(true);
              listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
              return stats;
            }

            /* ---------------- sync support ---------------- */
            const stripLocal = nb => { const { collapsed, ...rest } = nb; return rest; };

            /* every local change the server hasn't seen, as records */
            function collectPending() {
              const out = [];
              for (const [id, info] of Object.entries(meta.sync.pending)) {
                let data = null;
                if (info.type === 'notebook') { const nb = getNotebook(id); data = nb ? stripLocal(nb) : null; }
                else if (info.type === 'section') data = getSection(id) || null;
                else if (info.type === 'page') { const p = pages.get(id); data = p ? { ...p } : null; if (data) delete data.text; }
                out.push({
                  type: info.type, id, n: info.n, base: meta.sync.revs[id] || 0,
                  updated: data ? (data.updated || now()) : now(), deleted: !data, data
                });
              }
              return out;
            }
            /* forget pending changes the server accepted, unless they changed again meanwhile */
            function ackPending(sent) {
              for (const c of sent) { const cur = meta.sync.pending[c.id]; if (cur && cur.n === c.n) delete meta.sync.pending[c.id]; }
            }
            /* apply records pulled from the server; returns what changed for the UI */
            async function applyRemote(records) {
              const changed = { pages: new Set(), structure: false };
              const toSave = []; const toDelete = [];
              for (const r of records) {
                meta.sync.revs[r.id] = r.rev;
                if (meta.sync.pending[r.id]) continue; // newer local edit wins until it's pushed
                if (r.type === 'notebook') {
                  const i = meta.notebooks.findIndex(n => n.id === r.id);
                  if (r.deleted) { if (i >= 0) meta.notebooks.splice(i, 1); }
                  else {
                    const nb = { ...r.data, collapsed: i >= 0 ? meta.notebooks[i].collapsed : false };
                    if (i >= 0) meta.notebooks[i] = nb; else meta.notebooks.push(nb);
                  }
                  changed.structure = true;
                } else if (r.type === 'section') {
                  const i = meta.sections.findIndex(s => s.id === r.id);
                  if (r.deleted) { if (i >= 0) meta.sections.splice(i, 1); }
                  else if (i >= 0) meta.sections[i] = { ...r.data }; else meta.sections.push({ ...r.data });
                  changed.structure = true;
                } else if (r.type === 'page') {
                  if (r.deleted) { if (pages.has(r.id)) { pages.delete(r.id); toDelete.push(r.id); } }
                  else {
                    const p = { ...r.data, id: r.id };
                    p.text = htmlToText(p.html);
                    pages.set(r.id, p); toSave.push(p);
                  }
                  changed.pages.add(r.id);
                }
              }
              if (toSave.length || toDelete.length) {
                await tx(['pages'], 'readwrite', t => { const st = t.objectStore('pages'); for (const p of toSave) st.put(p); for (const id of toDelete) st.delete(id); });
              }
              return changed;
            }
            /* first connection: queue everything, or drop the untouched starter notebook if the server has notes */
            async function prepareFirstSync(serverHasNotes) {
              meta.sync.revs = {}; meta.sync.pending = {}; meta.sync.lastSeq = 0;
              if (serverHasNotes && meta.onlySeed) {
                await tx(['pages'], 'readwrite', t => { t.objectStore('pages').clear(); });
                pages.clear(); meta.notebooks = []; meta.sections = [];
              } else {
                for (const nb of meta.notebooks) touch('notebook', nb.id);
                for (const s of meta.sections) touch('section', s.id);
                for (const id of pages.keys()) touch('page', id);
              }
              meta.onlySeed = false;
              await saveMeta(true);
            }

            window.Store = {
              COLORS, load, uid,
              get settings() { return meta.settings; },
              saveSettings(patch) { Object.assign(meta.settings, patch || {}); return saveMeta(); },
              get isDirty() { return dirtySinceBackup; },
              onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },
              notebooks, getNotebook, addNotebook, updateNotebook, deleteNotebook, moveNotebook,
              sections, getSection, addSection, updateSection, deleteSection, moveSection, moveSectionToNotebook,
              pagesIn, getPage, addPage, updatePage, setPageLevel, movePage, movePageToSection, duplicatePage,
              trashPage, binPages, restorePage, purgePage, emptyBin,
              search, exportData, importData, validateBackup, backupFileName, markBackedUp, htmlToText,
              // sync
              get sync() { return meta.sync; },
              get syncOn() { return syncOn(); },
              setSync(patch) { Object.assign(meta.sync, patch || {}); return saveMeta(true); },
              resetSync() { meta.sync = { ...DEFAULT_SYNC, revs: {}, pending: {} }; return saveMeta(true); },
              get pendingCount() { return Object.keys(meta.sync.pending).length; },
              collectPending, ackPending, applyRemote, prepareFirstSync,
              ensureSeed: async () => { if (!meta.notebooks.length) await seed(); },
              flush() { return saveMeta(true); }
            };
          })();
          FEYNOS_EOF

          mkdir -p "$(dirname src/www/sync.js)"
          cat > src/www/sync.js <<'FEYNOS_EOF'
          /* Feynos Notes - sync with a self-hosted Feynos Notes sync server (works behind reverse proxies) */
          (function () {
            'use strict';
            const S = window.Store;

            let running = false, again = false, timer = null, started = false;
            let state = 'off', stateMsg = '';
            const hooks = { beforeSync: async () => {}, onApplied: () => {}, onStatus: () => {}, onConflicts: () => {}, onSignedOut: () => {} };

            function setState(s, msg) { state = s; stateMsg = msg || ''; hooks.onStatus(state, stateMsg); }

            function normUrl(u) {
              u = String(u || '').trim();
              if (!u) return '';
              if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
              try { const x = new URL(u); x.hash = ''; x.search = ''; return x.toString().replace(/\/+$/, ''); } catch (e) { return ''; }
            }

            async function gzipBlob(str) {
              if (typeof CompressionStream === 'undefined' || str.length < 4096) return null;
              try { return await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); } catch (e) { return null; }
            }

            class SyncError extends Error { constructor(msg, code) { super(msg); this.code = code; } }

            async function api(base, path, body, token, timeoutMs) {
              const ctrl = new AbortController();
              const to = setTimeout(() => ctrl.abort(), timeoutMs || 120000);
              const headers = { Accept: 'application/json' };
              if (token) headers.Authorization = 'Bearer ' + token;
              let payload;
              if (body !== undefined) {
                const json = JSON.stringify(body);
                const gz = await gzipBlob(json);
                headers['Content-Type'] = 'application/json';
                if (gz) { headers['Content-Encoding'] = 'gzip'; payload = gz; } else payload = json;
              }
              let res;
              try {
                res = await fetch(base + path, { method: body === undefined ? 'GET' : 'POST', headers, body: payload, signal: ctrl.signal, cache: 'no-store', credentials: 'omit' });
              } catch (e) {
                clearTimeout(to);
                if (e.name === 'AbortError') throw new SyncError('The server took too long to answer.', 'timeout');
                throw new SyncError(navigator.onLine === false ? "You're offline." : "Can't reach the server. Check the address, that the container is running, and your reverse proxy/HTTPS certificate.", 'network');
              }
              clearTimeout(to);
              const ct = res.headers.get('content-type') || '';
              if (res.status === 413) throw new SyncError('Your reverse proxy rejected a large upload. Raise its upload limit (for Nginx: client_max_body_size 200m).', 'too-large');
              if (!ct.includes('application/json')) {
                if (res.status === 502 || res.status === 503 || res.status === 504) throw new SyncError(`The reverse proxy couldn't reach the sync container (HTTP ${res.status}).`, 'proxy');
                throw new SyncError(`That address doesn't look like a Feynos Notes sync server (HTTP ${res.status}). Check the address and any sub-path in your reverse proxy.`, 'not-server');
              }
              const data = await res.json();
              if (res.status === 401 && token) throw new SyncError(data.error || 'Signed out', 'auth');
              if (!res.ok || data.ok === false) throw new SyncError(data.error || ('HTTP ' + res.status), 'server');
              return data;
            }

            /* ---------------- connect / disconnect ---------------- */
            async function connect(url, password, device) {
              const base = normUrl(url);
              if (!base) throw new SyncError('Enter the server address, e.g. https://notes.example.com');
              const health = await api(base, '/api/health', undefined, null, 20000);
              if (health.app !== 'feynos-notes-sync') throw new SyncError("That address answered, but it isn't a Feynos Notes sync server.");
              const login = await api(base, '/api/login', { password, device }, null, 20000);
              await S.setSync({ url: base, token: login.token, device, serverId: login.serverId, lastError: '' });
              await S.prepareFirstSync(login.count > 0);
              start();
              await syncNow();
              if (!S.notebooks().length) { await S.ensureSeed(); await syncNow(); }
