          /* Feynos Notes - in-app updates from GitHub Releases
             desktop: electron-updater (Windows installer runs silently; Fedora installs the .rpm via dnf after a password prompt)
             android: downloads the new .apk and opens the Android installer */
          (function () {
            'use strict';
            const REPO = 'Feynos-Lin/feynos-note';
            const P = window.Platform;
            const desk = window.feynosDesktop;
            const cap = window.FeynosCap;

            const newer = (a, b) => {
              const pa = String(a).replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
              const pb = String(b).replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
              for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0); }
              return false;
            };

            let latestAndroid = null;
            const listeners = new Set();
            if (desk && desk.onUpdateEvent) desk.onUpdateEvent(e => listeners.forEach(fn => fn(e)));

            async function check(current) {
              if (!/^\d+\.\d+\.\d+$/.test(current)) return { supported: false, current, reason: 'This is a development build.' };
              if (P.isDesktop) {
                if (!desk.checkUpdate) return { supported: false, current, reason: 'Update support needs a newer build.' };
                return desk.checkUpdate();
              }
              if (P.isAndroid) {
                const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
                if (res.status === 403) throw new Error('GitHub is limiting update checks right now - try again in an hour.');
                if (!res.ok) throw new Error('Couldn\'t reach GitHub (HTTP ' + res.status + ').');
                const rel = await res.json();
                const latest = String(rel.tag_name || '').replace(/^v/, '');
                const apk = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
                latestAndroid = apk ? { version: latest, url: apk.browser_download_url, size: apk.size } : null;
                return { supported: true, current, latest, available: !!apk && newer(latest, current), notes: (rel.body || '').slice(0, 600), size: apk && apk.size };
              }
              return { supported: false, current, reason: 'Updates are for the installed apps.' };
            }

            /* onProgress(percent) - desktop resolves when downloaded (call install() after); android opens the installer */
            async function download(onProgress) {
              if (P.isDesktop) {
                const off = e => { if (e.type === 'progress' && onProgress) onProgress(e.percent); };
                listeners.add(off);
                try { await desk.downloadUpdate(); } finally { listeners.delete(off); }
                return 'ready';
              }
              if (P.isAndroid) {
                if (!latestAndroid) throw new Error('Check for updates first.');
                const handle = await cap.ApkUpdater.addListener('downloadProgress', d => onProgress && onProgress(d.percent));
                try { await cap.ApkUpdater.downloadAndInstall({ url: latestAndroid.url }); } finally { handle.remove(); }
                return 'installer-opened';
              }
              throw new Error('Not supported here');
            }

            window.Updater = {
              check, download, newer,
              install: () => desk.installUpdate(),
              canInstallApk: async () => (P.isAndroid ? (await cap.ApkUpdater.canInstall()).allowed : true),
              openInstallSettings: () => cap.ApkUpdater.openInstallSettings(),
              get supported() { return P.isDesktop || P.isAndroid; }
            };
          })();
          FEYNOS_EOF

