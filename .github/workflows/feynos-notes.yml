          .bin-item .b-sub { font-size: 12px; color: var(--text-3); }

          /* ------------- sketch ------------- */
          .sketch-wrap { display: flex; flex-direction: column; gap: 10px; }
          .sketch-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
          .sketch-tools .pen-color { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
          .sketch-tools .pen-color.on { border-color: var(--text); }
