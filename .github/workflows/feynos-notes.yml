            }

            /* ---------------- search ---------------- */
            function search(q) {
              q = (q || '').trim().toLowerCase();
              if (!q) return [];
              const terms = q.split(/\s+/).filter(Boolean);
              const out = [];
              for (const p of pages.values()) {
                if (p.deleted) continue;
                const sec = getSection(p.sectionId); if (!sec) continue;
                const title = (p.title || '').toLowerCase();
                const text = (p.text || '').toLowerCase();
                if (!terms.every(t => title.includes(t) || text.includes(t))) continue;
                let score = 0;
                for (const t of terms) { if (title.includes(t)) score += 10; score += Math.min(5, text.split(t).length - 1); }
                out.push({ page: p, section: sec, notebook: getNotebook(sec.notebookId), score });
              }
              return out.sort((a, b) => b.score - a.score || b.page.updated - a.page.updated).slice(0, 200);
            }

            /* ---------------- backup / restore ---------------- */
            function exportData() {
              return {
                app: 'FeynosNotes',
                format: FORMAT,
                exportedAt: new Date().toISOString(),
                notebooks: meta.notebooks,
                sections: meta.sections,
                pages: [...pages.values()],
                settings: { theme: meta.settings.theme, ruledLines: meta.settings.ruledLines }
