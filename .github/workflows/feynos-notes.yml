          /* Feynos Notes - sketch pad (mouse, touch, pen with pressure) */
          (function () {
            'use strict';

            const PEN_COLORS = ['#1d1b20', '#d2344a', '#2f6fdb', '#1f9e89', '#e0712b', '#7b3fb0', '#ffd400'];

            /* Renders into `host` and resolves with a PNG data URL, or null if cancelled */
            function openSketch(host, opts) {
              opts = opts || {};
              return new Promise(resolve => {
                host.classList.add('wide');
                host.innerHTML = `
                  <h2>Sketch</h2>
                  <p class="sub">Draw with a finger, mouse or stylus. Pen pressure is supported.</p>
                  <div class="sketch-wrap">
                    <div class="sketch-tools">
                      ${PEN_COLORS.map((c, i) => `<button class="pen-color${i === 0 ? ' on' : ''}" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}
                      <span class="hint">Size</span><input type="range" id="skSize" min="1" max="24" value="3">
                      <div class="seg"><button data-tool="pen" class="on">Pen</button><button data-tool="marker">Marker</button><button data-tool="eraser">Eraser</button></div>
                      <button class="btn small" id="skUndo">Undo</button>
                      <button class="btn small" id="skClear">Clear</button>
                    </div>
                    <div class="sketch-canvas-box"><canvas id="skCanvas"></canvas></div>
                  </div>
                  <div class="modal-actions">
                    <button class="btn" id="skCancel">Cancel</button>
                    <button class="btn primary" id="skInsert">Insert sketch</button>
                  </div>`;

                const canvas = host.querySelector('#skCanvas');
                const ctx = canvas.getContext('2d');
                const box = host.querySelector('.sketch-canvas-box');
                const W = 1600;
                const H = window.innerWidth < 760 ? 1600 : 1000;
                canvas.width = W; canvas.height = H;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';

                let color = PEN_COLORS[0];
                let tool = 'pen';
                let size = 3;
                const history = [];
                let drawing = false;
                let last = null;
                let anyInk = false;

                host.querySelectorAll('.pen-color').forEach(b => b.addEventListener('click', () => {
                  host.querySelectorAll('.pen-color').forEach(x => x.classList.remove('on'));
                  b.classList.add('on'); color = b.dataset.c;
                  if (tool === 'eraser') setTool('pen');
                }));
                function setTool(t) {
                  tool = t;
                  host.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x.dataset.tool === t));
                }
                host.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
                host.querySelector('#skSize').addEventListener('input', e => { size = +e.target.value; });

                const snapshot = () => { history.push(ctx.getImageData(0, 0, W, H)); if (history.length > 25) history.shift(); };
                host.querySelector('#skUndo').addEventListener('click', () => { const s = history.pop(); if (s) ctx.putImageData(s, 0, 0); });
                host.querySelector('#skClear').addEventListener('click', () => { snapshot(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); });

