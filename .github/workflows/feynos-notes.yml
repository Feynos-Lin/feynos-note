          // Feynos Notes - import OneNote notebooks from OneDrive via Microsoft Graph (delegated, device-code sign-in)
          import crypto from 'node:crypto';

          const GRAPH = 'https://graph.microsoft.com/v1.0';
          const SCOPE = 'Notes.Read User.Read offline_access';
          export const COLORS = ['#7b3fb0', '#2f6fdb', '#1f9e89', '#4d9a2a', '#d9a400', '#e0712b', '#d2344a', '#c2408f', '#6b6f7a', '#0b8bb3'];
          const MAX_IMAGE_BYTES = 12 * 1024 * 1024;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          export const rid = (kind, oneId) => 'on' + kind[0] + crypto.createHash('sha1').update(oneId).digest('hex').slice(0, 20);
          const escHtml = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

          /* ===================================================================
             OneNote page HTML -> Feynos Notes HTML
             =================================================================== */
          const DROP_STYLE = /^(position|left|top|right|bottom|z-index|font-family|line-height|margin(-\w+)?)$/i;
          function cleanStyle(tag, style) {
            const keepSize = /^(img|table|td|th|col|svg)$/i.test(tag);
            const out = [];
            for (const decl of style.split(';')) {
              const i = decl.indexOf(':'); if (i < 0) continue;
              const prop = decl.slice(0, i).trim(); const val = decl.slice(i + 1).trim();
              if (!prop || DROP_STYLE.test(prop)) continue;
              if (!keepSize && /^(width|height|min-width|max-width)$/i.test(prop)) continue;
              if (/^font-size$/i.test(prop) && /^(10|10\.5|11|12)pt$/i.test(val)) continue; // OneNote's default body size
              out.push(prop + ':' + val);
            }
            return out.join(';');
          }

          /* tidy every tag's attributes: OneNote's canvas positions don't apply to a flowing page */
          export function tidyTags(h) {
            return h.replace(/<([a-z][a-z0-9]*)\b([^>]*)>/gi, (all, tag, attrs) => {
              if (!attrs.trim()) return all;
              let a = attrs.replace(/\s(data-id|data-absolute-enabled|data-render-original-src|data-src-type|data-fullres-src-type|data-index|lang)="[^"]*"/gi, '');
              a = a.replace(/\sstyle="([^"]*)"/i, (s, st) => { const c = cleanStyle(tag, st); return c ? ` style="${c}"` : ''; });
              return `<${tag}${a}>`;
            });
          }

          const TAG_CHIPS = {
            important: '<span class="tag tag-important" contenteditable="false">★ Important</span> ',
            question: '<span class="tag tag-question" contenteditable="false">? Question</span> ',
            idea: '<span class="tag tag-idea" contenteditable="false">💡 Idea</span> '
          };
          function chipsFor(tags) {
            let h = '';
            for (const t of tags) {
              const base = t.split(':')[0];
              if (base === 'to-do') continue;
              if (TAG_CHIPS[base]) h += TAG_CHIPS[base];
              else h += `<span class="tag tag-question" contenteditable="false">${escHtml(base.replace(/-/g, ' '))}</span> `;
            }
            return h;
          }

          export async function convertPageHtml(html, fetchImage) {
            const m = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
            let h = m ? m[1] : html;

            h = h.replace(/<!--[\s\S]*?-->/g, '');

            // attachments and embeds
            h = h.replace(/<object\b([^>]*)>(?:[\s\S]*?<\/object>)?/gi, (all, attrs) => {
              const name = (attrs.match(/data-attachment="([^"]*)"/i) || [])[1] || 'file';
              return `<p>📎 ${name} <i>(attachment not imported)</i></p>`;
            });
            h = h.replace(/<iframe\b([^>]*)>(?:[\s\S]*?<\/iframe>)?/gi, (all, attrs) => {
              const src = (attrs.match(/data-original-src="([^"]*)"/i) || attrs.match(/\ssrc="([^"]*)"/i) || [])[1];
              return src ? `<p>🎬 <a href="${src}">${src}</a></p>` : '';
            });

            // to-do checkboxes and tags on paragraphs and headings
            h = h.replace(/<(p|h[1-6])\b([^>]*?)\sdata-tag="([^"]*)"([^>]*)>([\s\S]*?)<\/\1>/gi, (all, tag, a1, tagList, a2, inner) => {
              const tags = tagList.split(',').map(s => s.trim()).filter(Boolean);
              const todo = tags.find(t => t.startsWith('to-do'));
              const chips = chipsFor(tags);
              if (todo) return `<ul class="todo"><li data-done="${todo.includes(':completed')}">${chips}${inner}</li></ul>`;
              return `<${tag}${a1}${a2}>${chips}${inner}</${tag}>`;
            });
            // list items keep their list - show the state as a symbol
            h = h.replace(/<li\b([^>]*?)\sdata-tag="([^"]*)"([^>]*)>/gi, (all, a1, tagList, a2) => {
              const tags = tagList.split(',').map(s => s.trim());
              const todo = tags.find(t => t.startsWith('to-do'));
              return `<li${a1}${a2}>${todo ? (todo.includes(':completed') ? '☑ ' : '☐ ') : ''}${chipsFor(tags)}`;
            });
            h = h.replace(/<\/ul>\s*<ul class="todo">/g, '');

            h = tidyTags(h);

            // images: pull each one down and embed it so the page works offline everywhere
            const imgs = [...h.matchAll(/<img\b[^>]*>/gi)];
            const out = [];
            let last = 0;
            for (const im of imgs) {
              out.push(h.slice(last, im.index));
              last = im.index + im[0].length;
              const tagStr = im[0];
              const src = (tagStr.match(/data-fullres-src="([^"]*)"/i) || tagStr.match(/\ssrc="([^"]*)"/i) || [])[1];
              const alt = (tagStr.match(/\salt="([^"]*)"/i) || [])[1] || '';
              const width = (tagStr.match(/\swidth="(\d+)"/i) || [])[1];
              let dataUrl = null;
              if (src && /^https:\/\/graph\.microsoft\.com\//i.test(src.replace(/&amp;/g, '&'))) {
                try { dataUrl = await fetchImage(src.replace(/&amp;/g, '&')); } catch (e) { dataUrl = null; }
              } else if (src && src.startsWith('data:image/')) dataUrl = src;
              out.push(dataUrl
                ? `<img src="${dataUrl}" alt="${alt}"${width ? ` style="width:${width}px"` : ''}>`
                : `<p><i>[picture couldn't be imported${alt ? ': ' + alt : ''}]</i></p>`);
            }
            out.push(h.slice(last));
            h = out.join('');

            // unwrap OneNote's outline containers
            h = h.replace(/<div>\s*<\/div>/gi, '').trim();
            return h;
          }

          /* ===================================================================
             Importer state machine (one import at a time)
             =================================================================== */
          export function createOneNoteImporter({ clientId, tenant, kvGet, kvSet, store, log }) {
            const st = {
              state: clientId ? 'idle' : 'unconfigured',
              message: '', userCode: '', verificationUri: '', expiresAt: 0,
              account: '', notebooks: [], progress: { done: 0, total: 0, current: '' }, result: null
            };
            let access = { token: '', expiresAt: 0 };
            let cancelFlag = false;
            let pollTimer = null;
            const authority = `https://login.microsoftonline.com/${tenant || 'common'}/oauth2/v2.0`;

            const publicState = () => ({ ok: true, ...st, configured: !!clientId, hasSavedSignIn: !!kvGet('ms_refresh') });

            async function tokenRequest(params) {
              const r = await fetch(authority + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: clientId, ...params }) });
              return r.json();
            }
            function saveTokens(t) {
              access = { token: t.access_token, expiresAt: Date.now() + (t.expires_in - 120) * 1000 };
              if (t.refresh_token) kvSet('ms_refresh', t.refresh_token);
            }
            async function ensureToken() {
              if (access.token && Date.now() < access.expiresAt) return access.token;
              const rt = kvGet('ms_refresh');
              if (!rt) throw new Error('Microsoft sign-in expired - start the import again.');
              const t = await tokenRequest({ grant_type: 'refresh_token', refresh_token: rt, scope: SCOPE });
              if (!t.access_token) { kvSet('ms_refresh', ''); throw new Error('Microsoft sign-in expired - start the import again.'); }
              saveTokens(t);
              return access.token;
            }

            async function graph(url, asBuffer) {
              for (let attempt = 0; attempt < 6; attempt++) {
                if (cancelFlag) throw new Error('cancelled');
                const token = await ensureToken();
                const r = await fetch(url.startsWith('http') ? url : GRAPH + url, { headers: { Authorization: 'Bearer ' + token } });
                if (r.status === 429 || r.status === 503 || r.status === 504) {
                  const wait = Math.min(120, parseInt(r.headers.get('retry-after') || '0', 10) || 5 * (attempt + 1));
                  st.message = `Microsoft asked us to slow down - waiting ${wait}s…`;
                  await sleep(wait * 1000); st.message = '';
                  continue;
                }
                if (r.status === 401 && attempt === 0) { access.token = ''; continue; }
                if (!r.ok) {
                  let detail = ''; try { const j = await r.json(); detail = (j.error && (j.error.message || j.error.code)) || ''; } catch { /* noop */ }
                  throw new Error(`Microsoft Graph error ${r.status}${detail ? ': ' + detail : ''}`);
                }
                if (asBuffer) return { buf: Buffer.from(await r.arrayBuffer()), type: r.headers.get('content-type') || 'image/png' };
                const ct = r.headers.get('content-type') || '';
                return ct.includes('json') ? r.json() : r.text();
              }
              throw new Error('Microsoft Graph kept throttling - try again later.');
            }
            async function graphAll(url) {
              const items = [];
              let next = url;
              while (next) { const j = await graph(next); items.push(...(j.value || [])); next = j['@odata.nextLink'] || null; }
              return items;
            }

            async function loadNotebooks() {
              st.state = 'listing'; st.message = 'Reading your notebooks…';
              try {
                const me = await graph('/me?$select=displayName,userPrincipalName,mail');
                st.account = me.mail || me.userPrincipalName || me.displayName || '';
              } catch { st.account = ''; }
              const nbs = await graphAll('/me/onenote/notebooks?$select=id,displayName,lastModifiedDateTime&$orderby=displayName');
              st.notebooks = nbs.map(n => ({ id: n.id, name: n.displayName, modified: n.lastModifiedDateTime, already: !!store.get(rid('notebook', n.id)) }));
              st.state = 'choose'; st.message = '';
            }

            async function start() {
              if (!clientId) { st.state = 'unconfigured'; return publicState(); }
              if (['signin', 'listing', 'importing'].includes(st.state)) return publicState();
              cancelFlag = false; st.result = null; st.message = '';
              if (kvGet('ms_refresh')) {
                try { await ensureToken(); loadNotebooks().catch(fail); return publicState(); } catch { /* fall through to a new sign-in */ }
              }
              const r = await fetch(authority + '/devicecode', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: clientId, scope: SCOPE }) });
              const j = await r.json();
              if (!j.device_code) { st.state = 'error'; st.message = j.error_description || j.error || 'Microsoft sign-in failed to start.'; return publicState(); }
              Object.assign(st, { state: 'signin', userCode: j.user_code, verificationUri: j.verification_uri, expiresAt: Date.now() + j.expires_in * 1000 });
              let interval = (j.interval || 5) * 1000;
              const poll = async () => {
                if (cancelFlag || st.state !== 'signin') return;
                if (Date.now() > st.expiresAt) { st.state = 'error'; st.message = 'The sign-in code expired. Start again.'; return; }
                const t = await tokenRequest({ grant_type: 'urn:ietf:params:oauth:grant-type:device_code', device_code: j.device_code }).catch(() => ({ error: 'network' }));
                if (t.access_token) { saveTokens(t); st.userCode = ''; loadNotebooks().catch(fail); return; }
                if (t.error === 'slow_down') interval += 5000;
                else if (t.error && !['authorization_pending', 'network'].includes(t.error)) { st.state = 'error'; st.message = t.error_description || t.error; return; }
                pollTimer = setTimeout(poll, interval);
              };
              pollTimer = setTimeout(poll, interval);
              return publicState();
            }

            function fail(e) {
              if (e && e.message === 'cancelled') { st.state = 'idle'; st.message = 'Import cancelled.'; return; }
              log('OneNote import failed:', e);
              st.state = 'error'; st.message = String(e && e.message || e);
            }

            async function sectionsOf(parentPath, prefix, out) {
              const secs = await graphAll(`${parentPath}/sections?$select=id,displayName`);
              for (const s of secs) out.push({ id: s.id, name: prefix + s.displayName });
              const groups = await graphAll(`${parentPath}/sectionGroups?$select=id,displayName`);
              for (const g of groups) await sectionsOf(`/me/onenote/sectionGroups/${g.id}`, prefix + g.displayName + ' › ', out);
            }

            async function runImport(ids) {
              const chosen = st.notebooks.filter(n => ids.includes(n.id));
              st.state = 'importing'; st.progress = { done: 0, total: 0, current: 'Listing sections and pages…' };
              const stats = { notebooks: 0, sections: 0, pages: 0, skipped: 0, failed: 0 };
              let nbOrder = store.maxOrder('notebook') + 1;

              // 1) list everything first so progress is meaningful
              const plan = [];
              for (const nb of chosen) {
                const secs = [];
                await sectionsOf(`/me/onenote/notebooks/${nb.id}`, '', secs);
                const secPlans = [];
                for (const s of secs) {
                  const pages = await graphAll(`/me/onenote/sections/${s.id}/pages?pagelevel=true&$top=100&$select=id,title,createdDateTime,lastModifiedDateTime,level,order`);
                  secPlans.push({ ...s, pages });
                  st.progress.total += pages.length;
                }
                plan.push({ nb, sections: secPlans });
              }

              // 2) write notebooks, sections and pages
              for (const { nb, sections } of plan) {
                const nbId = rid('notebook', nb.id);
                if (!store.get(nbId)) {
                  store.write('notebook', nbId, { id: nbId, name: nb.name, color: COLORS[(nbOrder) % COLORS.length], order: nbOrder++, updated: Date.now() });
                  stats.notebooks++;
                }
                let secOrder = 0;
                for (const s of sections) {
                  const secId = rid('section', s.id);
                  if (!store.get(secId)) {
                    store.write('section', secId, { id: secId, notebookId: nbId, name: s.name, color: COLORS[(secOrder + 1) % COLORS.length], order: secOrder, updated: Date.now() });
                    stats.sections++;
                  }
                  secOrder++;
                  const pages = s.pages.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.createdDateTime).localeCompare(String(b.createdDateTime)));
                  let pOrder = 0;
                  for (const pg of pages) {
                    if (cancelFlag) throw new Error('cancelled');
                    st.progress.current = `${nb.name} › ${s.name} › ${pg.title || 'Untitled page'}`;
                    const pid = rid('page', pg.id);
                    const modified = Date.parse(pg.lastModifiedDateTime) || Date.now();
                    const existing = store.get(pid);
                    const order = pOrder++;
                    if (existing && (existing.deleted || existing.updated > modified)) { stats.skipped++; st.progress.done++; continue; }
                    try {
                      const raw = await graph(`/me/onenote/pages/${pg.id}/content`);
                      const html = await convertPageHtml(String(raw), async url => {
                        const { buf, type } = await graph(url, true);
                        if (buf.length > MAX_IMAGE_BYTES) return null;
                        return `data:${type.split(';')[0]};base64,${buf.toString('base64')}`;
                      });
                      store.write('page', pid, {
                        id: pid, sectionId: secId, title: pg.title || '', html, level: Math.min(2, pg.level || 0),
                        order, created: Date.parse(pg.createdDateTime) || modified, updated: modified, deleted: null
                      }, modified);
                      stats.pages++;
                    } catch (e) {
                      if (e.message === 'cancelled') throw e;
                      log(`page failed (${pg.title}):`, e.message);
                      stats.failed++;
                    }
                    st.progress.done++;
                  }
                }
              }
              st.result = stats;
              st.state = 'done';
              st.progress.current = '';
              st.message = '';
              st.notebooks.forEach(n => { if (ids.includes(n.id)) n.already = true; });
            }

            return {
              status: publicState,
              start,
              choose(ids) {
                if (st.state !== 'choose' && st.state !== 'done') throw Object.assign(new Error('Sign in to Microsoft first'), { status: 409 });
                ids = (Array.isArray(ids) ? ids : []).filter(id => st.notebooks.some(n => n.id === id));
                if (!ids.length) throw Object.assign(new Error('Pick at least one notebook'), { status: 400 });
                cancelFlag = false;
                runImport(ids).catch(fail);
                return publicState();
              },
              cancel() { cancelFlag = true; clearTimeout(pollTimer); if (st.state === 'signin' || st.state === 'choose' || st.state === 'error' || st.state === 'done') { st.state = 'idle'; st.message = ''; } return publicState(); },
              signOut() { cancelFlag = true; clearTimeout(pollTimer); kvSet('ms_refresh', ''); access = { token: '', expiresAt: 0 }; Object.assign(st, { state: clientId ? 'idle' : 'unconfigured', account: '', notebooks: [], userCode: '', message: '' }); return publicState(); }
            };
          }
          FEYNOS_EOF

          mkdir -p "$(dirname src/server/fileimport.mjs)"
          cat > src/server/fileimport.mjs <<'FEYNOS_EOF'
          // Feynos Notes - import uploaded files: OneNote (.one, .onetoc2, .onepkg, OneDrive .zip) and PDF
          // OneNote files are converted with one2html (MIT, github.com/msiemens/one2html); PDFs with Poppler.
          import { spawn } from 'node:child_process';
          import fs from 'node:fs/promises';
          import fss from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { tidyTags as tidyHtml, rid, COLORS } from './onenote.mjs';

          const MAX_IMAGE_BYTES = 12 * 1024 * 1024;
          const PDF_MAX_PAGES = 600;
          const PDF_PAGES_PER_NOTE = 40;
          const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp', webp: 'image/webp', svg: 'image/svg+xml', tif: 'image/tiff', tiff: 'image/tiff', emf: 'image/emf', wmf: 'image/wmf' };
          const decodeEntities = s => String(s || '').replace(/&(amp|lt|gt|quot|#39|#x27|apos);/g, m => ({ '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'", '&#x27;': "'", '&apos;': "'" }[m]));
          const escHtml = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const safeDecode = s => { try { return decodeURIComponent(s); } catch { return s; } };

          function run(cmd, args, opts = {}) {
            return new Promise((resolve, reject) => {
              const p = spawn(cmd, args, { cwd: opts.cwd, stdio: ['ignore', 'pipe', 'pipe'] });
              const out = []; let err = '';
              p.stdout.on('data', d => out.push(d));
              p.stderr.on('data', d => { err = (err + d).slice(-4000); });
              const timer = setTimeout(() => { p.kill('SIGKILL'); reject(new Error(`${cmd} took too long`)); }, opts.timeout || 15 * 60 * 1000);
              p.on('error', e => { clearTimeout(timer); reject(e.code === 'ENOENT' ? new Error(`${cmd} is not installed in this container`) : e); });
              p.on('close', code => {
                clearTimeout(timer);
                if (code === 0) resolve(Buffer.concat(out).toString('utf8'));
                else reject(new Error(`${cmd} failed: ${err.trim().split('\n').slice(-3).join(' ') || 'exit ' + code}`));
              });
            });
          }

          async function walk(dir) {
            const out = [];
            for (const e of await fs.readdir(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...await walk(p)); else out.push(p);
            }
            return out;
          }

          /* remove an element and everything inside it, counting nested tags of the same name */
          function removeElement(html, startIdx, tag) {
            const re = new RegExp(`<(/?)${tag}\\b[^>]*>`, 'gi');
            re.lastIndex = startIdx;
            let depth = 0, m;
            while ((m = re.exec(html))) {
              depth += m[1] ? -1 : 1;
              if (depth === 0) return html.slice(0, startIdx) + html.slice(re.lastIndex);
            }
            return html;
          }

          async function detectKind(file, name) {
            const fh = await fs.open(file, 'r');
            const buf = Buffer.alloc(16);
            await fh.read(buf, 0, 16, 0); await fh.close();
            if (buf.subarray(0, 4).toString('latin1') === '%PDF') return 'pdf';
            if (buf.subarray(0, 4).toString('latin1') === 'MSCF') return 'onepkg';
            if (buf[0] === 0x50 && buf[1] === 0x4b) return 'zip';
            const ext = path.extname(name).toLowerCase();
            if (ext === '.onetoc2') return 'onetoc2';
            if (ext === '.one') return 'one';
            if (ext === '.pdf') return 'pdf';
            return 'one';
          }

          export function createFileImporter({ dataDir, store, log }) {
            const jobs = new Map();
            const tmpRoot = path.resolve(dataDir, 'tmp');
            fss.rmSync(tmpRoot, { recursive: true, force: true }); // leftovers from a crash
            fss.mkdirSync(tmpRoot, { recursive: true });

            const pub = j => ({ ok: true, id: j.id, name: j.name, kind: j.kind, state: j.state, message: j.message, progress: j.progress, result: j.result });

            /* ---------------- writing records ---------------- */
            function ensureNotebook(id, name, stats) {
              if (!store.get(id)) {
                const order = store.maxOrder('notebook') + 1;
                store.write('notebook', id, { id, name, color: COLORS[order % COLORS.length], order, updated: Date.now() });
                stats.notebooks++;
              }
              return id;
            }
            function ensureSection(id, notebookId, name, color, order, stats) {
              if (!store.get(id)) {
                store.write('section', id, { id, notebookId, name, color: color || COLORS[(order + 1) % COLORS.length], order, updated: Date.now() });
                stats.sections++;
              }
              return id;
            }
            function writePage(id, data, stats) {
              const existing = store.get(id);
              if (existing && (existing.deleted || existing.updated >= data.updated)) { stats.skipped++; return; }
              store.write('page', id, { deleted: null, ...data, id }, data.updated);
              stats.pages++;
            }

            /* ---------------- PDF ---------------- */
            async function importPdf(job, file, work) {
              const info = await run('pdfinfo', [file]);
              let pages = parseInt((info.match(/^Pages:\s+(\d+)/m) || [])[1] || '0', 10);
              if (!pages) throw new Error("That PDF has no pages, or it's password protected.");
              if (pages > PDF_MAX_PAGES) { job.message = `Only the first ${PDF_MAX_PAGES} of ${pages} pages will be imported.`; pages = PDF_MAX_PAGES; }
              job.progress = { done: 0, total: pages, current: '' };
              const stats = { notebooks: 0, sections: 0, pages: 0, skipped: 0, failed: 0 };

              // where to put it: the section the person was looking at, or an "Imported" notebook
              let sectionId = job.sectionId && store.get(job.sectionId) && !store.get(job.sectionId).deleted ? job.sectionId : null;
              if (!sectionId) {
                const nb = ensureNotebook('imp-notebook', 'Imported', stats);
                sectionId = ensureSection('imp-pdfs', nb, 'PDFs', '#d2344a', 0, stats);
              }
              const title = job.name.replace(/\.pdf$/i, '');
              const parts = [];
              for (let i = 1; i <= pages; i++) {
                if (job.cancel) throw new Error('cancelled');
                job.progress.current = `Page ${i} of ${pages}`;
                const text = (await run('pdftotext', ['-f', String(i), '-l', String(i), '-enc', 'UTF-8', file, '-']).catch(() => '')).replace(/\f/g, '').trim();
                let html = '';
                if (job.mode === 'text') {
                  const paras = text.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
                  html = paras.map(p => `<p>${escHtml(p)}</p>`).join('') || '<p><i>(no text on this page)</i></p>';
                  if (i < pages) html += '<hr>';
                } else {
                  const prefix = path.join(work, 'pg');
                  await run('pdftoppm', ['-f', String(i), '-l', String(i), '-r', '110', '-jpeg', '-jpegopt', 'quality=80', '-singlefile', file, prefix]);
                  const img = await fs.readFile(prefix + '.jpg');
                  await fs.unlink(prefix + '.jpg').catch(() => {});
                  html = `<p><img src="data:image/jpeg;base64,${img.toString('base64')}" alt="Page ${i}" style="width:100%"></p>`;
                  if (text) html += `<div class="pdf-text" hidden>${escHtml(text)}</div>`;
                }
                parts.push(html);
                job.progress.done = i;
              }
              // very long PDFs become several notes so each one stays quick to open and sync
              const chunks = [];
              for (let i = 0; i < parts.length; i += PDF_PAGES_PER_NOTE) chunks.push(parts.slice(i, i + PDF_PAGES_PER_NOTE));
              const base = store.maxOrder('page:' + sectionId) + 1;
              const stamp = Date.now();
              chunks.forEach((c, k) => {
                const id = 'pdf' + crypto.randomBytes(8).toString('hex');
                writePage(id, {
                  sectionId, title: chunks.length > 1 ? `${title} (part ${k + 1} of ${chunks.length})` : title,
                  html: c.join(''), level: 0, order: base + k, created: stamp, updated: stamp
                }, stats);
              });
              return stats;
            }

            /* ---------------- OneNote ---------------- */
            async function oneNoteInputs(job, file, work) {
              const ext = { one: '.one', onetoc2: '.onetoc2', onepkg: '.onepkg' }[job.kind];
              if (ext) {
                const named = path.join(work, 'in', path.basename(job.name, path.extname(job.name)).replace(/[^\w .-]+/g, '_') + ext);
                await fs.mkdir(path.dirname(named), { recursive: true });
                await fs.rename(file, named);
                return [named];
              }
              // OneDrive "Download" of a notebook: a zip full of .one files (and maybe .onetoc2)
              const dir = path.join(work, 'unzip');
              await fs.mkdir(dir, { recursive: true });
              await run('unzip', ['-qq', '-o', file, '-d', dir]);
              const files = (await walk(dir)).filter(f => !/OneNote_RecycleBin/i.test(f));
              const one = files.filter(f => /\.one$/i.test(f));
              const toc = files.filter(f => /\.onetoc2$/i.test(f)).sort((a, b) => a.split(path.sep).length - b.split(path.sep).length);
              const pkg = files.filter(f => /\.onepkg$/i.test(f));
              if (pkg.length) return pkg;
              // the top-most table of contents describes the whole notebook (sections + groups)
              if (toc.length) return [toc[0]];
              if (one.length) return one;
              throw new Error("That zip doesn't contain any OneNote files.");
            }

            async function importOneNote(job, file, work) {
              job.progress = { done: 0, total: 0, current: 'Converting OneNote file…' };
              const inputs = await oneNoteInputs(job, file, work);
              const out = path.join(work, 'out');
              await run('one2html', ['-i', ...inputs, '-o', out, '--note-tag-icons', 'emoji']);

              const htmlFiles = (await walk(out)).filter(f => f.toLowerCase().endsWith('.html'));
              const docs = new Map();
              for (const f of htmlFiles) docs.set(f, await fs.readFile(f, 'utf8'));
              const linksOf = (file, html, target) => {
                const re = new RegExp(`<a href="([^"]*)" target="${target}"(?: class="l(\\d+)( warnings)?")?[^>]*>`, 'g');
                return [...html.matchAll(re)].map(m => ({ file: path.resolve(path.dirname(file), m[1].split('/').map(safeDecode).join(path.sep)), level: parseInt(m[2] || '1', 10), warnings: !!m[3], raw: m[0] }));
              };
              const titleOf = html => decodeEntities((html.match(/<title>([\s\S]*?)<\/title>/i) || [])[1] || '').trim();

              // notebook tables of contents link to sections; section ones link to pages
              const sectionNotebook = new Map(); // section toc file -> {name, dir, color}
              const notebooks = [];
              for (const [f, html] of docs) {
                if (!html.includes('target="section"')) continue;
                const nbName = titleOf(html) || 'Imported notebook';
                notebooks.push(nbName);
                for (const m of html.matchAll(/<li style="([^"]*)">\s*<a href="([^"]*)\.html" target="section"/g)) {
                  const tocFile = path.resolve(path.dirname(f), m[2].split('/').map(safeDecode).join(path.sep) + '.html');
                  const c = m[1].match(/border-left-color:\s*rgba\((\d+),\s*(\d+),\s*(\d+)/);
                  const color = c ? '#' + [c[1], c[2], c[3]].map(x => (+x).toString(16).padStart(2, '0')).join('') : null;
                  sectionNotebook.set(tocFile, { name: nbName, dir: path.join(path.dirname(f), path.basename(f, '.html')), color });
                }
              }
              const sections = [];
              for (const [f, html] of docs) {
                if (!html.includes('target="content"')) continue;
                const pages = linksOf(f, html, 'content').filter(l => !l.warnings && docs.has(l.file));
                sections.push({ file: f, name: titleOf(html) || path.basename(f, '.html'), pages, nb: sectionNotebook.get(f) });
              }
              if (!sections.length) throw new Error('No pages were found in that file.');
              job.progress.total = sections.reduce((a, s) => a + s.pages.length, 0);

              const stats = { notebooks: 0, sections: 0, pages: 0, skipped: 0, failed: 0 };
              const fallbackNb = path.basename(job.name, path.extname(job.name)) || 'Imported notebook';
              const secOrder = new Map();
              for (const sec of sections.sort((a, b) => a.file.localeCompare(b.file))) {
                const nbName = sec.nb ? sec.nb.name : fallbackNb;
                const nbId = ensureNotebook(rid('notebook', 'file:' + nbName), nbName, stats);
                // sections inside section groups get the group's name in front
                let secName = sec.name;
                if (sec.nb) {
                  const rel = path.relative(sec.nb.dir, path.dirname(sec.file));
                  if (rel && !rel.startsWith('..')) secName = rel.split(path.sep).join(' › ') + ' › ' + secName;
                }
                const ord = secOrder.get(nbId) || 0; secOrder.set(nbId, ord + 1);
                const secId = ensureSection(rid('section', 'file:' + nbName + '/' + secName), nbId, secName, sec.nb && sec.nb.color, store.maxOrder('section:' + nbId) + 1, stats);

                const minLevel = Math.min(...sec.pages.map(p => p.level), 1);
                let order = 0;
                for (const link of sec.pages) {
                  if (job.cancel) throw new Error('cancelled');
                  const raw = docs.get(link.file);
                  const title = titleOf(raw);
                  job.progress.current = `${nbName} › ${secName} › ${title || 'Untitled page'}`;
                  try {
                    const meta = n => (raw.match(new RegExp(`<meta name="${n}" content="([^"]*)"`)) || [])[1] || '';
                    const pageKey = meta('X-Original-Page-Id') || (secName + '/' + title + '/' + order);
                    const updated = Date.parse(meta('X-Updated-Time')) || Date.now();
                    const created = Date.parse(meta('X-Created-Time')) || updated;
                    writePage(rid('page', 'file:' + nbName + '/' + pageKey), {
                      sectionId: secId, title, html: await convertOne2HtmlPage(raw, path.dirname(link.file)),
                      level: link.level > minLevel ? 1 : 0, order: order, created, updated
                    }, stats);
                  } catch (e) {
                    log(`page failed (${title}):`, e.message);
                    stats.failed++;
                  }
                  order++;
                  job.progress.done++;
                }
              }
              return stats;
            }

            /* one2html page -> Feynos Notes page body */
            async function convertOne2HtmlPage(raw, dir) {
              let body = (raw.match(/<body[^>]*>([\s\S]*?)(<script\b|<\/body>)/i) || [])[1] || '';
              // the page title is already the note's title
              const t = body.search(/<div class="title"/);
              if (t >= 0) body = removeElement(body, t, 'div');
              // embedded audio/video/files: note them, they aren't imported
              body = body.replace(/<(audio|video)\b[^>]*src="([^"]*)"[^>]*>(?:[\s\S]*?<\/\1>)?/gi, (a, tag, src) => `<p>📎 ${escHtml(safeDecode(src))} <i>(attachment not imported)</i></p>`);
              body = body.replace(/<embed\b[^>]*src="([^"]*)"[^>]*\/?>/gi, (a, src) => `<p>📎 ${escHtml(safeDecode(src))} <i>(attachment not imported)</i></p>`);
              // pictures: embed the files one2html wrote next to the page
              const imgs = [...body.matchAll(/<img\b[^>]*>/gi)];
              let out = ''; let last = 0;
              for (const im of imgs) {
                out += body.slice(last, im.index); last = im.index + im[0].length;
                const src = (im[0].match(/\ssrc="([^"]*)"/i) || [])[1] || '';
                const rest = im[0].replace(/\ssrc="[^"]*"/i, '');
                if (/^data:image\//i.test(src)) { out += im[0]; continue; }
                const file = path.resolve(dir, safeDecode(decodeEntities(src)));
                const ext = path.extname(file).slice(1).toLowerCase();
                let data = null;
                if (file.startsWith(dir + path.sep)) {
                  try { const st = await fs.stat(file); if (st.size <= MAX_IMAGE_BYTES) data = await fs.readFile(file); } catch { /* missing */ }
                }
                const mime = MIME[ext] || (data && data[0] === 0x89 ? 'image/png' : data && data[0] === 0xff ? 'image/jpeg' : null);
                out += data && mime && !['image/emf', 'image/wmf', 'image/tiff'].includes(mime)
                  ? rest.replace(/^<img/i, `<img src="data:${mime};base64,${data.toString('base64')}"`)
                  : `<p><i>[picture couldn't be imported]</i></p>`;
              }
              out += body.slice(last);
              // OneNote's canvas positions and fonts don't apply to a flowing page
              out = tidyHtml(out);
              // emoji check boxes from note tags -> real to-do items
              for (let guard = 0; guard < 5000; guard++) {
                const i = out.search(/<span class="note-tag-icon/);
                if (i < 0) break;
                const open = out.slice(i, out.indexOf('>', i) + 1);
                const done = /aria-checked="true"/.test(open);
                const isBox = /-checkbox/.test(open);
                const inner = out.slice(i).match(/<span class="text">([^<]*)<\/span>/);
                const symbol = isBox ? (done ? '☑' : '☐') : (inner ? inner[1] : '');
                out = removeElement(out, i, 'span');
                out = out.slice(0, i) + (symbol ? symbol + ' ' : '') + out.slice(i);
              }
              // lines that start with a check box become real to-do items
              out = out.replace(/<(div|p)\b([^>]*)>\s*(☐|☑)\s*((?:(?!<\/?(?:div|p)\b)[\s\S])*?)<\/\1>/g,
                (m, tag, a, box, inner) => `<ul class="todo"><li data-done="${box === '☑'}">${inner.trim()}</li></ul>`);
              out = out.replace(/<\/ul>\s*<ul class="todo">/g, '');
              return out.replace(/<div>\s*<\/div>/gi, '').trim();
            }

            /* ---------------- jobs ---------------- */
            async function runJob(job, file) {
              const work = path.join(tmpRoot, job.id);
              try {
                job.kind = await detectKind(file, job.name);
                job.state = 'importing';
                job.result = job.kind === 'pdf' ? await importPdf(job, file, work) : await importOneNote(job, file, work);
                job.state = 'done';
                job.progress.current = '';
              } catch (e) {
                job.state = 'error';
                job.message = e.message === 'cancelled' ? 'Import stopped.' : e.message;
                if (e.message !== 'cancelled') log('file import failed:', e);
              } finally {
                fs.rm(work, { recursive: true, force: true }).catch(() => {});
                fs.rm(file, { force: true }).catch(() => {});
                // keep only recent jobs
                const ids = [...jobs.keys()]; while (ids.length > 30) jobs.delete(ids.shift());
              }
            }

            return {
              tmpDir: tmpRoot,
              newUploadPath() { return path.join(tmpRoot, 'upload-' + crypto.randomBytes(8).toString('hex')); },
              start({ file, name, mode, sectionId }) {
                const job = {
                  id: crypto.randomBytes(6).toString('hex'), name: String(name || 'import').slice(0, 200), kind: '',
                  mode: mode === 'text' ? 'text' : 'look', sectionId: sectionId || '', state: 'converting', message: '',
                  progress: { done: 0, total: 0, current: 'Reading the file…' }, result: null, cancel: false
                };
                fss.mkdirSync(path.join(tmpRoot, job.id), { recursive: true });
                jobs.set(job.id, job);
                runJob(job, file);
                return pub(job);
              },
              status(id) { const j = jobs.get(id); return j ? pub(j) : null; },
              cancel(id) { const j = jobs.get(id); if (j) j.cancel = true; return j ? pub(j) : null; }
            };
          }
          FEYNOS_EOF

          mkdir -p "$(dirname src/server/Dockerfile)"
          cat > src/server/Dockerfile <<'FEYNOS_EOF'
          # ---- stage 1: build one2html (MIT, github.com/msiemens/one2html) for OneNote file import ----
          FROM rust:1-alpine AS one2html
          RUN apk add --no-cache musl-dev git
          # (the default "backtrace" feature needs nightly Rust, so it's left out)
          RUN cargo install --locked --root /out --no-default-features --features bin,native-fs,onepkg \
                --git https://github.com/msiemens/one2html --rev 5beb00ee051793910736f8be3afeb27c108c247e one2html

          # ---- stage 2: the sync server ----
          FROM node:24-alpine
          LABEL org.opencontainers.image.source="https://github.com/Feynos-Lin/feynos-note" \
                org.opencontainers.image.title="Feynos Notes sync server" \
                org.opencontainers.image.description="Self-hosted sync for Feynos Notes, with OneNote and PDF import"
          # poppler-utils: PDF import, unzip: OneDrive notebook downloads
          RUN apk add --no-cache poppler-utils unzip
          COPY --from=one2html /out/bin/one2html /usr/local/bin/one2html
          WORKDIR /app
          COPY server.mjs onenote.mjs fileimport.mjs ./
          ENV NODE_ENV=production PORT=8787 DATA_DIR=/data NODE_NO_WARNINGS=1
          RUN mkdir -p /data && chown node:node /data
          USER node
          VOLUME /data
          EXPOSE 8787
          HEALTHCHECK --interval=30s --timeout=5s --start-period=10s CMD wget -qO- http://127.0.0.1:8787/api/health > /dev/null || exit 1
          CMD ["node", "server.mjs"]
          FEYNOS_EOF

          mkdir -p "$(dirname src/server/docker-compose.yml)"
          cat > src/server/docker-compose.yml <<'FEYNOS_EOF'
          # Feynos Notes sync server
          # 1. Put this file in a folder on your server (e.g. C:\docker\feynos-notes)
          # 2. Change FEYNOS_PASSWORD below
          # 3. Run:  docker compose up -d
          # 4. In the app: Settings -> Sync -> enter your address and password
          services:
            feynos-notes-sync:
              image: ghcr.io/feynos-lin/feynos-note-sync:latest
              container_name: feynos-notes-sync
              restart: unless-stopped
              ports:
                - "8787:8787"            # remove this if your reverse proxy shares a Docker network with it
              environment:
                FEYNOS_PASSWORD: "change-me-to-something-long"
                TRUST_PROXY: "true"      # use X-Forwarded-For from your reverse proxy for logs and login rate limiting
                # BASE_PATH: "/notes"    # only if you serve it under a sub-path, like https://example.com/notes
                MAX_BODY_MB: "200"       # biggest single upload (pages with lots of pictures)
                # MS_CLIENT_ID: ""       # enables "Import from OneNote" - see the README
                # MS_TENANT: "common"
              volumes:
                - ./feynos-notes-data:/data
          FEYNOS_EOF

