      - name: Stamp version
        shell: bash
        run: |
          sed -i "s/__APP_VERSION__/$APP_VERSION/" src/www/app.js
          find src -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: src
          retention-days: 3

  android:
    name: Android APK
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Keep the debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: feynos-notes-debug-keystore

      - name: Create Capacitor project
        shell: bash
        run: |
          mkdir app && cd app
          cp ../src/android/package.json ../src/android/capacitor.config.json ../src/android/cap-entry.js .
          cp -r ../src/www ./www
          npm install --no-audit --no-fund
          npx esbuild cap-entry.js --bundle --format=iife --minify --target=chrome90 --outfile=www/cap-bundle.js
          npx cap add android
          npx cap sync android
          pip install --quiet pillow
          python3 ../src/android/make_icons.py www/icon.png android/app/src/main/res

      - name: Set version
        shell: bash
        run: |
          cd app/android/app
          sed -i -E "s/versionCode [0-9]+/versionCode $GITHUB_RUN_NUMBER/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Build APK
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd app/android
          chmod +x gradlew
          mkdir -p ../../out
          if [ -n "$KS_B64" ]; then
            echo "Building release APK signed with your key"
            ./gradlew assembleRelease --no-daemon
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            echo "$KS_B64" | base64 -d > release.jks
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS --out "../../out/FeynosNotes-$APP_VERSION.apk" aligned.apk
            rm -f release.jks
          else
            echo "No signing secrets - building debug-signed APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../../out/FeynosNotes-$APP_VERSION.apk"
          fi
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  linux:
    name: Fedora RPM
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build RPM
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          trap 'echo "::error title=Step failed::$BASH_COMMAND"' ERR
          mkdir app && cd app
          cp ../src/desktop/main.js ../src/desktop/preload.js ../src/desktop/package.json .
          cp -r ../src/www ./www
          mkdir -p build && cp www/icon.png build/icon.png
          npm pkg set version="$APP_VERSION"
          npm install --save-dev --no-audit --no-fund electron electron-builder
          npx electron-builder --linux rpm --x64 --publish never > eb.log 2>&1 || {
            cat eb.log
            echo "::error title=electron-builder failed::$(tail -40 eb.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          cat eb.log
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/dist/*.rpm

  windows:
    name: Windows installer
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          trap 'echo "::error title=Step failed::$BASH_COMMAND"' ERR
          mkdir app && cd app
          cp ../src/desktop/main.js ../src/desktop/preload.js ../src/desktop/package.json .
          cp -r ../src/www ./www
          mkdir -p build && cp www/icon.png build/icon.png
          npm pkg set version="$APP_VERSION"
          npm install --save-dev --no-audit --no-fund electron electron-builder
          npx electron-builder --win nsis --x64 --publish never > eb.log 2>&1 || {
            cat eb.log
            echo "::error title=electron-builder failed::$(tail -40 eb.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          cat eb.log
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/*.exe

  release:
    name: Publish release
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{android,linux,windows}"
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Feynos Notes ${{ env.APP_VERSION }}
          body: |
            **Android:** install the `.apk`.
            **Fedora:** `sudo dnf install ./FeynosNotes-*.rpm`
            **Windows:** run the `.exe` installer.

            Backups: Settings (gear icon) → Backup. On desktop, add your Google Drive / Proton Drive folders. On Android, tap Back up now and pick Drive or Proton Drive.
          files: artifacts/*
