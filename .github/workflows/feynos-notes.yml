# =====================================================================
#  Feynos Notes - OneNote-style notes app
#  One workflow builds everything:
#    * Android APK   (Capacitor)
#    * Fedora .rpm   (Electron)
#    * Windows installer .exe (Electron + NSIS)
#    * Sync server Docker image -> ghcr.io/feynos-lin/feynos-note-sync
#  and publishes them to a GitHub release.
#
#  All app source lives inside this file (step "Write app source").
#  Optional Android signing secrets (keep the same key so updates install
#  over the old app): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#  ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# =====================================================================
name: Feynos Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  source:
    name: Write app source
    runs-on: ubuntu-latest
    steps:
      - name: Write app source
        shell: bash
        run: |
          mkdir -p "$(dirname src/www/index.html)"
          cat > src/www/index.html <<'FEYNOS_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
          <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' data: blob: https: http:">
          <meta name="theme-color" content="#5b2a86">
          <title>Feynos Notes</title>
          <link rel="stylesheet" href="styles.css">
          </head>
          <body>
          <div id="app" data-view="nav">

            <!-- ============ NOTEBOOKS / SECTIONS ============ -->
            <aside id="navPane" class="pane">
              <header class="pane-head brand">
                <div class="logo" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z" fill="currentColor" opacity=".25"/><path d="M5 3h11l3 3v15H5zM8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
                </div>
                <span class="brand-name">Feynos Notes</span>
                <button class="icon-btn sync-btn" id="btnSync" data-state="off" title="Sync" aria-label="Sync status" hidden>
                  <svg viewBox="0 0 24 24" class="sync-ico"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/></svg>
                  <span class="sync-dot"></span>
                </button>
                <button class="icon-btn" id="btnSettings" title="Settings &amp; backup" aria-label="Settings and backup">
                  <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                </button>
              </header>

              <div class="search-wrap">
                <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input id="searchInput" type="search" placeholder="Search all notes" autocomplete="off" spellcheck="false">
              </div>

              <div id="notebookTree" class="tree" role="tree"></div>

              <footer class="pane-foot">
                <button class="text-btn" id="btnNewNotebook">
                  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Notebook
                </button>
                <button class="text-btn" id="btnImport" title="Import from OneNote or PDF">
                  <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg> Import
                </button>
                <button class="text-btn" id="btnBin" title="Recycle bin">
                  <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg> <span id="binCount">Bin</span>
                </button>
              </footer>
            </aside>

            <!-- ============ PAGES ============ -->
            <section id="pagesPane" class="pane">
              <header class="pane-head">
                <button class="icon-btn mobile-only" id="btnBackToNav" aria-label="Back to notebooks">
                  <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
                <div class="pane-title">
                  <span id="pagesHeading">Pages</span>
                  <small id="pagesSub"></small>
                </div>
                <button class="icon-btn accent" id="btnNewPage" title="New page (Ctrl+N)" aria-label="New page">
                  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
              </header>
              <div id="pageList" class="page-list"></div>
            </section>

            <!-- ============ EDITOR ============ -->
            <main id="editorPane" class="pane">
              <header class="pane-head editor-head">
                <button class="icon-btn mobile-only" id="btnBackToPages" aria-label="Back to pages">
                  <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
                <div class="crumbs" id="crumbs"></div>
                <span class="save-state" id="saveState"></span>
              </header>

              <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
                <div class="tb-group">
                  <button data-cmd="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
                  <button data-cmd="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
                </div>
                <div class="tb-group">
                  <select id="blockStyle" title="Paragraph style" aria-label="Paragraph style">
                    <option value="p">Normal</option>
                    <option value="h1">Heading 1</option>
                    <option value="h2">Heading 2</option>
                    <option value="h3">Heading 3</option>
                    <option value="blockquote">Quote</option>
                    <option value="pre">Code</option>
                  </select>
                </div>
                <div class="tb-group">
                  <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
                  <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
                  <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
                  <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
                  <label class="color-btn" title="Text color">
                    <span class="swatch-a">A<span class="bar" id="foreBar"></span></span>
                    <input type="color" id="foreColor" value="#c0392b">
                  </label>
                  <label class="color-btn" title="Highlight">
                    <svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h16" id="hiliteBar" stroke-width="3"/></svg>
                    <input type="color" id="hiliteColor" value="#fff176">
                  </label>
                  <button data-cmd="removeFormat" title="Clear formatting"><svg viewBox="0 0 24 24"><path d="M6 5h12M12 5l-4 14M4 20l16-16"/></svg></button>
                </div>
                <div class="tb-group">
                  <button data-cmd="insertUnorderedList" title="Bulleted list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
                  <button data-cmd="insertOrderedList" title="Numbered list"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 4h1v4M4 8h2M3.5 14.5a1.2 1.2 0 0 1 2.3.5L3.5 18h2.5" stroke-width="1.4"/></svg></button>
                  <button data-act="todo" title="To-do checkbox (Ctrl+1)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><path d="M4.5 7.5l1.5 1.5 3-3"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M13 7.5h8M13 17.5h8"/></svg></button>
                  <button data-cmd="outdent" title="Decrease indent"><svg viewBox="0 0 24 24"><path d="M11 6h10M11 12h10M11 18h10M7 9l-3 3 3 3"/></svg></button>
                  <button data-cmd="indent" title="Increase indent"><svg viewBox="0 0 24 24"><path d="M11 6h10M11 12h10M11 18h10M4 9l3 3-3 3"/></svg></button>
                </div>
                <div class="tb-group">
                  <button data-act="tag-important" title="Tag: Important"><span class="tb-tag">★</span></button>
                  <button data-act="tag-question" title="Tag: Question"><span class="tb-tag">?</span></button>
                  <button data-act="tag-idea" title="Tag: Idea"><span class="tb-tag">💡</span></button>
                </div>
                <div class="tb-group">
                  <button data-act="link" title="Link (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
                  <button data-act="image" title="Insert picture"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
                  <button data-act="sketch" title="Draw / sketch"><svg viewBox="0 0 24 24"><path d="M3 21c3-1 4-4 7-4s2 3 5 3 4-3 6-5"/><path d="M14 3l4 4-8 8H6v-4z"/></svg></button>
                  <button data-act="table" title="Insert table"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg></button>
                  <button data-act="hr" title="Divider line"><svg viewBox="0 0 24 24"><path d="M3 12h18"/></svg></button>
                  <button data-act="date" title="Insert date &amp; time"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
                </div>
                <div class="tb-group table-tools" id="tableTools" hidden>
                  <button data-act="row-add" title="Add row below">+Row</button>
                  <button data-act="col-add" title="Add column right">+Col</button>
                  <button data-act="row-del" title="Delete row">−Row</button>
                  <button data-act="col-del" title="Delete column">−Col</button>
                </div>
              </div>

              <div class="paper-scroll" id="paperScroll">
                <article class="paper" id="paper">
                  <input id="pageTitle" class="page-title" placeholder="Untitled page" autocomplete="off">
                  <div class="page-meta" id="pageMeta"></div>
                  <div id="editor" class="editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing…"></div>
                </article>
                <div class="empty-state" id="emptyState" hidden>
                  <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5zM8 8h8M8 12h8M8 16h5"/></svg>
                  <p id="emptyText">Pick a page, or create one.</p>
                  <button class="btn primary" id="btnEmptyNew">New page</button>
                </div>
              </div>
            </main>
          </div>

          <!-- ============ OVERLAYS ============ -->
          <div id="menu" class="menu" hidden role="menu"></div>
          <div id="linkChip" class="link-chip" hidden><button id="linkOpen">Open link ↗</button><button id="linkEdit">Edit</button><button id="linkRemove">Remove</button></div>
          <div id="toast" class="toast" hidden></div>

          <div id="modalRoot" class="modal-root" hidden>
            <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
          </div>

          <input type="file" id="imgInput" accept="image/*" hidden multiple>
          <input type="file" id="restoreInput" hidden>
          <input type="file" id="importInput" accept=".one,.onetoc2,.onepkg,.zip,.pdf,application/pdf,application/zip" hidden>

          <script src="cap-bundle.js"></script>
          <script src="platform.js"></script>
          <script src="store.js"></script>
          <script src="sync.js"></script>
          <script src="updater.js"></script>
          <script src="sketch.js"></script>
          <script src="app.js"></script>
          </body>
          </html>
          FEYNOS_EOF

          mkdir -p "$(dirname src/www/styles.css)"
          cat > src/www/styles.css <<'FEYNOS_EOF'
          /* ===================== Feynos Notes ===================== */
          :root {
            --accent: #7b3fb0;
            --accent-strong: #5b2a86;
            --accent-soft: #efe5f8;
            --bg: #f4f2f7;
            --pane: #fbfafc;
            --pane-2: #f1edf5;
            --paper: #ffffff;
            --line: #e2dce9;
            --line-strong: #cfc6da;
            --text: #221d29;
            --text-2: #5e5669;
            --text-3: #8f879a;
            --hover: rgba(91, 42, 134, .07);
            --selected: rgba(123, 63, 176, .14);
            --shadow: 0 10px 30px rgba(30, 10, 50, .16), 0 2px 6px rgba(30, 10, 50, .08);
            --danger: #c0392b;
            --ok: #2e8b57;
            --code-bg: #f3f0f6;
            --rule-color: rgba(123, 63, 176, .07);
            --radius: 10px;
            --font: "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Noto Sans", Cantarell, system-ui, sans-serif;
            --mono: "Cascadia Code", "JetBrains Mono", "Fira Code", ui-monospace, monospace;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light;
          }
          :root[data-theme="dark"] {
            --accent: #b98be3;
            --accent-strong: #cfa9f2;
            --accent-soft: #3a2a4c;
            --bg: #141117;
            --pane: #1b171f;
            --pane-2: #221d28;
            --paper: #1f1b24;
            --line: #2f2837;
            --line-strong: #43394e;
            --text: #ece7f2;
            --text-2: #b6abc2;
            --text-3: #85798f;
            --hover: rgba(185, 139, 227, .08);
            --selected: rgba(185, 139, 227, .17);
            --shadow: 0 12px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
            --code-bg: #2a2431;
            --rule-color: rgba(185, 139, 227, .06);
            color-scheme: dark;
          }

          * { box-sizing: border-box; }
          html, body { height: 100%; margin: 0; }
          body {
            font-family: var(--font);
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
          }
          svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
          button { font: inherit; color: inherit; }
          [hidden] { display: none !important; }

          /* ------------- layout ------------- */
          #app {
            display: grid;
            grid-template-columns: 260px 270px 1fr;
            height: 100%;
            padding-top: var(--safe-top);
          }
          .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
          #navPane { background: var(--pane-2); border-right: 1px solid var(--line); }
          #pagesPane { background: var(--pane); border-right: 1px solid var(--line); }
          #editorPane { background: var(--bg); }

          .pane-head {
            display: flex; align-items: center; gap: 8px;
            min-height: 56px; padding: 8px 10px 8px 14px;
            border-bottom: 1px solid var(--line);
          }
          .brand { color: var(--accent-strong); }
          .logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; }
          :root[data-theme="dark"] .logo { color: #1b171f; }
          .logo svg { width: 20px; height: 20px; }
          .brand-name { font-weight: 700; font-size: 16px; letter-spacing: .2px; flex: 1; color: var(--text); }
          .pane-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
          .pane-title span { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
          .pane-title small { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

          .icon-btn {
            width: 36px; height: 36px; border-radius: 9px; border: 0; background: transparent;
            display: grid; place-items: center; cursor: pointer; color: var(--text-2); flex: none;
          }
          .icon-btn:hover { background: var(--hover); color: var(--text); }
          .icon-btn.accent { background: var(--accent); color: #fff; }
          :root[data-theme="dark"] .icon-btn.accent { color: #1b171f; }
          .icon-btn.accent:hover { filter: brightness(1.08); background: var(--accent); }
          .mobile-only { display: none; }

          .text-btn {
            display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent;
            padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text-2); font-size: 14px;
          }
          .text-btn:hover { background: var(--hover); color: var(--text); }
          .text-btn svg { width: 18px; height: 18px; }

          /* ------------- search ------------- */
          .search-wrap { position: relative; margin: 10px 10px 4px; }
          .search-ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-3); }
          #searchInput {
            width: 100%; height: 36px; border-radius: 9px; border: 1px solid var(--line);
            background: var(--pane); color: var(--text); padding: 0 10px 0 34px; font: inherit; font-size: 14px; outline: none;
          }
          #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

          /* ------------- notebook tree ------------- */
          .tree { flex: 1; overflow-y: auto; padding: 6px 6px 12px; }
          .nb { margin-bottom: 2px; }
          .nb-row, .sec-row {
            display: flex; align-items: center; gap: 8px; border-radius: 8px; cursor: pointer;
            padding: 0 4px 0 6px; min-height: 36px; position: relative; user-select: none;
          }
          .nb-row:hover, .sec-row:hover { background: var(--hover); }
          .nb-row .chev { width: 16px; height: 16px; color: var(--text-3); transition: transform .15s; }
          .nb.collapsed .chev { transform: rotate(-90deg); }
          .nb-icon { width: 22px; height: 26px; border-radius: 3px 5px 5px 3px; flex: none; position: relative; box-shadow: inset 3px 0 0 rgba(0,0,0,.18); }
          .nb-name { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
          .secs { padding-left: 22px; }
          .nb.collapsed .secs { display: none; }
          .sec-row { min-height: 34px; }
          .sec-dot { width: 10px; height: 22px; border-radius: 3px; flex: none; }
          .sec-name { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
          .sec-row.active { background: var(--selected); }
          .sec-row.active .sec-name { color: var(--text); font-weight: 600; }
          .row-more {
            width: 28px; height: 28px; border-radius: 7px; border: 0; background: transparent; cursor: pointer;
            display: grid; place-items: center; color: var(--text-3); opacity: 0;
          }
          .nb-row:hover .row-more, .sec-row:hover .row-more, .page-item:hover .row-more, .row-more:focus { opacity: 1; }
          .row-more:hover { background: var(--hover); color: var(--text); }
          .row-more svg { width: 18px; height: 18px; }
          .add-sec { color: var(--text-3); font-size: 13px; }
          .add-sec .sec-name { color: var(--text-3); }
          .add-sec svg { width: 14px; height: 14px; margin: 0 -2px 0 -2px; }
          .tree-empty { color: var(--text-3); font-size: 14px; padding: 18px 12px; line-height: 1.5; }

          .pane-foot { display: flex; justify-content: space-between; padding: 6px; border-top: 1px solid var(--line); padding-bottom: calc(6px + var(--safe-bottom)); }

          /* ------------- page list ------------- */
          .page-list { flex: 1; overflow-y: auto; padding: 6px; }
          .page-item {
            display: flex; align-items: flex-start; gap: 6px; border-radius: 9px; padding: 9px 4px 9px 12px;
            cursor: pointer; position: relative; border-left: 3px solid transparent; margin-bottom: 1px;
          }
          .page-item:hover { background: var(--hover); }
          .page-item.active { background: var(--selected); border-left-color: var(--accent); }
          .page-item.sub { margin-left: 18px; }
          .page-text { flex: 1; min-width: 0; }
          .page-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
          .page-name.untitled { color: var(--text-3); font-style: italic; font-weight: 500; }
          .page-snippet { font-size: 12.5px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
          .page-date { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
          .page-item .row-more { margin-top: -3px; }
          .list-empty { color: var(--text-3); text-align: center; padding: 40px 18px; line-height: 1.6; font-size: 14px; }
          .search-hit mark, .page-snippet mark { background: #ffe58a; color: #222; border-radius: 3px; padding: 0 1px; }
          .result-path { font-size: 11.5px; color: var(--accent-strong); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

          /* ------------- editor chrome ------------- */
          .editor-head { gap: 6px; padding-left: 16px; }
          .crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
          .crumbs .crumb-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
          .crumbs b { color: var(--text-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
          .save-state { font-size: 12px; color: var(--text-3); white-space: nowrap; }

          .toolbar {
