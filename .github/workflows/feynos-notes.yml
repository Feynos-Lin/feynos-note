          mkdir -p "$(dirname src/android/native/ApkUpdaterPlugin.java)"
          cat > src/android/native/ApkUpdaterPlugin.java <<'FEYNOS_EOF'
          package com.feynos.notes;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          /** Downloads a new APK from GitHub Releases and hands it to the Android installer. */
          @CapacitorPlugin(name = "ApkUpdater")
          public class ApkUpdaterPlugin extends Plugin {

              @PluginMethod
              public void canInstall(PluginCall call) {
                  boolean allowed = Build.VERSION.SDK_INT < 26 || getContext().getPackageManager().canRequestPackageInstalls();
                  JSObject r = new JSObject();
                  r.put("allowed", allowed);
                  call.resolve(r);
              }

              @PluginMethod
              public void openInstallSettings(PluginCall call) {
                  Intent i;
                  if (Build.VERSION.SDK_INT >= 26) {
                      i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                  } else {
                      i = new Intent(Settings.ACTION_SECURITY_SETTINGS);
                  }
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null || !url.startsWith("https://")) { call.reject("Invalid download address"); return; }
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          File dir = new File(getContext().getCacheDir(), "updates");
                          if (!dir.exists() && !dir.mkdirs()) throw new Exception("Can't create the download folder");
                          File[] old = dir.listFiles();
                          if (old != null) for (File f : old) f.delete();
                          File out = new File(dir, "feynos-notes-update.apk");

                          // follow GitHub's redirects to its download servers ourselves (they change host)
                          String current = url;
                          for (int hop = 0; hop < 6; hop++) {
                              conn = (HttpURLConnection) new URL(current).openConnection();
                              conn.setInstanceFollowRedirects(false);
                              conn.setConnectTimeout(20000);
                              conn.setReadTimeout(60000);
                              conn.setRequestProperty("User-Agent", "FeynosNotes-Updater");
                              int code = conn.getResponseCode();
                              if (code >= 300 && code < 400) {
                                  String loc = conn.getHeaderField("Location");
                                  conn.disconnect();
                                  if (loc == null || !loc.startsWith("https://")) throw new Exception("Bad redirect");
                                  current = loc;
                                  continue;
                              }
                              if (code != 200) throw new Exception("Download failed (HTTP " + code + ")");
                              break;
                          }

                          long total = conn.getContentLengthLong();
                          long done = 0;
                          int lastPct = -1;
                          try (InputStream in = conn.getInputStream(); OutputStream os = new FileOutputStream(out)) {
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) {
                                  os.write(buf, 0, n);
                                  done += n;
                                  if (total > 0) {
                                      int pct = (int) (done * 100 / total);
                                      if (pct != lastPct) {
                                          lastPct = pct;
                                          JSObject p = new JSObject();
                                          p.put("percent", pct);
                                          notifyListeners("downloadProgress", p);
                                      }
                                  }
                              }
                          }

                          Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".updates", out);
                          Intent install = new Intent(Intent.ACTION_VIEW);
                          install.setDataAndType(uri, "application/vnd.android.package-archive");
                          install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(install);
                          call.resolve();
                      } catch (Exception e) {
                          call.reject(e.getMessage() != null ? e.getMessage() : "Update failed");
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }
          }
          FEYNOS_EOF

