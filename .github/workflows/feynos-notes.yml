          mkdir -p "$(dirname src/server/server.mjs)"
          cat > src/server/server.mjs <<'FEYNOS_EOF'
          // Feynos Notes sync server - zero dependencies (Node 24 + built-in SQLite)
          // Designed to sit behind a reverse proxy (Caddy, Nginx, Nginx Proxy Manager, Traefik...)
          import http from 'node:http';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import zlib from 'node:zlib';
          import { DatabaseSync } from 'node:sqlite';
          import { createOneNoteImporter } from './onenote.mjs';
          import { createFileImporter } from './fileimport.mjs';

          const VERSION = '__APP_VERSION__';
          const env = process.env;
          const PORT = parseInt(env.PORT || '8787', 10);
          const DATA_DIR = env.DATA_DIR || '/data';
          const BASE_PATH = ('/' + (env.BASE_PATH || '').replace(/^\/+|\/+$/g, '')).replace(/^\/$/, '');
          const TRUST_PROXY = /^(1|true|yes)$/i.test(env.TRUST_PROXY || '');
          const MAX_BODY = Math.max(1, parseFloat(env.MAX_BODY_MB || '200')) * 1024 * 1024;
          const CORS_ORIGINS = (env.CORS_ORIGINS || '*').split(',').map(s => s.trim()).filter(Boolean);
          const PULL_LIMIT_BYTES = 16 * 1024 * 1024;
          const IMPORT_MAX = Math.max(1, parseFloat(env.IMPORT_MAX_MB || '2048')) * 1024 * 1024;

          function readPassword() {
            if (env.FEYNOS_PASSWORD_FILE) {
              try { return fs.readFileSync(env.FEYNOS_PASSWORD_FILE, 'utf8').trim(); } catch (e) { console.error('Cannot read FEYNOS_PASSWORD_FILE:', e.message); }
            }
            return env.FEYNOS_PASSWORD || '';
          }
          const PASSWORD = readPassword();
          if (!PASSWORD || PASSWORD.length < 8) {
            console.error('FEYNOS_PASSWORD must be set (8+ characters). Refusing to start.');
            process.exit(1);
          }
          const PASSWORD_HASH = crypto.createHash('sha256').update(PASSWORD).digest();

          /* ---------------- database ---------------- */
          fs.mkdirSync(DATA_DIR, { recursive: true });
          const db = new DatabaseSync(path.join(DATA_DIR, 'feynos-notes.db'));
          db.exec(`
            PRAGMA journal_mode = WAL;
            PRAGMA synchronous = NORMAL;
            CREATE TABLE IF NOT EXISTS records (
              id TEXT PRIMARY KEY, type TEXT NOT NULL, rev INTEGER NOT NULL, updated INTEGER NOT NULL,
              deleted INTEGER NOT NULL DEFAULT 0, data TEXT, device TEXT
            );
            CREATE INDEX IF NOT EXISTS records_rev ON records(rev);
            CREATE TABLE IF NOT EXISTS sessions (token_hash TEXT PRIMARY KEY, device TEXT, created INTEGER, last_seen INTEGER);
            CREATE TABLE IF NOT EXISTS kv (k TEXT PRIMARY KEY, v TEXT);
          `);
          const kvGet = db.prepare('SELECT v FROM kv WHERE k = ?');
          const kvSet = db.prepare('INSERT INTO kv(k, v) VALUES(?, ?) ON CONFLICT(k) DO UPDATE SET v = excluded.v');
          if (!kvGet.get('server_id')) kvSet.run('server_id', crypto.randomUUID());
          const SERVER_ID = kvGet.get('server_id').v;
          const getSeq = () => parseInt((kvGet.get('seq') || { v: '0' }).v, 10);

          const q = {
            get: db.prepare('SELECT * FROM records WHERE id = ?'),
            upsert: db.prepare(`INSERT INTO records(id, type, rev, updated, deleted, data, device) VALUES(?, ?, ?, ?, ?, ?, ?)
              ON CONFLICT(id) DO UPDATE SET type = excluded.type, rev = excluded.rev, updated = excluded.updated,
              deleted = excluded.deleted, data = excluded.data, device = excluded.device`),
            since: db.prepare('SELECT * FROM records WHERE rev > ? ORDER BY rev LIMIT 2000'),
            count: db.prepare('SELECT COUNT(*) AS n FROM records WHERE deleted = 0'),
            session: db.prepare('SELECT * FROM sessions WHERE token_hash = ?'),
            touchSession: db.prepare('UPDATE sessions SET last_seen = ? WHERE token_hash = ?'),
            addSession: db.prepare('INSERT INTO sessions(token_hash, device, created, last_seen) VALUES(?, ?, ?, ?)'),
            delSession: db.prepare('DELETE FROM sessions WHERE token_hash = ?'),
            listSessions: db.prepare('SELECT device, created, last_seen FROM sessions ORDER BY last_seen DESC')
          };
          const sha = s => crypto.createHash('sha256').update(s).digest('hex');

          /* ---------------- helpers ---------------- */
          function clientIp(req) {
            if (TRUST_PROXY) {
              const xff = req.headers['x-forwarded-for'];
              if (xff) return String(xff).split(',')[0].trim();
              if (req.headers['x-real-ip']) return String(req.headers['x-real-ip']).trim();
            }
            return req.socket.remoteAddress || '?';
          }
          function corsHeaders(req) {
            const origin = req.headers.origin;
            const allow = CORS_ORIGINS.includes('*') ? '*' : (origin && CORS_ORIGINS.includes(origin) ? origin : CORS_ORIGINS[0]);
            return {
              'Access-Control-Allow-Origin': allow,
              'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
              'Access-Control-Allow-Headers': 'Authorization, Content-Type, Content-Encoding, X-Feynos-Device',
              'Access-Control-Max-Age': '86400',
              Vary: 'Origin'
            };
          }
          function send(req, res, status, obj) {
            let body = Buffer.from(JSON.stringify(obj));
            const headers = { ...corsHeaders(req), 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store', 'X-Content-Type-Options': 'nosniff' };
            if (body.length > 1024 && /\bgzip\b/.test(req.headers['accept-encoding'] || '')) {
              body = zlib.gzipSync(body, { level: 5 }); headers['Content-Encoding'] = 'gzip';
            }
            headers['Content-Length'] = body.length;
            res.writeHead(status, headers); res.end(body);
          }
          const fail = (req, res, status, message) => send(req, res, status, { ok: false, error: message });

          function readBody(req) {
            return new Promise((resolve, reject) => {
              let size = 0; const chunks = [];
              let stream = req;
              const enc = String(req.headers['content-encoding'] || '').toLowerCase();
              if (enc === 'gzip') stream = req.pipe(zlib.createGunzip());
              stream.on('data', c => {
                size += c.length;
                if (size > MAX_BODY) { reject(Object.assign(new Error(`Upload too large (limit ${env.MAX_BODY_MB || 200} MB)`), { status: 413 })); req.destroy(); return; }
                chunks.push(c);
              });
              stream.on('end', () => {
                try { resolve(chunks.length ? JSON.parse(Buffer.concat(chunks).toString('utf8')) : {}); }
                catch { reject(Object.assign(new Error('Invalid JSON'), { status: 400 })); }
              });
              stream.on('error', e => reject(Object.assign(e, { status: 400 })));
            });
          }

          /* ---------------- login rate limiting ---------------- */
          const attempts = new Map(); // ip -> {n, until}
          function limited(ip) {
            const a = attempts.get(ip);
            return a && a.n >= 10 && a.until > Date.now();
          }
          function noteFailure(ip) {
            const a = attempts.get(ip) || { n: 0, until: 0 };
            if (a.until < Date.now()) { a.n = 0; }
            a.n++; a.until = Date.now() + 15 * 60 * 1000;
            attempts.set(ip, a);
          }
          setInterval(() => { const t = Date.now(); for (const [k, v] of attempts) if (v.until < t) attempts.delete(k); }, 600000).unref();

          function auth(req) {
            const h = String(req.headers.authorization || '');
            const m = h.match(/^Bearer\s+(\S+)$/i); if (!m) return null;
            const th = sha(m[1]);
            const s = q.session.get(th); if (!s) return null;
            if (Date.now() - (s.last_seen || 0) > 60000) q.touchSession.run(Date.now(), th);
            return { ...s, token_hash: th };
          }

          /* ---------------- sync core ---------------- */
          const TYPES = new Set(['notebook', 'section', 'page']);
          function rowOut(r) {
            return { type: r.type, id: r.id, rev: r.rev, updated: r.updated, deleted: !!r.deleted, data: r.data ? JSON.parse(r.data) : null };
          }
          const newId = () => Date.now().toString(36) + crypto.randomBytes(5).toString('hex').slice(0, 7);

          function applyChanges(changes, device) {
            const results = [];
            let seq = getSeq();
            db.exec('BEGIN IMMEDIATE');
            try {
              for (const c of changes) {
                if (!c || typeof c.id !== 'string' || !TYPES.has(c.type) || c.id.length > 64) { results.push({ id: c && c.id, status: 'invalid' }); continue; }
                const updated = Number(c.updated) || Date.now();
                const deleted = c.deleted ? 1 : 0;
                const data = deleted ? null : JSON.stringify(c.data || {});
                const cur = q.get.get(c.id);
                const base = Number(c.base) || 0;

                if (!cur || cur.rev === base) {
                  q.upsert.run(c.id, c.type, ++seq, updated, deleted, data, device);
                  results.push({ id: c.id, status: 'ok' });
                  continue;
                }
                // Someone else changed this record since the device last saw it.
                if (c.type === 'page' && !cur.deleted && !deleted) {
                  const mine = c.data || {}; const theirs = JSON.parse(cur.data || '{}');
                  if ((mine.html || '') === (theirs.html || '') && (mine.title || '') === (theirs.title || '')) {
                    // same content - just take the newer metadata (order, section, level)
                    if (updated > cur.updated) q.upsert.run(c.id, c.type, ++seq, updated, 0, data, device);
                    results.push({ id: c.id, status: 'ok' });
                    continue;
                  }
                  // keep both: the server copy stays, this device's version becomes a conflict copy
                  const copyId = newId();
                  const copy = { ...mine, id: copyId, title: (mine.title || 'Untitled page') + ` (conflict copy – ${device || 'another device'})`, order: (mine.order || 0) + 0.5, created: Date.now() };
                  q.upsert.run(copyId, 'page', ++seq, Date.now(), 0, JSON.stringify(copy), device);
                  results.push({ id: c.id, status: 'conflict', copyId });
                  continue;
                }
                if (c.type === 'page' && deleted && !cur.deleted) {
                  // never lose edits made elsewhere to a delete from a stale device
                  results.push({ id: c.id, status: 'kept' });
                  continue;
                }
                // notebooks/sections (names, colors, order) and resurrections: newest edit wins
                if (updated >= cur.updated || (cur.deleted && !deleted)) {
                  q.upsert.run(c.id, c.type, ++seq, updated, deleted, data, device);
                  results.push({ id: c.id, status: 'ok' });
                } else results.push({ id: c.id, status: 'stale' });
              }
              kvSet.run('seq', String(seq));
              db.exec('COMMIT');
            } catch (e) { db.exec('ROLLBACK'); throw e; }
            return results;
          }

          function pullSince(since) {
            const rows = q.since.all(since);
            const out = []; let bytes = 0; let last = since;
            for (const r of rows) {
              out.push(rowOut(r)); last = r.rev; bytes += (r.data ? r.data.length : 0);
              if (bytes > PULL_LIMIT_BYTES) break;
            }
            const seq = getSeq();
            return { changes: out, seq: last, more: last < seq && out.length > 0 };
          }

          /* ---------------- OneNote import ---------------- */
          const allOfType = db.prepare('SELECT data FROM records WHERE type = ? AND deleted = 0');
          const importStore = {
            get(id) { const r = q.get.get(id); return r ? { ...(r.data ? JSON.parse(r.data) : {}), deleted: !!r.deleted, updated: r.updated } : null; },
            // "notebook", or "section:<notebookId>" / "page:<sectionId>" for children of one parent
            maxOrder(spec) {
              const [type, parent] = spec.split(':');
              const key = type === 'page' ? 'sectionId' : type === 'section' ? 'notebookId' : null;
              let m = -1;
              for (const r of allOfType.all(type)) {
                const d = JSON.parse(r.data);
                if (parent && key && d[key] !== parent) continue;
                if (typeof d.order === 'number' && d.order > m) m = d.order;
              }
              return m;
            },
            write(type, id, data, updated) {
              db.exec('BEGIN IMMEDIATE');
              try {
                const seq = getSeq() + 1;
                q.upsert.run(id, type, seq, updated || data.updated || Date.now(), 0, JSON.stringify(data), 'OneNote import');
                kvSet.run('seq', String(seq));
                db.exec('COMMIT');
              } catch (e) { db.exec('ROLLBACK'); throw e; }
            }
          };
          const onenote = createOneNoteImporter({
            clientId: (env.MS_CLIENT_ID || '').trim(),
            tenant: (env.MS_TENANT || 'common').trim(),
            kvGet: k => { const r = kvGet.get(k); return r && r.v ? r.v : ''; },
            kvSet: (k, v) => kvSet.run(k, v),
            store: importStore,
            log: (...a) => console.log(...a)
          });

          const fileImport = createFileImporter({ dataDir: DATA_DIR, store: importStore, log: (...a) => console.log(...a) });

          function saveUpload(req, dest) {
            return new Promise((resolve, reject) => {
              let size = 0;
              const out = fs.createWriteStream(dest);
              req.on('data', c => {
                size += c.length;
                if (size > IMPORT_MAX) { req.destroy(); out.destroy(); fs.rm(dest, { force: true }, () => {}); reject(Object.assign(new Error(`File too large (limit ${env.IMPORT_MAX_MB || 2048} MB)`), { status: 413 })); }
              });
              req.pipe(out);
              out.on('finish', () => resolve(size));
              out.on('error', reject);
              req.on('error', reject);
            });
          }

          /* ---------------- http ---------------- */
          const STATUS_PAGE = () => `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feynos Notes Sync</title>
          <style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 18px;color:#221d29;background:#f4f2f7}h1{color:#5b2a86;font-size:22px}code{background:#e9e2f2;padding:2px 6px;border-radius:5px}p{line-height:1.55}</style></head>
          <body><h1>✓ Feynos Notes sync server is running</h1>
          <p>Version <code>${VERSION}</code>. In the app open <b>Settings → Sync</b> and enter this page's address as the server address.</p>
          <p>Behind a reverse proxy? This page loading through your domain means the proxy is set up correctly.</p></body></html>`;

          const server = http.createServer(async (req, res) => {
            const started = Date.now();
            let url;
            try { url = new URL(req.url, 'http://local'); } catch { res.writeHead(400); res.end(); return; }
            let p = url.pathname;
            // Works whether or not the proxy strips the sub-path
            if (BASE_PATH && (p === BASE_PATH || p.startsWith(BASE_PATH + '/'))) p = p.slice(BASE_PATH.length) || '/';
            p = p.replace(/\/+$/, '') || '/';

            res.on('finish', () => {
              if (p !== '/api/health') console.log(`${new Date().toISOString()} ${clientIp(req)} ${req.method} ${url.pathname} ${res.statusCode} ${Date.now() - started}ms`);
            });

            if (req.method === 'OPTIONS') { res.writeHead(204, corsHeaders(req)); res.end(); return; }

            try {
              if (req.method === 'GET' && p === '/') {
                const body = STATUS_PAGE();
                res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' }); res.end(body); return;
              }
