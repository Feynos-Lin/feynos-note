                // insert directly after a given page (and after its subpages)
                const idx = list.findIndex(p => p.id === afterId);
                if (idx >= 0) {
                  let end = idx;
                  while (end + 1 < list.length && list[end + 1].level > 0 && list[idx].level === 0) end++;
                  list.forEach((p, i) => { if (i > end) { p.order += 1; p.updated = now(); savePage(p); } });
                  order = (list[end].order || 0) + 1;
                }
              }
              const p = { id: uid(), sectionId, title: title || '', html: '', text: '', level: level || 0, order, created: now(), updated: now(), deleted: null };
              pages.set(p.id, p);
              savePage(p);
              if (!silent) markDirty();
              return p;
            }
            function updatePage(id, patch) {
              const p = pages.get(id); if (!p) return;
              Object.assign(p, patch);
              if ('html' in patch) p.text = htmlToText(p.html);
              p.updated = now();
              markDirty();
              return savePage(p);
            }
            function setPageLevel(id, level) { const p = pages.get(id); if (!p) return; p.level = level; p.updated = now(); savePage(p); markDirty(); }
            function movePage(id, dir) {
              const p = pages.get(id); if (!p) return;
              moveInList(pagesIn(p.sectionId), id, dir, x => { x.updated = now(); savePage(x); });
              markDirty();
            }
            function movePageToSection(id, sectionId) {
              const p = pages.get(id); if (!p) return;
              p.sectionId = sectionId; p.level = 0; p.order = nextOrder(pagesIn(sectionId)); p.updated = now();
              savePage(p); markDirty();
            }
            function duplicatePage(id) {
              const src = pages.get(id); if (!src) return null;
              const p = addPage(src.sectionId, (src.title || 'Untitled') + ' (copy)', true, src.id, src.level);
              p.html = src.html; p.text = src.text;
              savePage(p); markDirty();
              return p;
            }
            function trashPage(id, silent, sectionInfo) {
              const p = pages.get(id); if (!p) return;
              const sec = sectionInfo || getSection(p.sectionId);
              const nb = sec ? getNotebook(sec.notebookId) : null;
              p.deleted = now(); p.updated = now();
              p.deletedFrom = (nb ? nb.name + ' › ' : '') + (sec ? sec.name : '');
              savePage(p);
              if (!silent) markDirty();
            }
            function binPages() { return [...pages.values()].filter(p => p.deleted).sort((a, b) => b.deleted - a.deleted); }
            function restorePage(id) {
              const p = pages.get(id); if (!p) return null;
              let sec = getSection(p.sectionId);
              if (!sec) {
                // original section is gone: put it in the first section, creating one if needed
                const nb = notebooks()[0] || addNotebook('My Notebook', null, true);
                sec = sections(nb.id)[0] || addSection(nb.id, 'Restored', null, true);
                p.sectionId = sec.id;
              }
              p.deleted = null; p.level = 0; p.order = nextOrder(pagesIn(sec.id)); p.updated = now();
              savePage(p); markDirty();
              return p;
            }
            function purgePage(id) { pages.delete(id); deletePageRecord(id); touch('page', id); markDirty(); }
            function emptyBin() { for (const p of binPages()) { pages.delete(p.id); deletePageRecord(p.id); touch('page', p.id); } markDirty(); }
            function purgeOldBin() {
              const cutoff = now() - 60 * 24 * 3600 * 1000; // 60 days
              for (const p of [...pages.values()]) if (p.deleted && p.deleted < cutoff) { pages.delete(p.id); deletePageRecord(p.id); touch('page', p.id); }
            }

            function moveInList(list, id, dir, onChange) {
              const i = list.findIndex(x => x.id === id);
              const j = i + dir;
              if (i < 0 || j < 0 || j >= list.length) return;
              [list[i], list[j]] = [list[j], list[i]];
