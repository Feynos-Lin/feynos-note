            }
            function updateSection(id, patch) { const s = getSection(id); if (!s) return; Object.assign(s, patch, { updated: now() }); touch('section', id); markDirty(); return s; }
            function deleteSection(id, silent) {
              // pages go to the recycle bin, remembering where they came from
              const s = getSection(id);
              for (const p of pagesIn(id)) trashPage(p.id, true, s);
              meta.sections = meta.sections.filter(x => x.id !== id);
              touch('section', id);
              if (!silent) markDirty();
            }
            function moveSection(id, dir) { const s = getSection(id); moveInList(sections(s.notebookId), id, dir, x => touch('section', x.id)); markDirty(); }
            function moveSectionToNotebook(id, notebookId) {
              const s = getSection(id); if (!s) return;
