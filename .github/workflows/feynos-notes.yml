  android:
    name: Android APK
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Keep the debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: feynos-notes-debug-keystore

      - name: Create Capacitor project
        shell: bash
        run: |
          mkdir app && cd app
          cp ../src/android/package.json ../src/android/capacitor.config.json ../src/android/cap-entry.js .
          cp -r ../src/www ./www
          npm install --no-audit --no-fund
          npx esbuild cap-entry.js --bundle --format=iife --minify --target=chrome90 --outfile=www/cap-bundle.js
          npx cap add android
          npx cap sync android
          pip install --quiet pillow
          python3 ../src/android/make_icons.py www/icon.png android/app/src/main/res
          python3 ../src/android/patch_android.py ../src/android/native android

      - name: Set version
        shell: bash
        run: |
          cd app/android/app
          sed -i -E "s/versionCode [0-9]+/versionCode $GITHUB_RUN_NUMBER/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Build APK
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd app/android
          chmod +x gradlew
          mkdir -p ../../out
          if [ -n "$KS_B64" ]; then
            echo "Building release APK signed with your key"
            ./gradlew assembleRelease --no-daemon > gradle.log 2>&1 || { cat gradle.log; echo "::error title=Android build failed::$(grep -E 'error:|FAILURE|What went wrong|\.java:[0-9]+' gradle.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            echo "$KS_B64" | base64 -d > release.jks
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS --out "../../out/FeynosNotes-$APP_VERSION.apk" aligned.apk
            rm -f release.jks
          else
            echo "No signing secrets - building debug-signed APK"
            ./gradlew assembleDebug --no-daemon > gradle.log 2>&1 || { cat gradle.log; echo "::error title=Android build failed::$(grep -E 'error:|FAILURE|What went wrong|\.java:[0-9]+' gradle.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
            cp app/build/outputs/apk/debug/app-debug.apk "../../out/FeynosNotes-$APP_VERSION.apk"
          fi
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  linux:
    name: Fedora RPM
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build RPM
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          trap 'echo "::error title=Step failed::$BASH_COMMAND"' ERR
          mkdir app && cd app
          cp ../src/desktop/main.js ../src/desktop/preload.js ../src/desktop/package.json .
          cp -r ../src/www ./www
          mkdir -p build && cp www/icon.png build/icon.png
          npm pkg set version="$APP_VERSION"
          npm install --save --no-audit --no-fund electron-updater
          npm install --save-dev --no-audit --no-fund electron electron-builder
          npx electron-builder --linux rpm --x64 --publish never > eb.log 2>&1 || {
            cat eb.log
            echo "::error title=electron-builder failed::$(tail -40 eb.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          cat eb.log
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            app/dist/*.rpm
            app/dist/latest-linux.yml

  windows:
    name: Windows installer
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          trap 'echo "::error title=Step failed::$BASH_COMMAND"' ERR
          mkdir app && cd app
          cp ../src/desktop/main.js ../src/desktop/preload.js ../src/desktop/package.json .
          cp -r ../src/www ./www
          mkdir -p build && cp www/icon.png build/icon.png
          npm pkg set version="$APP_VERSION"
          npm install --save --no-audit --no-fund electron-updater
          npm install --save-dev --no-audit --no-fund electron electron-builder
          npx electron-builder --win nsis --x64 --publish never > eb.log 2>&1 || {
            cat eb.log
            echo "::error title=electron-builder failed::$(tail -40 eb.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          cat eb.log
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app/dist/*.exe
            app/dist/*.exe.blockmap
            app/dist/latest.yml

  server:
    name: Sync server image
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test the image
        shell: bash
        run: |
          set -o pipefail
          fail() { echo "::error title=Server image test failed::$1 $(docker logs fns-test 2>&1 | tail -20 | tr -s '[:space:]' ' ')"; exit 1; }
          docker build --progress=plain -t feynos-sync-test:ci src/server > build.log 2>&1 || { cat build.log; echo "::error title=Server image build failed::$(grep -v '^#[0-9]* \(sha256\|DONE\|CACHED\|extracting\|resolve\)' build.log | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          tail -5 build.log
          out=$(docker run -d --name fns-test -e FEYNOS_PASSWORD=testpassword123 -e BASE_PATH=/notes -p 8787:8787 feynos-sync-test:ci 2>&1) || fail "docker run: $out"
          sleep 2
          [ "$(docker inspect -f '{{.State.Running}}' fns-test)" = "true" ] || fail "container exited:"
          ok=""
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8787/notes/api/health; then ok=1; break; fi; sleep 1; done
          [ -n "$ok" ] || fail "health check never answered"
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"password":"testpassword123","device":"ci"}' http://127.0.0.1:8787/notes/api/login | grep -q token || fail "login failed"
          echo "::group::Import test"
          B=http://127.0.0.1:8787
          TOKEN=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"password":"testpassword123","device":"ci"}' $B/api/login | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          git clone -q --depth 1 https://github.com/msiemens/onenote.rs /tmp/onrs
          imp() {
            local q; q=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$2")
            local id; id=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/octet-stream' --data-binary @"$1" "$B/api/import/file?name=$q" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
            local s=""
            for i in $(seq 1 180); do s=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$B/api/import/file/status?id=$id"); echo "$s" | grep -q '"state":"\(done\|error\)"' && break; sleep 1; done
            echo "$s" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["state"],d.get("kind"),d.get("message",""),d.get("result"))'
          }
          R1=$(imp "/tmp/onrs/crates/parser/tests/samples/New Section 1.one" "New Section 1.one")
          python3 -c 'import zipfile,os;z=zipfile.ZipFile("/tmp/second.zip","w");b="/tmp/onrs/crates/parser/tests/samples/joplin";[z.write(os.path.join(r,f),os.path.relpath(os.path.join(r,f),b)) for r,_,fs in os.walk(b+"/Second") for f in fs]'
          R2=$(imp /tmp/second.zip "Second.zip")
          echo "" | base64 -d > /tmp/t.pdf
          R3=$(imp /tmp/t.pdf "Meeting notes.pdf")
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -d '{"since":0,"changes":[]}' $B/api/sync > /tmp/all.json
          SUMMARY=$(python3 - <<'PY'
          import json, re
          d = json.load(open('/tmp/all.json'))['changes']
          nb = {r['id']: r['data']['name'] for r in d if r['type'] == 'notebook'}
          sec = {r['id']: (nb.get(r['data']['notebookId'], '?') + ' > ' + r['data']['name']) for r in d if r['type'] == 'section'}
          out = []
          for r in d:
              if r['type'] != 'page': continue
              p = r['data']; h = re.sub(r'base64,[A-Za-z0-9+/=]+', 'base64,...', p['html'])
              out.append(f"[{sec.get(p['sectionId'], '?')}] {p['title']} (lvl {p['level']}, {len(p['html'])}b): {h[:220]}")
          print(f"{len(out)} pages || " + ' || '.join(out[:14]))
          PY
          )
          echo "::endgroup::"
          echo "::notice title=Import test::ONE=$R1 ## ZIP=$R2 ## PDF=$R3 ## $(echo "$SUMMARY" | tr -s '[:space:]' ' ' | cut -c1-6000)"
          for r in "$R1" "$R2" "$R3"; do case "$r" in done*) ;; *) fail "import failed: $r";; esac; done
          docker logs fns-test

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: src/server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/feynos-lin/feynos-note-sync:latest
            ghcr.io/feynos-lin/feynos-note-sync:${{ env.APP_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: src/server/docker-compose.yml

  release:
    name: Publish release
    needs: [android, linux, windows, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{android,linux,windows,server}"
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Feynos Notes ${{ env.APP_VERSION }}
          body: |
            **Android:** install the `.apk`.
            **Fedora:** `sudo dnf install ./FeynosNotes-*.rpm`
            **Windows:** run the `.exe` installer.
            **Sync server:** use the attached `docker-compose.yml` (image `ghcr.io/feynos-lin/feynos-note-sync`). See the README for reverse proxy and OneNote import setup.

            Backups: Settings (gear icon). On desktop, add your Google Drive / Proton Drive folders. On Android, tap Back up now and pick Drive or Proton Drive.
          files: artifacts/*
