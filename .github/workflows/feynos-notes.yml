          /* Feynos Notes - platform bridge.
             desktop (Electron): window.feynosDesktop from preload.js
             android (Capacitor): window.FeynosCap from cap-bundle.js
             web: plain browser fallback (download a file) */
          (function () {
            'use strict';

            const desktop = window.feynosDesktop || null;
            const cap = window.FeynosCap || null;
            const isAndroid = !!(cap && cap.Capacitor && cap.Capacitor.isNativePlatform && cap.Capacitor.isNativePlatform());
            const kind = desktop ? 'desktop' : isAndroid ? 'android' : 'web';

            function downloadFallback(name, text) {
              const blob = new Blob([text], { type: 'application/json' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = name;
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            }

            const Platform = {
              kind,
              isDesktop: kind === 'desktop',
              isAndroid: kind === 'android',

              /* ---------- desktop: backup folders ---------- */
              async listFolders() { return desktop ? desktop.listFolders() : []; },
              async addFolder(label) { return desktop ? desktop.addFolder(label) : null; },
              async removeFolder(id) { return desktop ? desktop.removeFolder(id) : null; },
              async openFolder(id) { return desktop ? desktop.openFolder(id) : null; },
              /* writes the backup into every configured folder, then deletes old ones beyond `keep` */
              async writeBackupToFolders(name, text, keep) {
                if (!desktop) throw new Error('Folder backups are only on desktop.');
                return desktop.writeBackup(name, text, keep);
              },
              openExternal(url) {
                if (desktop) return desktop.openExternal(url);
                if (isAndroid && cap.Browser) return cap.Browser.open({ url });
                window.open(url, '_blank', 'noopener');
              },
              onCloseRequest(fn) { if (desktop) desktop.onCloseRequest(fn); },
              closeReady() { if (desktop) desktop.closeReady(); },

              /* ---------- android: share sheet ---------- */
              async shareBackup(name, text) {
                if (!isAndroid) { downloadFallback(name, text); return { method: 'download' }; }
                const { Filesystem, Directory, Encoding, Share } = cap;
                // clear older shared copies from cache so they don't pile up
                try {
                  const listing = await Filesystem.readdir({ path: '', directory: Directory.Cache });
                  for (const f of listing.files || []) {
                    const fname = typeof f === 'string' ? f : f.name;
                    if (/^FeynosNotes-backup-.*\.json$/.test(fname)) await Filesystem.deleteFile({ path: fname, directory: Directory.Cache });
                  }
                } catch (e) { /* first run - nothing to clear */ }
                const res = await Filesystem.writeFile({ path: name, data: text, directory: Directory.Cache, encoding: Encoding.UTF8 });
                await Share.share({ title: 'Feynos Notes backup', text: name, files: [res.uri], dialogTitle: 'Save backup to…' });
                return { method: 'share' };
              },
              /* ---------- android: hardware back button ---------- */
              onBack(fn) {
                if (isAndroid && cap.App) cap.App.addListener('backButton', fn);
              },
              exitApp() { if (isAndroid && cap.App) cap.App.exitApp(); },
              onPause(fn) {
                if (isAndroid && cap.App) cap.App.addListener('pause', fn);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') fn(); });
              },

              downloadFallback
            };

            window.Platform = Platform;
            document.documentElement.dataset.platform = kind;
          })();
          FEYNOS_EOF

          mkdir -p "$(dirname src/www/store.js)"
          cat > src/www/store.js <<'FEYNOS_EOF'
          /* Feynos Notes - storage layer (IndexedDB) and data model.
             Structure:  meta  = { notebooks:[], sections:[], settings:{} }
                         pages = one record per page (html can be large, so saved separately) */
          (function () {
            'use strict';

            const DB_NAME = 'feynosnotes';
            const DB_VER = 1;
            const FORMAT = 1;

            const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
            const now = () => Date.now();

            const COLORS = ['#7b3fb0', '#2f6fdb', '#1f9e89', '#4d9a2a', '#d9a400', '#e0712b', '#d2344a', '#c2408f', '#6b6f7a', '#0b8bb3'];

            const DEFAULT_SETTINGS = {
              theme: 'system',         // system | light | dark
              ruledLines: true,
              lastSectionId: null,
              lastPageId: null,
              autoBackupMinutes: 30,   // desktop only, 0 = off
              keepBackups: 10,
              backupOnClose: true,
              lastBackupAt: 0,
              lastBackupNote: '',
              remindDays: 7            // android: remind to back up after N days, 0 = off
            };

            let db = null;
            const meta = { notebooks: [], sections: [], settings: { ...DEFAULT_SETTINGS } };
            const pages = new Map();
            let dirtySinceBackup = false;
            const listeners = new Set();

            /* ---------------- IndexedDB plumbing ---------------- */
            function openDb() {
              return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VER);
                req.onupgradeneeded = () => {
                  const d = req.result;
                  if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
                  if (!d.objectStoreNames.contains('pages')) d.createObjectStore('pages', { keyPath: 'id' });
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
              });
            }
            function tx(storeNames, mode, fn) {
              return new Promise((resolve, reject) => {
                const t = db.transaction(storeNames, mode);
                let out;
                t.oncomplete = () => resolve(out);
                t.onerror = () => reject(t.error);
                t.onabort = () => reject(t.error || new Error('Transaction aborted'));
                out = fn(t);
              });
            }
            function reqP(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

            async function load() {
              db = await openDb();
              // Ask the browser not to evict our data
              try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* ignore */ }

              const t = db.transaction(['kv', 'pages'], 'readonly');
              const m = await reqP(t.objectStore('kv').get('meta'));
              const all = await reqP(t.objectStore('pages').getAll());
              if (m) {
                meta.notebooks = m.notebooks || [];
                meta.sections = m.sections || [];
                meta.settings = { ...DEFAULT_SETTINGS, ...(m.settings || {}) };
                dirtySinceBackup = !!m.dirtySinceBackup;
              }
              pages.clear();
              for (const p of all) pages.set(p.id, p);

              purgeOldBin();
              if (!meta.notebooks.length) await seed();
            }

            let metaTimer = null;
            function saveMeta(immediate) {
              clearTimeout(metaTimer);
              const run = () => tx(['kv'], 'readwrite', t => {
                t.objectStore('kv').put({
                  notebooks: meta.notebooks, sections: meta.sections, settings: meta.settings, dirtySinceBackup
                }, 'meta');
              }).catch(err => console.error('saveMeta', err));
              if (immediate) return run();
              metaTimer = setTimeout(run, 250);
              return Promise.resolve();
            }
            function savePageRecord(p) {
              return tx(['pages'], 'readwrite', t => { t.objectStore('pages').put(p); });
            }
            function deletePageRecord(id) {
              return tx(['pages'], 'readwrite', t => { t.objectStore('pages').delete(id); });
            }

            function markDirty() {
              dirtySinceBackup = true;
              saveMeta();
              listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
            }

            /* ---------------- seed ---------------- */
            async function seed() {
              const nb = addNotebook('My Notebook', COLORS[0], true);
              const s1 = addSection(nb.id, 'Quick Notes', COLORS[1], true);
              addSection(nb.id, 'Ideas', COLORS[4], true);
              const welcome = `
          <h2>Welcome to Feynos Notes 👋</h2>
          <p>Your notes live in <b>notebooks</b>, which hold <b>sections</b>, which hold <b>pages</b> — just like OneNote.</p>
          <ul class="todo"><li data-done="true">Open the app</li><li data-done="false">Create a notebook for something you care about</li><li data-done="false">Set up backups in <b>Settings</b> (the gear icon)</li></ul>
          <h3>Things to try</h3>
          <ul><li>Tag a line <span class="tag tag-important" contenteditable="false">★ Important</span> or <span class="tag tag-idea" contenteditable="false">💡 Idea</span></li>
          <li>Insert a table, a picture, or a hand-drawn sketch from the toolbar</li>
          <li>Search every page at once from the box on the left</li>
          <li>Tap a page's ⋯ menu to make it a subpage or move it to another section</li></ul>
          <blockquote>Backups are plain JSON files, so they're easy to keep in Google Drive or Proton Drive.</blockquote>`;
              const p = addPage(s1.id, 'Welcome', true);
              p.html = welcome.trim();
              p.text = htmlToText(p.html);
              meta.settings.lastSectionId = s1.id;
              meta.settings.lastPageId = p.id;
              await savePageRecord(p);
              await saveMeta(true);
              dirtySinceBackup = false;
            }

            /* ---------------- helpers ---------------- */
            function sortByOrder(a, b) { return (a.order || 0) - (b.order || 0); }
            function nextOrder(list) { return list.length ? Math.max(...list.map(x => x.order || 0)) + 1 : 0; }

            const textDiv = typeof document !== 'undefined' ? document.createElement('div') : null;
            function htmlToText(html) {
              if (!textDiv) return String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
              const tpl = document.createElement('template');
              tpl.innerHTML = html || '';
              // block-level elements should become spaces, not run together
              tpl.content.querySelectorAll('p,div,li,h1,h2,h3,h4,br,td,th,blockquote,pre,tr').forEach(el => el.append(' '));
