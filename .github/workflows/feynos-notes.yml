                <h2>${esc(title)}</h2>
                <div class="field" style="margin-top:14px"><label for="dlgName">Name</label><input id="dlgName" value="${esc(name || '')}" maxlength="80" autocomplete="off"></div>
                ${color !== undefined ? `<div class="field"><span class="lbl">Color</span><div class="swatches">${S.COLORS.map(c => `<button type="button" data-c="${c}" style="background:${c}" class="${c === color ? 'on' : ''}" aria-label="${c}"></button>`).join('')}</div></div>` : ''}
                <div class="modal-actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">${esc(okLabel || 'Save')}</button></div>`,
                (m, done) => {
                  let col = color;
                  const inp = m.querySelector('#dlgName');
                  m.querySelectorAll('.swatches button').forEach(b => b.onclick = () => {
                    m.querySelectorAll('.swatches button').forEach(x => x.classList.remove('on')); b.classList.add('on'); col = b.dataset.c;
                  });
                  const ok = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } done({ name: v, color: col }); };
                  m.querySelector('[data-x=no]').onclick = () => done(null);
                  m.querySelector('[data-x=yes]').onclick = ok;
                  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
                  setTimeout(() => { inp.focus(); inp.select(); }, 30);
                });
            }

            function pickSectionDialog(title, excludeId) {
              const groups = S.notebooks().map(nb => {
                const secs = S.sections(nb.id).filter(s => s.id !== excludeId);
                if (!secs.length) return '';
                return `<div class="menu-label" style="padding-left:2px">${esc(nb.name)}</div>` + secs.map(s =>
                  `<button class="text-btn" style="width:100%;justify-content:flex-start" data-s="${s.id}"><span class="sec-dot" style="background:${s.color}"></span>${esc(s.name)}</button>`).join('');
              }).join('');
              return openModal(`<h2>${esc(title)}</h2><div style="margin-top:10px">${groups || '<p class="hint">There are no other sections yet.</p>'}</div>
                <div class="modal-actions"><button class="btn" data-x="no">Cancel</button></div>`,
                (m, done) => {
                  m.querySelector('[data-x=no]').onclick = () => done(null);
                  m.querySelectorAll('[data-s]').forEach(b => b.onclick = () => done(b.dataset.s));
                });
            }

            function pickNotebookDialog(title, excludeId) {
              const list = S.notebooks().filter(n => n.id !== excludeId);
              return openModal(`<h2>${esc(title)}</h2><div style="margin-top:10px">${list.map(nb =>
                `<button class="text-btn" style="width:100%;justify-content:flex-start" data-n="${nb.id}"><span class="nb-icon" style="background:${nb.color};width:16px;height:20px"></span>${esc(nb.name)}</button>`).join('') || '<p class="hint">There are no other notebooks.</p>'}</div>
                <div class="modal-actions"><button class="btn" data-x="no">Cancel</button></div>`,
                (m, done) => {
                  m.querySelector('[data-x=no]').onclick = () => done(null);
                  m.querySelectorAll('[data-n]').forEach(b => b.onclick = () => done(b.dataset.n));
                });
            }

            /* ===================================================================
               View switching (phone shows one pane at a time)
               =================================================================== */
            const isNarrow = () => window.matchMedia('(max-width: 760px)').matches;
            function setView(v) { state.view = v; el.app.dataset.view = v; }

            /* ===================================================================
               Notebook / section tree
               =================================================================== */
            function renderTree() {
              const nbs = S.notebooks();
              if (!nbs.length) { el.tree.innerHTML = '<div class="tree-empty">No notebooks yet. Create one below.</div>'; return; }
              el.tree.innerHTML = nbs.map(nb => `
                <div class="nb ${nb.collapsed ? 'collapsed' : ''}" data-nb="${nb.id}">
                  <div class="nb-row" data-act="toggle-nb" role="treeitem" aria-expanded="${!nb.collapsed}">
                    ${ICON.chev}<span class="nb-icon" style="background:${nb.color}"></span>
                    <span class="nb-name">${esc(nb.name)}</span>
                    <button class="row-more" data-act="nb-menu" aria-label="Notebook options">${ICON.more}</button>
                  </div>
                  <div class="secs" role="group">
                    ${S.sections(nb.id).map(s => `
                      <div class="sec-row ${s.id === state.sectionId && !state.query ? 'active' : ''}" data-sec="${s.id}" data-act="open-sec" role="treeitem">
                        <span class="sec-dot" style="background:${s.color}"></span>
                        <span class="sec-name">${esc(s.name)}</span>
                        <button class="row-more" data-act="sec-menu" aria-label="Section options">${ICON.more}</button>
                      </div>`).join('')}
                    <div class="sec-row add-sec" data-act="add-sec">${ICON.plus}<span class="sec-name">Add section</span></div>
                  </div>
                </div>`).join('');
              const bin = S.binPages().length;
              el.binCount.textContent = bin ? `Bin (${bin})` : 'Bin';
            }

            el.tree.addEventListener('click', e => {
              const actEl = e.target.closest('[data-act]'); if (!actEl) return;
              const nbEl = e.target.closest('[data-nb]'); const nbId = nbEl && nbEl.dataset.nb;
              const secEl = e.target.closest('[data-sec]'); const secId = secEl && secEl.dataset.sec;
              switch (actEl.dataset.act) {
                case 'toggle-nb': { const nb = S.getNotebook(nbId); S.updateNotebook(nbId, { collapsed: !nb.collapsed }); renderTree(); break; }
                case 'open-sec': openSection(secId, true); break;
                case 'add-sec': newSection(nbId); break;
                case 'nb-menu': e.stopPropagation(); notebookMenu(actEl, nbId); break;
                case 'sec-menu': e.stopPropagation(); sectionMenu(actEl, secId); break;
              }
            });
            el.tree.addEventListener('contextmenu', e => {
              const secEl = e.target.closest('[data-sec]'); const nbEl = e.target.closest('.nb-row');
              if (secEl) { e.preventDefault(); sectionMenu({ x: e.clientX, y: e.clientY }, secEl.dataset.sec); }
              else if (nbEl) { e.preventDefault(); notebookMenu({ x: e.clientX, y: e.clientY }, nbEl.parentElement.dataset.nb); }
            });

            async function newNotebook() {
              const r = await nameDialog('New notebook', '', S.COLORS[S.notebooks().length % S.COLORS.length], 'Create');
              if (!r) return;
              const nb = S.addNotebook(r.name, r.color);
              const sec = S.addSection(nb.id, 'New Section');
              renderTree(); openSection(sec.id, true);
            }
            async function newSection(nbId) {
              const r = await nameDialog('New section', '', S.COLORS[(S.sections(nbId).length + 2) % S.COLORS.length], 'Create');
              if (!r) return;
              const s = S.addSection(nbId, r.name, r.color);
              S.updateNotebook(nbId, { collapsed: false });
              renderTree(); openSection(s.id, true);
            }

            function notebookMenu(anchor, nbId) {
              const nb = S.getNotebook(nbId); const list = S.notebooks(); const i = list.findIndex(n => n.id === nbId);
              showMenu(anchor, [
                { label: 'New section', fn: () => newSection(nbId) },
                { label: 'Rename / color…', fn: async () => { const r = await nameDialog('Notebook', nb.name, nb.color); if (r) { S.updateNotebook(nbId, r); renderTree(); renderCrumbs(); } } },
                '-',
                { label: 'Move up', disabled: i === 0, fn: () => { S.moveNotebook(nbId, -1); renderTree(); } },
                { label: 'Move down', disabled: i === list.length - 1, fn: () => { S.moveNotebook(nbId, 1); renderTree(); } },
                '-',
                { label: 'Delete notebook…', danger: true, fn: async () => {
                  const n = S.sections(nbId).reduce((a, s) => a + S.pagesIn(s.id).length, 0);
                  if (!await confirmDialog('Delete notebook?', `“${esc(nb.name)}” and its sections will be removed. Its ${n} page${n === 1 ? '' : 's'} will go to the recycle bin.`, 'Delete', true)) return;
                  const inside = S.sections(nbId).some(s => s.id === state.sectionId);
                  S.deleteNotebook(nbId);
                  if (inside) { state.sectionId = null; state.pageId = null; pickDefaultSection(); }
                  renderAll();
                } }
              ]);
            }

            function sectionMenu(anchor, secId) {
              const s = S.getSection(secId); const list = S.sections(s.notebookId); const i = list.findIndex(x => x.id === secId);
              showMenu(anchor, [
                { label: 'New page', fn: () => { openSection(secId, false); newPage(); } },
                { label: 'Rename / color…', fn: async () => { const r = await nameDialog('Section', s.name, s.color); if (r) { S.updateSection(secId, r); renderTree(); renderPages(); renderCrumbs(); } } },
                '-',
                { label: 'Move up', disabled: i === 0, fn: () => { S.moveSection(secId, -1); renderTree(); } },
                { label: 'Move down', disabled: i === list.length - 1, fn: () => { S.moveSection(secId, 1); renderTree(); } },
                { label: 'Move to notebook…', disabled: S.notebooks().length < 2, fn: async () => { const nb = await pickNotebookDialog('Move section to…', s.notebookId); if (nb) { S.moveSectionToNotebook(secId, nb); S.updateNotebook(nb, { collapsed: false }); renderTree(); renderCrumbs(); } } },
                '-',
                { label: 'Delete section…', danger: true, fn: async () => {
                  const n = S.pagesIn(secId).length;
                  if (!await confirmDialog('Delete section?', `“${esc(s.name)}” will be removed. Its ${n} page${n === 1 ? '' : 's'} will go to the recycle bin.`, 'Delete', true)) return;
                  S.deleteSection(secId);
                  if (state.sectionId === secId) { state.sectionId = null; state.pageId = null; pickDefaultSection(); }
                  renderAll();
                } }
              ]);
            }

            function pickDefaultSection() {
              for (const nb of S.notebooks()) { const s = S.sections(nb.id)[0]; if (s) { state.sectionId = s.id; return; } }
              state.sectionId = null;
            }

            function openSection(secId, goToPages) {
              flushSave();
              state.query = ''; el.search.value = '';
              state.sectionId = secId;
              S.saveSettings({ lastSectionId: secId });
              const list = S.pagesIn(secId);
              if (!list.some(p => p.id === state.pageId)) openPage(list[0] ? list[0].id : null, false);
              renderTree(); renderPages(); renderCrumbs();
              if (goToPages && isNarrow()) setView('pages');
            }

            /* ===================================================================
               Page list
               =================================================================== */
            const fmtDate = ts => {
              const d = new Date(ts); const today = new Date();
              if (d.toDateString() === today.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
              return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
            };

            function highlightSnippet(text, terms) {
              const lower = text.toLowerCase();
              let at = -1;
              for (const t of terms) { const i = lower.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
              let snip = at > 40 ? '…' + text.slice(at - 30, at + 110) : text.slice(0, 140);
              snip = esc(snip);
              for (const t of terms) {
                const re = new RegExp('(' + esc(t).replace(/[.*+?^$()|[\]\\{}]/g, '\\$&') + ')', 'gi');
                snip = snip.replace(re, '<mark>$1</mark>');
              }
              return snip;
            }

            function renderPages() {
              if (state.query) return renderSearch();
              const sec = state.sectionId && S.getSection(state.sectionId);
              $('#btnNewPage').disabled = !sec;
              if (!sec) {
                el.pagesHeading.textContent = 'Pages'; el.pagesSub.textContent = '';
                el.pageList.innerHTML = '<div class="list-empty">Pick or create a section.</div>';
                return;
              }
              const nb = S.getNotebook(sec.notebookId);
              el.pagesHeading.textContent = sec.name;
              el.pagesSub.textContent = nb ? nb.name : '';
              const list = S.pagesIn(sec.id);
              if (!list.length) {
                el.pageList.innerHTML = '<div class="list-empty">No pages here yet.<br><button class="btn primary" style="margin-top:12px" data-act="new">New page</button></div>';
                return;
              }
              el.pageList.innerHTML = list.map(p => `
                <div class="page-item ${p.level ? 'sub' : ''} ${p.id === state.pageId ? 'active' : ''}" data-page="${p.id}">
                  <div class="page-text">
                    <div class="page-name ${p.title ? '' : 'untitled'}">${esc(p.title || 'Untitled page')}</div>
                    <div class="page-snippet">${esc((p.text || '').slice(0, 120)) || '&nbsp;'}</div>
                    <div class="page-date">${fmtDate(p.updated)}</div>
                  </div>
                  <button class="row-more" data-act="page-menu" aria-label="Page options">${ICON.more}</button>
                </div>`).join('');
            }

            function renderSearch() {
              const results = S.search(state.query);
              const terms = state.query.toLowerCase().split(/\s+/).filter(Boolean);
              el.pagesHeading.textContent = 'Search';
              el.pagesSub.textContent = `${results.length} result${results.length === 1 ? '' : 's'} for “${state.query}”`;
              if (!results.length) { el.pageList.innerHTML = '<div class="list-empty">Nothing matches that.<br>Try fewer or different words.</div>'; return; }
              el.pageList.innerHTML = results.map(r => `
                <div class="page-item search-hit ${r.page.id === state.pageId ? 'active' : ''}" data-page="${r.page.id}">
                  <div class="page-text">
                    <div class="result-path">${esc(r.notebook ? r.notebook.name : '')} › ${esc(r.section.name)}</div>
                    <div class="page-name ${r.page.title ? '' : 'untitled'}">${highlightSnippet(r.page.title || 'Untitled page', terms)}</div>
                    <div class="page-snippet">${highlightSnippet(r.page.text || '', terms)}</div>
                  </div>
                </div>`).join('');
            }

            el.pageList.addEventListener('click', e => {
              if (e.target.closest('[data-act=new]')) { newPage(); return; }
              const item = e.target.closest('[data-page]'); if (!item) return;
              const id = item.dataset.page;
              if (e.target.closest('[data-act=page-menu]')) { e.stopPropagation(); pageMenu(e.target.closest('[data-act=page-menu]'), id); return; }
              if (state.query) {
                const p = S.getPage(id);
                state.sectionId = p.sectionId; S.saveSettings({ lastSectionId: p.sectionId });
                openPage(id, true); renderTree(); highlightTerms(state.query);
              } else openPage(id, true);
            });
            el.pageList.addEventListener('contextmenu', e => {
              const item = e.target.closest('[data-page]'); if (!item || state.query) return;
              e.preventDefault(); pageMenu({ x: e.clientX, y: e.clientY }, item.dataset.page);
            });

            function pageMenu(anchor, id) {
              const p = S.getPage(id); const list = S.pagesIn(p.sectionId); const i = list.findIndex(x => x.id === id);
              showMenu(anchor, [
                { label: 'New page below', fn: () => newPage(id, 0) },
                { label: 'New subpage', fn: () => newPage(id, 1) },
                { label: p.level ? 'Promote to page' : 'Make subpage', disabled: !p.level && i === 0, fn: () => { S.setPageLevel(id, p.level ? 0 : 1); renderPages(); } },
                '-',
                { label: 'Move up', disabled: i === 0, fn: () => { S.movePage(id, -1); renderPages(); } },
                { label: 'Move down', disabled: i === list.length - 1, fn: () => { S.movePage(id, 1); renderPages(); } },
                { label: 'Move to section…', fn: async () => {
                  const target = await pickSectionDialog('Move page to…', p.sectionId);
                  if (!target) return; flushSave(); S.movePageToSection(id, target);
                  if (state.pageId === id) { state.sectionId = target; S.saveSettings({ lastSectionId: target }); }
                  renderAll(); toast('Page moved');
                } },
                { label: 'Duplicate', fn: () => { flushSave(); const c = S.duplicatePage(id); renderPages(); openPage(c.id, true); } },
                '-',
                { label: 'Delete page', danger: true, fn: () => deletePage(id) }
              ]);
            }

            function deletePage(id) {
              flushSave();
              const list = S.pagesIn(S.getPage(id).sectionId);
              const i = list.findIndex(x => x.id === id);
              S.trashPage(id);
              if (state.pageId === id) { const next = list[i + 1] || list[i - 1]; openPage(next ? next.id : null, false); if (isNarrow()) setView('pages'); }
              renderPages(); renderTree();
              toast('Page moved to the recycle bin', 'Undo', () => { S.restorePage(id); state.sectionId = S.getPage(id).sectionId; renderAll(); openPage(id, false); });
            }

            function newPage(afterId, level) {
              if (!state.sectionId) { toast('Create a section first'); return; }
              flushSave();
              if (state.query) { state.query = ''; el.search.value = ''; }
              const p = S.addPage(state.sectionId, '', false, afterId || null, level || 0);
              renderPages(); openPage(p.id, true);
              setTimeout(() => el.title.focus(), 50);
            }

            /* ===================================================================
               Editor
               =================================================================== */
            function renderCrumbs() {
              const p = state.pageId && S.getPage(state.pageId);
              const sec = p ? S.getSection(p.sectionId) : (state.sectionId && S.getSection(state.sectionId));
              const nb = sec && S.getNotebook(sec.notebookId);
              el.crumbs.innerHTML = sec ? `<span class="crumb-dot" style="background:${sec.color}"></span><span>${esc(nb ? nb.name : '')}</span><span>›</span><b>${esc(sec.name)}</b>` : '';
            }

            function renderMeta(p) {
              const f = ts => new Date(ts).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
              el.meta.textContent = `Created ${f(p.created)}` + (p.updated - p.created > 60000 ? `  ·  Edited ${f(p.updated)}` : '');
            }

            function openPage(id, goToEditor) {
              flushSave();
              clearHighlights();
              state.pageId = id || null;
              S.saveSettings({ lastPageId: state.pageId });
              const p = id && S.getPage(id);
              const hasPage = !!p;
              el.paper.hidden = !hasPage;
              el.empty.hidden = hasPage;
              el.toolbar.style.visibility = hasPage ? '' : 'hidden';
              if (!hasPage) {
                el.editor.innerHTML = ''; el.title.value = '';
                el.emptyText.textContent = state.sectionId ? 'Pick a page, or create one.' : 'Create a notebook to get started.';
                $('#btnEmptyNew').hidden = !state.sectionId;
              } else {
                el.title.value = p.title || '';
                el.editor.innerHTML = sanitize(p.html);
                normalizeTodos();
                renderMeta(p);
                el.scroll.scrollTop = 0;
              }
              el.saveState.textContent = '';
              renderCrumbs();
              el.pageList.querySelectorAll('.page-item').forEach(n => n.classList.toggle('active', n.dataset.page === state.pageId));
              if (goToEditor && hasPage && isNarrow()) setView('editor');
            }

            function scheduleSave() {
              if (!state.pageId) return;
              state.pendingSave = true;
              el.saveState.textContent = 'Saving…';
              clearTimeout(state.saveTimer);
              state.saveTimer = setTimeout(flushSave, 600);
            }
            function flushSave() {
              clearTimeout(state.saveTimer);
              if (!state.pendingSave || !state.pageId) return Promise.resolve();
              state.pendingSave = false;
              const p = S.getPage(state.pageId); if (!p) return Promise.resolve();
              let html = el.editor.innerHTML;
              if (html === '<br>' || html === '<p><br></p>') html = '';
              const pr = S.updatePage(state.pageId, { html, title: el.title.value.trim() });
              el.saveState.textContent = 'Saved';
              renderMeta(p);
              // refresh just this item in the list without rebuilding everything
              const item = el.pageList.querySelector(`[data-page="${state.pageId}"]`);
              if (item && !state.query) {
                const nm = item.querySelector('.page-name');
                nm.textContent = p.title || 'Untitled page'; nm.classList.toggle('untitled', !p.title);
                item.querySelector('.page-snippet').textContent = (p.text || '').slice(0, 120) || '\u00a0';
                item.querySelector('.page-date').textContent = fmtDate(p.updated);
              }
              return pr || Promise.resolve();
            }

            el.title.addEventListener('input', scheduleSave);
            el.title.addEventListener('keydown', e => {
              if (e.key === 'Enter' || (e.key === 'ArrowDown')) { e.preventDefault(); placeCaretAtStart(el.editor); }
            });
            el.editor.addEventListener('input', () => { normalizeTodos(); scheduleSave(); updateToolbarState(); });

            function placeCaretAtStart(node) {
              node.focus();
              const r = document.createRange(); r.selectNodeContents(node); r.collapse(true);
              const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
            }

            /* ---------- selection memory (color pickers & dialogs steal focus) ---------- */
            function selectionInEditor() {
              const sel = getSelection(); if (!sel.rangeCount) return null;
              const r = sel.getRangeAt(0);
              return el.editor.contains(r.commonAncestorContainer) ? r : null;
            }
            document.addEventListener('selectionchange', () => {
              const r = selectionInEditor();
              if (r) { state.lastRange = r.cloneRange(); updateToolbarState(); }
            });
            function restoreSelection() {
              el.editor.focus({ preventScroll: true });
              if (state.lastRange && el.editor.contains(state.lastRange.commonAncestorContainer)) {
                const sel = getSelection(); sel.removeAllRanges(); sel.addRange(state.lastRange);
              } else if (!selectionInEditor()) {
                const r = document.createRange(); r.selectNodeContents(el.editor); r.collapse(false);
                const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
              }
            }
            function nodeAtCaret() {
              const r = selectionInEditor(); if (!r) return null;
              const n = r.startContainer; return n.nodeType === 1 ? n : n.parentElement;
            }
            const closestInEditor = sel => { const n = nodeAtCaret(); const c = n && n.closest(sel); return c && el.editor.contains(c) ? c : null; };

            function exec(cmd, val) {
              restoreSelection();
              document.execCommand(cmd, false, val);
              scheduleSave(); updateToolbarState();
            }

            function updateToolbarState() {
              if (!selectionInEditor()) return;
              el.toolbar.querySelectorAll('[data-cmd]').forEach(b => {
                const c = b.dataset.cmd;
                if (['bold', 'italic', 'underline', 'strikeThrough', 'insertUnorderedList', 'insertOrderedList'].includes(c)) {
                  let on = false; try { on = document.queryCommandState(c); } catch (e) { /* noop */ }
                  if (c === 'insertUnorderedList' && closestInEditor('ul.todo')) on = false;
                  b.classList.toggle('on', on);
                }
              });
              el.toolbar.querySelector('[data-act=todo]').classList.toggle('on', !!closestInEditor('ul.todo'));
              let block = 'p'; try { block = (document.queryCommandValue('formatBlock') || 'p').toLowerCase(); } catch (e) { /* noop */ }
              el.blockStyle.value = ['h1', 'h2', 'h3', 'blockquote', 'pre'].includes(block) ? block : 'p';
              el.tableTools.hidden = !closestInEditor('td,th');
            }

            /* keep editor focus when clicking toolbar buttons */
            el.toolbar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
            el.toolbar.addEventListener('click', e => {
              const b = e.target.closest('button'); if (!b) return;
              if (b.dataset.cmd) { exec(b.dataset.cmd); return; }
              const a = b.dataset.act;
              if (a === 'todo') toggleTodo();
              else if (a && a.startsWith('tag-')) insertTag(a.slice(4));
              else if (a === 'link') linkDialog();
              else if (a === 'image') { restoreSelection(); el.imgInput.click(); }
              else if (a === 'sketch') insertSketch();
              else if (a === 'table') insertTable();
              else if (a === 'hr') exec('insertHorizontalRule');
              else if (a === 'date') exec('insertText', new Date().toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + ' ');
              else if (a === 'row-add' || a === 'col-add' || a === 'row-del' || a === 'col-del') tableOp(a);
            });
            el.blockStyle.addEventListener('change', () => { exec('formatBlock', '<' + el.blockStyle.value + '>'); });

            const foreColor = $('#foreColor'), hiliteColor = $('#hiliteColor');
            foreColor.addEventListener('input', () => { $('#foreBar').style.background = foreColor.value; });
            foreColor.addEventListener('change', () => { exec('styleWithCSS', true); exec('foreColor', foreColor.value); exec('styleWithCSS', false); });
            hiliteColor.addEventListener('input', () => { $('#hiliteBar').style.stroke = hiliteColor.value; });
            hiliteColor.addEventListener('change', () => { exec('styleWithCSS', true); exec('hiliteColor', hiliteColor.value); exec('styleWithCSS', false); });
            [foreColor, hiliteColor].forEach(i => i.addEventListener('mousedown', () => { const r = selectionInEditor(); if (r) state.lastRange = r.cloneRange(); }));

            /* ---------- to-do lists ---------- */
            function normalizeTodos() {
              el.editor.querySelectorAll('ul.todo > li').forEach(li => { if (li.dataset.done !== 'true' && li.dataset.done !== 'false') li.dataset.done = 'false'; });
            }
            function toggleTodo() {
              restoreSelection();
              let ul = closestInEditor('ul');
              if (ul && ul.classList.contains('todo')) {
                ul.classList.remove('todo');
                ul.querySelectorAll(':scope > li').forEach(li => li.removeAttribute('data-done'));
              } else {
                if (!ul) { document.execCommand('insertUnorderedList'); ul = closestInEditor('ul'); }
                if (ul) {
                  if (ul.closest('ol') === ul.parentElement) { /* nested in ol: fine */ }
                  ul.classList.add('todo'); normalizeTodos();
                }
              }
              scheduleSave(); updateToolbarState();
            }
            el.editor.addEventListener('click', e => {
              const li = e.target.closest('ul.todo > li');
              if (li && e.target === li) {
                const r = li.getBoundingClientRect();
                const em = parseFloat(getComputedStyle(li).fontSize) || 16;
                if (e.clientX - r.left < em * 1.6) {
                  li.dataset.done = li.dataset.done === 'true' ? 'false' : 'true';
                  scheduleSave(); e.preventDefault(); return;
                }
              }
              const a = e.target.closest('a');
              if (a && el.editor.contains(a)) { showLinkChip(a); return; }
              const img = e.target.closest('img');
              if (img && el.editor.contains(img)) { showImageChip(img); return; }
              hideChip();
            });
            el.editor.addEventListener('keydown', e => {
              // Enter on a ticked to-do should create an unticked one
              if (e.key === 'Enter' && !e.shiftKey && closestInEditor('ul.todo > li')) {
                setTimeout(() => { const li = closestInEditor('ul.todo > li'); if (li) li.dataset.done = 'false'; }, 0);
              }
              if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) {
                if (closestInEditor('li')) { e.preventDefault(); exec(e.shiftKey ? 'outdent' : 'indent'); }
                else if (closestInEditor('td,th')) { e.preventDefault(); moveCell(e.shiftKey ? -1 : 1); }
                else if (!e.shiftKey) { e.preventDefault(); exec('insertText', '\u2003'); }
              }
            });

            /* ---------- tags ---------- */
            const TAGS = { important: '★ Important', question: '? Question', idea: '💡 Idea' };
            function insertTag(kind) {
              exec('insertHTML', `<span class="tag tag-${kind}" contenteditable="false">${TAGS[kind]}</span>&nbsp;`);
            }

            /* ---------- links ---------- */
            function normalizeUrl(u) {
              u = (u || '').trim(); if (!u) return '';
              if (/^(javascript|vbscript|data|file):/i.test(u)) return '';
              if (/^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(u)) return 'mailto:' + u;
              if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) return 'https://' + u;
              return u;
            }
            async function linkDialog(existing) {
              const r = selectionInEditor() || state.lastRange;
              const savedRange = r ? r.cloneRange() : null;
              const selText = savedRange ? savedRange.toString() : '';
              const res = await openModal(`
                <h2>${existing ? 'Edit link' : 'Insert link'}</h2>
                <div class="field" style="margin-top:14px"><label for="lkText">Text to show</label><input id="lkText" value="${esc(existing ? existing.textContent : selText)}"></div>
                <div class="field"><label for="lkUrl">Address</label><input id="lkUrl" placeholder="https://…" value="${esc(existing ? existing.getAttribute('href') : '')}" inputmode="url" autocomplete="off"></div>
                <div class="modal-actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">${existing ? 'Save' : 'Insert'}</button></div>`,
                (m, done) => {
                  const ok = () => done({ text: m.querySelector('#lkText').value, url: m.querySelector('#lkUrl').value });
                  m.querySelector('[data-x=no]').onclick = () => done(null);
                  m.querySelector('[data-x=yes]').onclick = ok;
                  m.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); }));
                  setTimeout(() => m.querySelector(existing || selText ? '#lkUrl' : '#lkText').focus(), 30);
                });
              if (!res) return;
              const url = normalizeUrl(res.url);
              if (!url) { toast('That link address is not allowed'); return; }
              const text = res.text.trim() || res.url.trim();
              if (existing) { existing.href = url; existing.textContent = text; scheduleSave(); return; }
              state.lastRange = savedRange;
              exec('insertHTML', `<a href="${esc(url)}">${esc(text)}</a>&nbsp;`);
            }

            /* ---------- floating chip for links & images ---------- */
            function placeChip(target) {
              const r = target.getBoundingClientRect();
              el.chip.hidden = false;
              const w = el.chip.offsetWidth;
              el.chip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
              el.chip.style.top = (r.bottom + 6 + 44 > window.innerHeight ? r.top - 48 : r.bottom + 6) + 'px';
            }
            function hideChip() { el.chip.hidden = true; el.editor.querySelectorAll('img.selected').forEach(i => i.classList.remove('selected')); }
            function chipButtons(btns, target) {
              el.chip.innerHTML = btns.map((b, i) => `<button data-i="${i}" ${i === 0 ? 'id="linkOpen"' : ''}>${esc(b.label)}</button>`).join('');
              el.chip.querySelectorAll('button').forEach(b => {
                b.addEventListener('mousedown', e => e.preventDefault());
                b.onclick = () => { const it = btns[+b.dataset.i]; hideChip(); it.fn(); };
              });
              placeChip(target);
            }
            function showLinkChip(a) {
              chipButtons([
                { label: 'Open link ↗', fn: () => P.openExternal(a.href) },
                { label: 'Edit', fn: () => linkDialog(a) },
                { label: 'Remove', fn: () => { a.replaceWith(...a.childNodes); scheduleSave(); } }
              ], a);
            }
            function showImageChip(img) {
              hideChip(); img.classList.add('selected');
              const setW = w => { img.style.width = w; img.removeAttribute('width'); img.removeAttribute('height'); scheduleSave(); };
              chipButtons([
                { label: 'Small', fn: () => setW('30%') },
                { label: 'Medium', fn: () => setW('60%') },
                { label: 'Full', fn: () => setW('100%') },
                { label: 'Original', fn: () => setW('') },
                { label: 'Delete', fn: () => { img.remove(); scheduleSave(); } }
              ], img);
            }
            document.addEventListener('mousedown', e => {
              if (!el.chip.hidden && !el.chip.contains(e.target) && !e.target.closest('#editor a, #editor img')) hideChip();
              if (!el.menu.hidden && !el.menu.contains(e.target)) closeMenu();
            });
            el.scroll.addEventListener('scroll', () => { hideChip(); }, { passive: true });

            /* ---------- images ---------- */
            function readFileAsDataUrl(file) {
              return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
            }
            function shrinkImage(dataUrl, type) {
              return new Promise(resolve => {
                if (type === 'image/gif' || type === 'image/svg+xml') return resolve(dataUrl);
                const img = new Image();
                img.onload = () => {
                  const MAX = 1800;
                  const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
                  if (scale === 1 && dataUrl.length < 1.5e6) return resolve(dataUrl);
                  const c = document.createElement('canvas');
                  c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
                  const ctx = c.getContext('2d');
                  if (type !== 'image/png') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
                  ctx.drawImage(img, 0, 0, c.width, c.height);
                  resolve(type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
              });
            }
            async function insertImageFiles(files) {
              if (!state.pageId) return;
              let html = '';
              for (const f of files) {
                if (!f.type.startsWith('image/')) continue;
                const url = await shrinkImage(await readFileAsDataUrl(f), f.type);
                html += `<img src="${url}" alt="${esc(f.name || 'picture')}"><br>`;
              }
              if (html) exec('insertHTML', html);
            }
            el.imgInput.addEventListener('change', async () => { await insertImageFiles([...el.imgInput.files]); el.imgInput.value = ''; });

            el.editor.addEventListener('paste', async e => {
              const cd = e.clipboardData; if (!cd) return;
              const files = [...cd.files].filter(f => f.type.startsWith('image/'));
              if (files.length && !cd.getData('text/html')) { e.preventDefault(); state.lastRange = selectionInEditor(); await insertImageFiles(files); return; }
              const html = cd.getData('text/html');
              if (html) { e.preventDefault(); exec('insertHTML', sanitize(html.replace(/<!--[\s\S]*?-->/g, ''))); }
            });
            el.editor.addEventListener('drop', async e => {
              const files = [...(e.dataTransfer && e.dataTransfer.files || [])].filter(f => f.type.startsWith('image/'));
              if (!files.length) return;
              e.preventDefault();
              if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(e.clientX, e.clientY); if (r) state.lastRange = r; }
              await insertImageFiles(files);
            });

            /* ---------- sketch ---------- */
            async function insertSketch() {
              const r = selectionInEditor() || state.lastRange; const saved = r ? r.cloneRange() : null;
              const url = await openModal('', (m, done) => { window.Sketch.open(m).then(done); }, true);
              if (!url) return;
              state.lastRange = saved;
              exec('insertHTML', `<img class="sketch" src="${url}" alt="sketch"><br>`);
            }

            /* ---------- tables ---------- */
            function insertTable() {
              const head = '<tr><th>Column 1</th><th>Column 2</th><th>Column 3</th></tr>';
              const row = '<tr><td><br></td><td><br></td><td><br></td></tr>';
              exec('insertHTML', `<table><tbody>${head}${row}${row}</tbody></table><p><br></p>`);
            }
            function tableOp(op) {
              restoreSelection();
              const cell = closestInEditor('td,th'); if (!cell) return;
              const tr = cell.parentElement; const table = cell.closest('table');
              const idx = [...tr.children].indexOf(cell);
              if (op === 'row-add') {
                const nr = document.createElement('tr');
                for (let i = 0; i < tr.children.length; i++) { const td = document.createElement('td'); td.innerHTML = '<br>'; nr.appendChild(td); }
                tr.after(nr);
              } else if (op === 'row-del') {
                if (table.rows.length <= 1) table.remove(); else tr.remove();
              } else if (op === 'col-add') {
                [...table.rows].forEach(r => { const ref = r.children[idx]; const c = document.createElement(ref && ref.tagName === 'TH' ? 'th' : 'td'); c.innerHTML = '<br>'; if (ref) ref.after(c); else r.appendChild(c); });
              } else if (op === 'col-del') {
                if (tr.children.length <= 1) table.remove(); else [...table.rows].forEach(r => { if (r.children[idx]) r.children[idx].remove(); });
              }
              scheduleSave(); updateToolbarState();
            }
            function moveCell(dir) {
              const cell = closestInEditor('td,th'); if (!cell) return;
              const cells = [...cell.closest('table').querySelectorAll('td,th')];
              let next = cells[cells.indexOf(cell) + dir];
              if (!next && dir > 0) { state.lastRange = selectionInEditor(); tableOp('row-add'); next = cell.closest('table').querySelectorAll('td,th')[cells.length]; }
              if (next) { const r = document.createRange(); r.selectNodeContents(next); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
            }

            /* ---------- search highlighting in the open page ---------- */
            function clearHighlights() { try { if (window.CSS && CSS.highlights) CSS.highlights.delete('search-hit'); } catch (e) { /* noop */ } }
            function highlightTerms(q) {
              clearHighlights();
              if (!(window.CSS && CSS.highlights && window.Highlight)) return;
              const terms = q.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.length) return;
              const ranges = []; let first = null;
              const walker = document.createTreeWalker(el.editor, NodeFilter.SHOW_TEXT);
              while (walker.nextNode()) {
                const n = walker.currentNode; const t = n.nodeValue.toLowerCase();
                for (const term of terms) {
                  let i = t.indexOf(term);
                  while (i >= 0) { const r = new Range(); r.setStart(n, i); r.setEnd(n, i + term.length); ranges.push(r); if (!first) first = r; i = t.indexOf(term, i + term.length); }
                }
              }
              if (!ranges.length) return;
              CSS.highlights.set('search-hit', new Highlight(...ranges));
              const rect = first.getBoundingClientRect(); const box = el.scroll.getBoundingClientRect();
              el.scroll.scrollTop += rect.top - box.top - box.height / 3;
            }

            /* ===================================================================
               Search box
               =================================================================== */
            let searchTimer;
            el.search.addEventListener('input', () => {
              clearTimeout(searchTimer);
              searchTimer = setTimeout(() => {
                flushSave();
                state.query = el.search.value.trim();
                renderTree(); renderPages();
                if (state.query && isNarrow()) setView('pages');
              }, 180);
            });
            el.search.addEventListener('keydown', e => {
              if (e.key === 'Escape') { el.search.value = ''; state.query = ''; renderTree(); renderPages(); }
              if (e.key === 'Enter' && isNarrow()) el.search.blur();
            });

            /* ===================================================================
               Recycle bin
               =================================================================== */
            function openBin() {
              const render = m => {
                const list = S.binPages();
                m.querySelector('#binList').innerHTML = list.length ? list.map(p => `
                  <div class="bin-item" data-id="${p.id}">
                    <div class="b-text"><div class="b-title">${esc(p.title || 'Untitled page')}</div><div class="b-sub">From ${esc(p.deletedFrom || 'a deleted section')} · deleted ${fmtDate(p.deleted)}</div></div>
                    <button class="btn small" data-x="restore">Restore</button>
                    <button class="btn small danger" data-x="purge" title="Delete forever">✕</button>
                  </div>`).join('') : '<p class="hint" style="padding:20px 0;text-align:center">The recycle bin is empty.</p>';
                m.querySelector('#binEmpty').disabled = !list.length;
              };
              openModal(`
                <h2>Recycle bin</h2><p class="sub">Deleted pages stay here for 60 days.</p>
                <div id="binList"></div>
                <div class="modal-actions"><button class="btn danger" id="binEmpty">Empty bin</button><button class="btn primary" data-x="close">Done</button></div>`,
                (m, done) => {
                  render(m);
                  m.querySelector('[data-x=close]').onclick = () => done(null);
                  m.querySelector('#binEmpty').onclick = async () => {
                    const n = S.binPages().length;
                    // nested confirm replaces this modal, so reopen afterwards
                    if (await confirmDialog('Empty the recycle bin?', `${n} page${n === 1 ? '' : 's'} will be deleted forever.`, 'Delete forever', true)) S.emptyBin();
                    renderTree(); openBin();
                  };
                  m.querySelector('#binList').addEventListener('click', e => {
                    const b = e.target.closest('[data-x]'); if (!b) return;
                    const id = b.closest('[data-id]').dataset.id;
                    if (b.dataset.x === 'restore') { const p = S.restorePage(id); state.sectionId = p.sectionId; renderAll(); openPage(p.id, false); toast('Page restored'); }
                    else S.purgePage(id);
                    renderTree(); render(m);
                  });
                });
            }

            /* ===================================================================
               Settings, backup & restore
               =================================================================== */
            function timeAgo(ts) {
              if (!ts) return 'never';
              const s = (Date.now() - ts) / 1000;
              if (s < 60) return 'just now';
              if (s < 3600) return Math.round(s / 60) + ' min ago';
              if (s < 86400) return Math.round(s / 3600) + ' h ago';
              return Math.round(s / 86400) + ' days ago';
            }

            function applyTheme() {
              const t = S.settings.theme;
              const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
              document.documentElement.dataset.theme = dark ? 'dark' : 'light';
              document.querySelector('meta[name=theme-color]').content = dark ? '#1b171f' : '#5b2a86';
              el.paper.classList.toggle('no-lines', !S.settings.ruledLines);
            }
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

            async function openSettings(focusBackup) {
              const st = S.settings;
              const folders = P.isDesktop ? await P.listFolders() : [];
              const opt = (vals, cur, fmt) => vals.map(v => `<option value="${v}" ${+cur === v ? 'selected' : ''}>${fmt(v)}</option>`).join('');

              const backupDesktop = `
                <div class="settings-section" id="backupSection">
                  <h3>${ICON.cloud} Backup to Google Drive &amp; Proton Drive</h3>
                  <p class="hint">Pick the folders that your Google Drive and Proton Drive apps sync (for example <b>G:\\My Drive</b> or <b>Proton Drive</b> in your user folder). Backups are written there and the drive apps upload them.</p>
                  <div id="folderList">${folders.length ? folders.map(f => `
                    <div class="folder-row" data-id="${f.id}">
                      <div class="f-text"><div class="f-label">${esc(f.label)}</div><div class="f-path" title="${esc(f.path)}">${esc(f.path)}</div></div>
                      <span class="f-status ${f.lastOk === false ? 'err' : 'ok'}">${f.lastOk === false ? 'Last backup failed' : f.lastAt ? '✓ ' + timeAgo(f.lastAt) : ''}</span>
                      <button class="btn small" data-x="open">Open</button>
                      <button class="btn small danger" data-x="remove">Remove</button>
                    </div>`).join('') : '<p class="hint" style="margin:0 0 8px">No backup folders yet.</p>'}</div>
                  <div class="row-inline" style="margin-top:10px">
                    <button class="btn small" data-add="Google Drive">+ Google Drive folder</button>
                    <button class="btn small" data-add="Proton Drive">+ Proton Drive folder</button>
                    <button class="btn small" data-add="Other folder">+ Other folder</button>
                  </div>
                  <div class="row-inline" style="margin-top:14px">
                    <div class="field"><label for="setAuto">Back up automatically</label><select id="setAuto">${opt([0, 5, 15, 30, 60, 180, 720], st.autoBackupMinutes, v => v ? (v < 60 ? `Every ${v} minutes` : `Every ${v / 60} hour${v === 60 ? '' : 's'}`) : 'Off')}</select></div>
                    <div class="field"><label for="setKeep">Keep in each folder</label><select id="setKeep">${opt([3, 5, 10, 20, 50, 100], st.keepBackups, v => `Last ${v} backups`)}</select></div>
                  </div>
                  <label class="hint" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="setOnClose" ${st.backupOnClose ? 'checked' : ''}> Also back up when I close the app (if anything changed)</label>
                  <div class="row-inline" style="margin-top:12px;align-items:center">
                    <button class="btn primary" id="btnBackupNow">${ICON.cloud} Back up now</button>
                    <span class="hint">Last backup: <b>${timeAgo(st.lastBackupAt)}</b>${S.isDirty ? ' · unsaved changes since' : ''}</span>
                  </div>
                </div>`;

              const backupMobile = `
                <div class="settings-section" id="backupSection">
                  <h3>${ICON.cloud} Backup to Google Drive &amp; Proton Drive</h3>
                  <p class="hint">Tap <b>Back up now</b> and pick <b>Drive</b> (Save to Drive) or <b>Proton Drive</b> (Upload) in the share menu. Choose the same folder each time and you'll have a dated history of backups.</p>
                  <div class="row-inline" style="align-items:center">
                    <button class="btn primary" id="btnBackupNow">${ICON.cloud} Back up now</button>
                    <span class="hint">Last backup: <b>${timeAgo(st.lastBackupAt)}</b>${S.isDirty ? ' · changes since' : ''}</span>
                  </div>
                  <div class="field" style="margin-top:14px"><label for="setRemind">Remind me to back up</label><select id="setRemind">${opt([0, 1, 3, 7, 14, 30], st.remindDays, v => v ? `If it's been ${v} day${v === 1 ? '' : 's'}` : 'Never')}</select></div>
                </div>`;

              await openModal(`
                <h2>Settings</h2><p class="sub">Feynos Notes ${esc(APP_VERSION)} · ${P.isDesktop ? 'Desktop' : P.isAndroid ? 'Android' : 'Browser'}</p>
                ${syncSectionHtml()}
                ${P.isDesktop ? backupDesktop : backupMobile}
                <div class="settings-section">
                  <h3>${ICON.restore} Restore</h3>
                  <p class="hint">Open a backup file from your Google Drive or Proton Drive. You can merge it with what's here (newer edits win) or replace everything.</p>
                  <div class="row-inline"><button class="btn" id="btnRestore">Restore from backup file…</button>${P.isDesktop ? '<button class="btn" id="btnSaveCopy">Save a copy as…</button>' : ''}</div>
                </div>
                ${Updater.supported ? `<div class="settings-section" id="updSection">
                  <h3>${ICON.info} Updates</h3>
                  <div class="status-line" id="updStatus">Version <b>${esc(APP_VERSION)}</b></div>
                  <div class="row-inline" style="margin-top:10px;align-items:center">
                    <button class="btn" id="btnCheckUpdate">Check for updates</button>
                    <label class="hint" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="setAutoUpd" ${st.autoUpdateCheck ? 'checked' : ''}> Check automatically</label>
                  </div>
                </div>` : ''}
                <div class="settings-section">
                  <h3>${ICON.palette} Appearance</h3>
                  <div class="row-inline" style="align-items:center;gap:14px">
                    <div class="seg" id="themeSeg">${['system', 'light', 'dark'].map(t => `<button data-t="${t}" class="${st.theme === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
                    <label class="hint" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="setLines" ${st.ruledLines ? 'checked' : ''}> Ruled lines on pages</label>
                  </div>
                </div>
                <div class="modal-actions"><button class="btn primary" data-x="close">Done</button></div>`,
                (m, done) => {
                  m.querySelector('[data-x=close]').onclick = () => done(null);
                  m.querySelector('#btnBackupNow').onclick = async () => { await backupNow('manual'); openSettings(); };
                  m.querySelector('#btnRestore').onclick = () => { el.restoreInput.click(); };
                  const copy = m.querySelector('#btnSaveCopy');
                  if (copy) copy.onclick = async () => { await flushSave(); P.downloadFallback(S.backupFileName(), JSON.stringify(S.exportData())); };
                  m.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => {
                    S.saveSettings({ theme: b.dataset.t }); applyTheme();
                    m.querySelectorAll('#themeSeg button').forEach(x => x.classList.toggle('on', x === b));
                  });
                  m.querySelector('#setLines').onchange = e => { S.saveSettings({ ruledLines: e.target.checked }); applyTheme(); };
                  if (P.isDesktop) {
                    m.querySelector('#setAuto').onchange = e => S.saveSettings({ autoBackupMinutes: +e.target.value });
                    m.querySelector('#setKeep').onchange = e => S.saveSettings({ keepBackups: +e.target.value });
                    m.querySelector('#setOnClose').onchange = e => S.saveSettings({ backupOnClose: e.target.checked });
                    m.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
                      const f = await P.addFolder(b.dataset.add);
                      if (f) { toast(`${f.label} folder added`); openSettings(); }
                    });
                    m.querySelector('#folderList').addEventListener('click', async e => {
                      const b = e.target.closest('[data-x]'); if (!b) return;
                      const id = b.closest('[data-id]').dataset.id;
                      if (b.dataset.x === 'open') P.openFolder(id);
                      else { await P.removeFolder(id); openSettings(); }
                    });
                  } else {
                    m.querySelector('#setRemind').onchange = e => S.saveSettings({ remindDays: +e.target.value });
                  }
                  wireSyncSection(m);
                  if (m.querySelector('#btnCheckUpdate')) {
                    m.querySelector('#setAutoUpd').onchange = e => S.saveSettings({ autoUpdateCheck: e.target.checked });
                    m.querySelector('#btnCheckUpdate').onclick = async () => {
                      const line = m.querySelector('#updStatus'); const btn = m.querySelector('#btnCheckUpdate');
                      btn.disabled = true; line.innerHTML = 'Checking…';
                      try {
                        const r = await Updater.check(APP_VERSION);
                        S.saveSettings({ lastUpdateCheck: Date.now() });
                        if (!r.supported) line.innerHTML = `Version <b>${esc(APP_VERSION)}</b> · ${esc(r.reason || 'Updates aren\'t available here')}`;
                        else if (r.available) { line.innerHTML = `Version <b>${esc(r.latest)}</b> is available (you have ${esc(r.current)})`; btn.textContent = 'Update now'; btn.disabled = false; btn.onclick = () => runUpdate(r); return; }
                        else line.innerHTML = `Version <b>${esc(r.current)}</b> · you're up to date ✓`;
                      } catch (err) { line.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
                      btn.disabled = false;
                    };
                  }
                  if (focusBackup) m.querySelector('#backupSection').scrollIntoView({ block: 'nearest' });
                });
            }

            async function backupNow(reason) {
              if (state.backingUp) return false;
              state.backingUp = true;
              try {
                await flushSave();
                await S.flush();
                const name = S.backupFileName();
                const text = JSON.stringify(S.exportData());
                if (P.isDesktop) {
                  const results = await P.writeBackupToFolders(name, text, S.settings.keepBackups);
                  if (!results.length) {
                    if (reason === 'manual') { toast('Add a Google Drive or Proton Drive folder first'); openSettings(true); }
                    return false;
                  }
                  const ok = results.filter(r => r.ok);
                  const bad = results.filter(r => !r.ok);
                  if (ok.length) S.markBackedUp(ok.map(r => r.label).join(', '));
                  if (reason !== 'close') {
                    if (bad.length) toast(`Backup failed for ${bad.map(r => r.label).join(', ')}: ${bad[0].error}`, null, null, 7000);
                    else if (reason === 'manual') toast(`Backed up to ${ok.map(r => r.label).join(' & ')}`);
                  }
                  return ok.length > 0;
                }
                // Android / browser: hand the file to the share sheet (Drive, Proton Drive, …)
                await P.shareBackup(name, text);
                S.markBackedUp('share');
                return true;
              } catch (err) {
                const msg = String(err && err.message || err);
                if (!/cancel/i.test(msg)) toast('Backup failed: ' + msg, null, null, 6000);
                return false;
              } finally {
                state.backingUp = false;
              }
            }

            el.restoreInput.addEventListener('change', async () => {
              const f = el.restoreInput.files[0]; el.restoreInput.value = '';
              if (!f) return;
              let data;
              try { data = S.validateBackup(JSON.parse(await f.text())); }
              catch (err) { toast(err instanceof SyntaxError ? "That file isn't a Feynos Notes backup." : err.message, null, null, 5000); return; }
              const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'unknown date';
              const live = data.pages.filter(p => !p.deleted).length;
              const mode = await openModal(`
                <h2>Restore backup</h2>
                <p class="sub">Backup from <b>${esc(when)}</b> with ${data.notebooks.length} notebook${data.notebooks.length === 1 ? '' : 's'} and ${live} page${live === 1 ? '' : 's'}.</p>
                <div class="settings-section"><h3>Merge</h3><p class="hint">Adds anything missing and keeps whichever copy of a page was edited most recently. Nothing here is deleted.</p><button class="btn primary" data-m="merge">Merge into my notes</button></div>
                <div class="settings-section"><h3>Replace everything</h3><p class="hint">Deletes all notes on this device and replaces them with the backup.</p><button class="btn danger" data-m="replace">Replace all notes</button></div>
                <div class="modal-actions"><button class="btn" data-m="">Cancel</button></div>`,
                (m, done) => m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => done(b.dataset.m || null)));
              if (!mode) return;
              if (mode === 'replace' && !await confirmDialog('Replace all notes?', 'Everything on this device will be replaced by the backup. This cannot be undone.', 'Replace', true)) return;
              try {
                await flushSave();
                const st = await S.importData(data, mode, sanitize);
                state.query = ''; el.search.value = '';
                if (!S.getSection(state.sectionId)) pickDefaultSection();
                const pg = S.getPage(state.pageId);
                if (!pg || pg.deleted) { const first = state.sectionId && S.pagesIn(state.sectionId)[0]; state.pageId = first ? first.id : null; }
                applyTheme(); renderAll(); openPage(state.pageId, false);
                toast(mode === 'replace' ? 'Backup restored' : `Merged: ${st.pages} page${st.pages === 1 ? '' : 's'} added or updated`);
              } catch (err) { toast('Restore failed: ' + err.message, null, null, 6000); }
            });

            /* desktop: scheduled backups + backup on close */
            function startAutoBackup() {
              if (!P.isDesktop) return;
              setInterval(async () => {
                const st = S.settings;
                if (!st.autoBackupMinutes || !S.isDirty) return;
                if (Date.now() - (st.lastBackupAt || 0) < st.autoBackupMinutes * 60000) return;
                if (!(await P.listFolders()).length) return;
                backupNow('auto');
              }, 60000);
              P.onCloseRequest(async () => {
                try {
                  await flushSave(); await S.flush();
                  if (S.syncOn) await Promise.race([Sync.syncNow(), new Promise(r => setTimeout(r, 6000))]);
                  if (S.settings.backupOnClose && S.isDirty && (await P.listFolders()).length) await backupNow('close');
                } finally { P.closeReady(); }
              });
            }

            /* android: gentle reminder */
            function maybeRemind() {
              if (P.isDesktop) return;
              const st = S.settings;
              if (!st.remindDays || !S.isDirty) return;
              if (Date.now() - (st.lastBackupAt || 0) < st.remindDays * 86400000) return;
              setTimeout(() => toast(st.lastBackupAt ? `Last backup was ${timeAgo(st.lastBackupAt)}` : "Your notes haven't been backed up yet", 'Back up', () => backupNow('manual')), 1500);
            }

            /* ===================================================================
               Sync with your own server + OneNote import
               =================================================================== */
            const syncBtn = $('#btnSync');
            const SYNC_LABEL = { off: 'Sync is off', idle: 'Synced', pending: 'Changes waiting to sync', syncing: 'Syncing…', error: 'Sync problem', offline: 'Offline - will sync later', signedout: 'Signed out of sync' };
            function defaultDeviceName() {
              if (P.isAndroid) return 'Android phone';
              if (P.isDesktop) return /Win/i.test(navigator.userAgent) ? 'Windows PC' : 'Fedora PC';
              return 'Browser';
            }
            function updateSyncButton(st, msg) {
              syncBtn.hidden = !S.sync.url;
              syncBtn.dataset.state = st;
              syncBtn.title = SYNC_LABEL[st] + (msg ? ' - ' + msg : '') + (S.sync.lastSyncAt ? `\nLast synced ${timeAgo(S.sync.lastSyncAt)}` : '');
              const live = el.modal.querySelector('#syncStatus');
              if (live) live.innerHTML = syncStatusText();
            }
            function syncStatusText() {
              const sy = S.sync;
              const st = Sync.state;
              let t = `<b>${esc(SYNC_LABEL[st] || st)}</b>`;
              if (sy.lastSyncAt) t += ` · last synced ${timeAgo(sy.lastSyncAt)}`;
              if (S.pendingCount && st !== 'syncing') t += ` · ${S.pendingCount} change${S.pendingCount === 1 ? '' : 's'} waiting`;
              if (sy.lastError && (st === 'error' || st === 'signedout' || st === 'offline')) t += `<br><span class="err">${esc(sy.lastError)}</span>`;
              return t;
            }

            function setupSync() {
              Sync.hooks.beforeSync = async () => { await flushSave(); await S.flush(); };
              Sync.hooks.onStatus = updateSyncButton;
              Sync.hooks.onConflicts = n => toast(`${n} page${n === 1 ? ' was' : 's were'} edited on two devices - both versions were kept (look for “conflict copy”)`, null, null, 7000);
              Sync.hooks.onSignedOut = () => toast('Sync signed out', 'Sign in', () => openSettings());
              Sync.hooks.onApplied = changed => {
                if (state.sectionId && !S.getSection(state.sectionId)) { state.sectionId = null; pickDefaultSection(); }
                const cur = state.pageId && S.getPage(state.pageId);
                if (state.pageId && changed.pages.has(state.pageId)) {
                  if (!cur || cur.deleted || cur.sectionId !== state.sectionId) {
                    const first = state.sectionId && S.pagesIn(state.sectionId)[0];
                    openPage(first ? first.id : null, false);
                  } else if (!state.pendingSave && el.editor.innerHTML !== sanitize(cur.html)) {
                    const top = el.scroll.scrollTop;
                    const hadFocus = document.activeElement === el.editor;
                    el.editor.innerHTML = sanitize(cur.html); normalizeTodos();
                    if (document.activeElement !== el.title) el.title.value = cur.title || '';
                    renderMeta(cur); el.scroll.scrollTop = top;
                    if (hadFocus) placeCaretAtStart(el.editor);
                  }
                } else if (!state.pageId && state.sectionId) {
                  const first = S.pagesIn(state.sectionId)[0]; if (first) openPage(first.id, false);
                }
                renderTree(); renderPages(); renderCrumbs();
              };
              syncBtn.onclick = () => {
                if (Sync.state === 'signedout' || Sync.state === 'off') openSettings(); else { Sync.syncNow(); if (Sync.state === 'error') toast(S.sync.lastError || 'Sync problem'); }
              };
              updateSyncButton(S.syncOn ? 'idle' : (S.sync.url ? 'signedout' : 'off'));
              Sync.start();
            }

            function syncSectionHtml() {
              const sy = S.sync;
              const icon = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/></svg>';
              if (S.syncOn) return `
                <div class="settings-section" id="syncSection">
                  <h3>${icon} Sync</h3>
                  <p class="hint" style="margin-bottom:6px">Connected to <b>${esc(sy.url)}</b> as <b>${esc(sy.device)}</b>. Changes sync automatically on every device signed in to this server.</p>
                  <div class="status-line" id="syncStatus">${syncStatusText()}</div>
                  <div class="row-inline" style="margin-top:12px">
                    <button class="btn primary" id="btnSyncNow">Sync now</button>
                    <button class="btn" id="btnImportOneNote">Import from OneNote (OneDrive)…</button>
                    <button class="btn" id="btnImportFile2">Import OneNote / PDF file…</button>
                    <button class="btn danger" id="btnSyncOff">Disconnect</button>
                  </div>
                </div>`;
              return `
                <div class="settings-section" id="syncSection">
                  <h3>${icon} Sync with your server</h3>
                  <p class="hint">Connect to your Feynos Notes sync container to keep every device up to date automatically. Use the address your reverse proxy serves it on (e.g. <b>https://notes.example.com</b> or <b>https://example.com/notes</b>), or the container directly on your network. Signing in also unlocks importing your OneNote notebooks from OneDrive.</p>
                  <div class="field"><label for="syUrl">Server address</label><input id="syUrl" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://notes.example.com" value="${esc(sy.url)}"></div>
                  <div class="row-inline">
                    <div class="field"><label for="syPass">Password</label><input id="syPass" type="password" autocomplete="current-password" style="height:40px;border-radius:9px;border:1px solid var(--line-strong);background:var(--paper);color:var(--text);padding:0 12px;font:inherit"></div>
                    <div class="field"><label for="syDev">This device's name</label><input id="syDev" type="text" value="${esc(sy.device || defaultDeviceName())}" maxlength="40"></div>
                  </div>
                  <div class="row-inline" style="align-items:center"><button class="btn primary" id="btnSyncConnect">Connect</button><span class="hint" id="syMsg">${sy.url && sy.lastError ? '<span style="color:var(--danger)">' + esc(sy.lastError) + '</span>' : ''}</span></div>
                </div>`;
            }

            function wireSyncSection(m) {
              const q = sel => m.querySelector(sel);
              if (q('#btnSyncNow')) {
                q('#btnSyncNow').onclick = () => Sync.syncNow();
                q('#btnImportOneNote').onclick = () => openImport();
                q('#btnImportFile2').onclick = () => openImportMenu();
                q('#btnSyncOff').onclick = async () => {
                  if (!await confirmDialog('Disconnect sync?', 'Your notes stay on this device, but changes will no longer sync until you connect again.', 'Disconnect', true)) return;
                  await Sync.disconnect(); updateSyncButton('off'); toast('Sync disconnected');
                };
                return;
              }
              const go = async () => {
                const btn = q('#btnSyncConnect'); const msg = q('#syMsg');
                btn.disabled = true; msg.textContent = 'Connecting…';
                try {
                  const r = await Sync.connect(q('#syUrl').value, q('#syPass').value, q('#syDev').value.trim() || defaultDeviceName());
                  toast(r.pulled ? 'Connected - your notes are syncing' : 'Connected - this device\'s notes were uploaded');
                  openSettings();
                } catch (err) {
                  btn.disabled = false;
                  msg.innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`;
                }
              };
              q('#btnSyncConnect').onclick = go;
              q('#syPass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
            }

            /* Import chooser: OneNote online, or a file (.onepkg/.one/.onetoc2/.zip/.pdf) */
            const importInput = $('#importInput');
            function openImportMenu() {
              if (!S.syncOn) {
                openModal(`<h2>Import notes</h2>
                  <p class="sub">Importing OneNote notebooks and PDFs runs on your Feynos Notes sync server, so your phone and PCs all get the result. Connect to your server first in Settings → Sync.</p>
                  <div class="modal-actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">Set up sync</button></div>`,
                  (m, done) => { m.querySelector('[data-x=no]').onclick = () => done(); m.querySelector('[data-x=yes]').onclick = () => openSettings(); });
                return;
              }
              openModal(`<h2>Import notes</h2>
                <p class="sub">Bring notes in from OneNote or a PDF. Imports land on every device through sync.</p>
                <div class="settings-section"><h3>OneNote file</h3><p class="hint">A notebook exported from OneNote for Windows (<b>File → Export → Notebook → .onepkg</b>), a single section (<b>.one</b>), a notebook folder's <b>.onetoc2</b>, or a notebook downloaded from OneDrive as a <b>.zip</b>.</p><button class="btn primary" data-x="file">Choose OneNote file…</button></div>
                <div class="settings-section"><h3>PDF</h3><p class="hint">Any PDF, including pages printed from OneNote. Goes into the section you have open${state.sectionId && S.getSection(state.sectionId) ? ' (<b>' + esc(S.getSection(state.sectionId).name) + '</b>)' : ''}.</p><button class="btn" data-x="pdf">Choose PDF…</button></div>
                <div class="settings-section"><h3>OneNote online</h3><p class="hint">Sign in to Microsoft and copy notebooks straight from OneDrive.</p><button class="btn" data-x="online">Import from OneDrive…</button></div>
                <div class="modal-actions"><button class="btn" data-x="close">Cancel</button></div>`,
                (m, done) => {
                  m.querySelector('[data-x=close]').onclick = () => done();
                  m.querySelector('[data-x=online]').onclick = () => openImport();
                  m.querySelector('[data-x=file]').onclick = () => { importInput.accept = '.one,.onetoc2,.onepkg,.zip'; importInput.click(); };
                  m.querySelector('[data-x=pdf]').onclick = () => { importInput.accept = '.pdf,application/pdf'; importInput.click(); };
                });
            }

            importInput.addEventListener('change', async () => {
              const file = importInput.files[0]; importInput.value = '';
              if (!file) return;
              const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
              const params = {};
              if (isPdf) {
                const mode = await openModal(`<h2>Import “${esc(file.name)}”</h2>
                  <p class="sub">How should the PDF come in?</p>
                  <div class="settings-section"><h3>Exact look</h3><p class="hint">Each PDF page as a picture - handwriting, drawings and layout stay exactly as they were. The text is still searchable.</p><button class="btn primary" data-m="look">Import as pages</button></div>
                  <div class="settings-section"><h3>Editable text</h3><p class="hint">Just the text, as paragraphs you can edit. Pictures and handwriting are left out.</p><button class="btn" data-m="text">Import as text</button></div>
                  <div class="modal-actions"><button class="btn" data-m="">Cancel</button></div>`,
                  (m, done) => m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => done(b.dataset.m || null)));
                if (!mode) return;
                params.mode = mode;
                if (state.sectionId) params.section = state.sectionId;
              }
              runFileImport(file, params);
            });

            async function runFileImport(file, params) {
              let jobId = null, timer = null, closed = false;
              const mb = (file.size / 1048576).toFixed(file.size > 10485760 ? 0 : 1);
              await openModal(`<h2>Importing “${esc(file.name)}”</h2>
                <p class="sub" id="fiStage">Uploading ${mb} MB to your server…</p>
                <div class="progress"><div id="fiBar" style="width:0%"></div></div>
                <div class="hint ellipsis" id="fiCur"></div>
                <div class="modal-actions"><button class="btn danger" data-x="stop">Stop</button><button class="btn primary" data-x="close">Close</button></div>`,
                (m, done) => {
                  el.modal.dataset.kind = 'fileimport';
                  const stage = m.querySelector('#fiStage'), bar = m.querySelector('#fiBar'), cur = m.querySelector('#fiCur');
                  // closing the window keeps the import going; it reports back with a toast
                  const finish = () => { closed = true; done(); };
                  m.querySelector('[data-x=close]').onclick = finish;
                  m.querySelector('[data-x=stop]').onclick = async () => { clearInterval(timer); if (jobId) { try { await Sync.importFileCancel(jobId); } catch (e) { /* noop */ } } finish(); };
                  const live = () => !closed && el.modal.dataset.kind === 'fileimport';
                  Sync.uploadImport(file, params, f => { if (live()) bar.style.width = Math.round(f * 100) + '%'; })
                    .then(job => {
                      jobId = job.id;
                      if (live()) { stage.textContent = 'Converting on your server…'; bar.style.width = '0%'; }
                      timer = setInterval(async () => {
                        let st; try { st = await Sync.importFileStatus(jobId); } catch (e) { return; }
                        if (st.progress && st.progress.total && live()) { bar.style.width = Math.round(st.progress.done / st.progress.total * 100) + '%'; stage.textContent = `Importing… ${st.progress.done} of ${st.progress.total} ${st.kind === 'pdf' ? 'PDF pages' : 'pages'}`; }
                        if (live()) cur.textContent = st.message || (st.progress && st.progress.current) || '';
                        if (st.state === 'importing' || st.state === 'done') Sync.schedule(0);
                        if (st.state === 'done') {
                          clearInterval(timer);
                          const r = st.result || {};
                          const msg = `Imported ${r.pages || 0} page${r.pages === 1 ? '' : 's'}${r.sections ? ` in ${r.sections} section${r.sections === 1 ? '' : 's'}` : ''}${r.skipped ? `, ${r.skipped} unchanged or edited here (kept)` : ''}${r.failed ? `, ${r.failed} failed` : ''}`;
                          Sync.syncNow();
                          if (live()) {
                            stage.innerHTML = `<b style="color:var(--ok)">Done.</b> ${esc(msg)}.`; bar.style.width = '100%'; cur.textContent = st.message || '';
                            m.querySelector('[data-x=stop]').hidden = true;
                          } else toast(msg);
                        } else if (st.state === 'error') {
                          clearInterval(timer);
                          if (live()) { stage.innerHTML = `<span style="color:var(--danger)">${esc(st.message || 'Import failed')}</span>`; m.querySelector('[data-x=stop]').hidden = true; }
                          else toast('Import failed: ' + (st.message || ''), null, null, 7000);
                        }
                      }, 1500);
                    })
                    .catch(err => {
                      if (live()) { stage.innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`; m.querySelector('[data-x=stop]').hidden = true; }
                      else toast(err.message, null, null, 7000);
                    });
                });
            }

            /* OneNote import: sign-in and the heavy lifting happen on the server */
            async function openImport() {
              let timer = null; let lastKey = '';
              const stop = () => clearInterval(timer);
              const render = (m, st, done) => {
                const key = st.state + '|' + (st.notebooks || []).length + '|' + (st.userCode || '') + '|' + (st.message || '');
                if (st.state === 'importing') {
                  const pct = st.progress.total ? Math.round(st.progress.done / st.progress.total * 100) : 0;
                  if (lastKey.startsWith('importing|')) {
                    const bar = m.querySelector('.progress > div'); if (bar) bar.style.width = pct + '%';
                    const t = m.querySelector('#impText'); if (t) t.textContent = `${st.progress.done} of ${st.progress.total} pages`;
                    const c = m.querySelector('#impCur'); if (c) c.textContent = st.message || st.progress.current || '';
                    return;
                  }
                } else if (key === lastKey) return;
                lastKey = key;
                let body = '';
                if (st.state === 'unconfigured') {
                  body = `<p class="sub">OneNote import needs a free Microsoft app ID added to your sync container as <b>MS_CLIENT_ID</b>. The setup steps are in the README on GitHub (about 5 minutes, one time).</p>
                    <div class="modal-actions"><button class="btn" data-x="readme">Open setup steps</button><button class="btn primary" data-x="close">OK</button></div>`;
                } else if (st.state === 'idle' || st.state === 'error') {
                  body = `<p class="sub">Copies your OneNote notebooks from OneDrive into Feynos Notes - sections, pages, subpages, pictures, to-dos and tags. Your OneNote notebooks aren't changed. Importing again later brings over new pages and edits.</p>
                    ${st.state === 'error' ? `<p class="hint" style="color:var(--danger)">${esc(st.message)}</p>` : st.message ? `<p class="hint">${esc(st.message)}</p>` : ''}
                    <div class="modal-actions"><button class="btn" data-x="close">Cancel</button><button class="btn primary" data-x="start">${st.hasSavedSignIn ? 'Continue' : 'Sign in to Microsoft'}</button></div>`;
                } else if (st.state === 'signin') {
                  body = `<p class="sub">Open the Microsoft sign-in page on any device, enter this code, and sign in with the account that has your OneNote notebooks.</p>
                    <div class="code-box">${esc(st.userCode)}</div>
                    <div class="row-inline" style="justify-content:center"><button class="btn" data-x="copy">Copy code</button><button class="btn primary" data-x="open">Open ${esc((st.verificationUri || '').replace(/^https?:\/\//, ''))}</button></div>
                    <p class="hint" style="text-align:center;margin-top:12px">Waiting for you to sign in…</p>
                    <div class="modal-actions"><button class="btn" data-x="cancel">Cancel</button></div>`;
                } else if (st.state === 'listing') {
                  body = `<p class="sub">${esc(st.message || 'Reading your notebooks…')}</p><div class="progress"><div style="width:35%"></div></div>`;
                } else if (st.state === 'choose' || st.state === 'done') {
                  const r = st.result;
                  body = `${r ? `<p class="sub" style="color:var(--ok)"><b>Import finished:</b> ${r.pages} page${r.pages === 1 ? '' : 's'} in ${r.sections} new section${r.sections === 1 ? '' : 's'}${r.skipped ? `, ${r.skipped} unchanged or edited here (kept)` : ''}${r.failed ? `, <span style="color:var(--danger)">${r.failed} failed</span>` : ''}. It's syncing to this device now.</p>` : `<p class="sub">Signed in${st.account ? ' as <b>' + esc(st.account) + '</b>' : ''}. Pick the notebooks to bring over.</p>`}
                    <div id="nbPicks">${(st.notebooks || []).map(n => `<label class="nb-pick"><input type="checkbox" value="${esc(n.id)}" ${r ? '' : 'checked'}><span><span class="np-name">${esc(n.name)}</span><br><span class="np-sub">${n.already ? 'Imported before - will add new pages and edits' : 'Last changed ' + esc(new Date(n.modified).toLocaleDateString())}</span></span></label>`).join('') || '<p class="hint">No OneNote notebooks found in this account.</p>'}</div>
                    <div class="modal-actions"><button class="btn" data-x="signout">Sign out of Microsoft</button><button class="btn" data-x="close">${r ? 'Done' : 'Cancel'}</button><button class="btn primary" data-x="import">${r ? 'Import again' : 'Import'}</button></div>`;
                } else if (st.state === 'importing') {
                  const pct = st.progress.total ? Math.round(st.progress.done / st.progress.total * 100) : 0;
                  body = `<p class="sub">Importing… you can close this - it keeps going on your server and syncs here as pages arrive.</p>
                    <div class="progress"><div style="width:${pct}%"></div></div>
                    <div class="hint" id="impText">${st.progress.done} of ${st.progress.total} pages</div>
                    <div class="hint ellipsis" id="impCur">${esc(st.message || st.progress.current || '')}</div>
                    <div class="modal-actions"><button class="btn danger" data-x="cancel">Stop import</button><button class="btn primary" data-x="close">Close</button></div>`;
                }
                m.innerHTML = `<h2>Import from OneNote</h2>${body}`;
                m.querySelectorAll('[data-x]').forEach(b => b.onclick = async () => {
                  const x = b.dataset.x;
                  try {
                    if (x === 'close') { stop(); done(null); }
                    else if (x === 'readme') P.openExternal('https://github.com/Feynos-Lin/feynos-note#onenote-import-setup');
                    else if (x === 'start') render(m, await Sync.importStart(), done);
                    else if (x === 'open') P.openExternal(st.verificationUri);
                    else if (x === 'copy') { try { await navigator.clipboard.writeText(st.userCode); toast('Code copied'); } catch (e) { toast(st.userCode); } }
                    else if (x === 'cancel') render(m, await Sync.importCancel(), done);
                    else if (x === 'signout') render(m, await Sync.importSignOut(), done);
                    else if (x === 'import') {
                      const ids = [...m.querySelectorAll('#nbPicks input:checked')].map(i => i.value);
                      if (!ids.length) { toast('Pick at least one notebook'); return; }
                      lastKey = ''; render(m, await Sync.importChoose(ids), done);
                    }
                  } catch (err) { toast(err.message, null, null, 6000); }
                });
              };
              let st;
              try { st = await Sync.importStatus(); } catch (err) { toast(err.message, null, null, 6000); return; }
              await openModal('', (m, done) => {
                el.modal.dataset.kind = 'import';
                render(m, st, done);
                let wasImporting = st.state === 'importing';
                timer = setInterval(async () => {
                  if (el.modalRoot.hidden || el.modal.dataset.kind !== 'import') { stop(); return; }
                  try {
                    const s2 = await Sync.importStatus(); st = s2;
                    if (s2.state === 'importing') { wasImporting = true; Sync.schedule(0); }
                    if (s2.state === 'done' && wasImporting) { wasImporting = false; Sync.syncNow(); }
                    render(m, s2, done);
                  } catch (e) { /* keep polling */ }
                }, 2000);
              });
              stop();
              delete el.modal.dataset.kind;
            }

            /* ===================================================================
               In-app updates
               =================================================================== */
            async function autoCheckUpdates() {
              if (!Updater.supported || !S.settings.autoUpdateCheck) return;
              if (Date.now() - (S.settings.lastUpdateCheck || 0) < 6 * 3600 * 1000) return;
              try {
                const r = await Updater.check(APP_VERSION);
                S.saveSettings({ lastUpdateCheck: Date.now() });
                if (r.supported && r.available && r.latest !== S.settings.skippedVersion) {
                  toast(`Feynos Notes ${r.latest} is available`, 'Update', () => runUpdate(r), 15000);
                }
              } catch (e) { /* offline - try again later */ }
            }

            async function runUpdate(info) {
              if (P.isAndroid && !await Updater.canInstallApk()) {
                const go = await openModal(`<h2>Allow updates</h2>
                  <p class="sub">Android needs your OK once before Feynos Notes can install its own updates. Turn on <b>Allow from this source</b> on the next screen, come back, and tap Update again.</p>
                  <div class="modal-actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">Open setting</button></div>`,
                  (m, done) => { m.querySelector('[data-x=no]').onclick = () => done(false); m.querySelector('[data-x=yes]').onclick = () => done(true); });
                if (go) Updater.openInstallSettings();
                return;
              }
              const size = info.size ? ` (${(info.size / 1048576).toFixed(1)} MB)` : '';
              await openModal(`<h2>Update to ${esc(info.latest)}</h2>
                <p class="sub" id="upStage">Downloading${size}…</p>
                <div class="progress"><div id="upBar" style="width:0%"></div></div>
                ${info.notes ? `<div class="hint" style="max-height:120px;overflow:auto;white-space:pre-wrap">${esc(info.notes)}</div>` : ''}
                <div class="modal-actions"><button class="btn" data-x="skip">Skip this version</button><button class="btn" data-x="later">Later</button><button class="btn primary" data-x="go" hidden>Restart &amp; update</button></div>`,
                (m, done) => {
                  el.modal.dataset.kind = 'update';
                  const stage = m.querySelector('#upStage'), bar = m.querySelector('#upBar'), go = m.querySelector('[data-x=go]');
                  const live = () => el.modal.dataset.kind === 'update';
                  m.querySelector('[data-x=later]').onclick = () => done();
                  m.querySelector('[data-x=skip]').onclick = () => { S.saveSettings({ skippedVersion: info.latest }); done(); };
                  go.onclick = async () => {
                    go.disabled = true; stage.textContent = 'Saving and syncing your notes…';
                    await flushSave(); await S.flush();
                    if (S.syncOn) await Promise.race([Sync.syncNow(), new Promise(r => setTimeout(r, 8000))]);
                    stage.textContent = P.isDesktop && /Win/i.test(navigator.userAgent) ? 'Installing - the app will reopen by itself…' : 'Installing - you may be asked for your password…';
                    Updater.install();
                  };
                  Updater.download(p => { if (live()) { bar.style.width = p + '%'; stage.textContent = `Downloading${size}… ${p}%`; } })
                    .then(r => {
                      if (!live()) return;
                      bar.style.width = '100%';
                      if (r === 'ready') { stage.innerHTML = '<b style="color:var(--ok)">Downloaded.</b> Restart to finish updating. Your notes are saved first.'; go.hidden = false; }
                      else { stage.innerHTML = 'Android\'s installer is open - tap <b>Update</b> there. Feynos Notes restarts on the new version.'; m.querySelector('[data-x=later]').textContent = 'Close'; }
                    })
                    .catch(err => { if (live()) stage.innerHTML = `<span style="color:var(--danger)">${esc(err.message || String(err))}</span>`; });
                });
            }

            /* ===================================================================
               Wiring
               =================================================================== */
            function renderAll() { renderTree(); renderPages(); renderCrumbs(); }

            $('#btnNewNotebook').onclick = newNotebook;
            $('#btnBin').onclick = openBin;
            $('#btnImport').onclick = () => openImportMenu();
            $('#btnSettings').onclick = () => openSettings();
            $('#btnNewPage').onclick = () => newPage();
            $('#btnEmptyNew').onclick = () => newPage();
            $('#btnBackToNav').onclick = () => setView('nav');
            $('#btnBackToPages').onclick = () => { flushSave(); setView('pages'); };

            document.addEventListener('keydown', e => {
              const mod = e.ctrlKey || e.metaKey;
              if (e.key === 'Escape') {
                if (!el.modalRoot.hidden) { closeModal(null); e.preventDefault(); return; }
                if (!el.menu.hidden) { closeMenu(); return; }
                hideChip();
              }
              if (!mod || !el.modalRoot.hidden) return;
              const k = e.key.toLowerCase();
              if (k === 'n' && !e.shiftKey) { e.preventDefault(); newPage(); }
              else if (k === 'n' && e.shiftKey) { e.preventDefault(); if (state.sectionId) newSection(S.getSection(state.sectionId).notebookId); }
              else if (k === 'e' || (k === 'f' && e.shiftKey)) { e.preventDefault(); if (isNarrow()) setView('nav'); el.search.focus(); el.search.select(); }
              else if (k === 's') { e.preventDefault(); flushSave(); if (P.isDesktop) backupNow('manual'); else toast('Saved'); }
              else if (k === 'k' && selectionInEditor()) { e.preventDefault(); linkDialog(); }
              else if (k === '1' && selectionInEditor()) { e.preventDefault(); toggleTodo(); }
              else if (k === '.' && selectionInEditor()) { e.preventDefault(); exec('insertUnorderedList'); }
            });

            /* android hardware back: close overlays, then step back through panes */
            P.onBack(() => {
              if (!el.modalRoot.hidden) { closeModal(null); return; }
              if (!el.menu.hidden) { closeMenu(); return; }
              if (!el.chip.hidden) { hideChip(); return; }
              if (state.query && state.view === 'pages') { el.search.value = ''; state.query = ''; renderAll(); setView('nav'); return; }
              if (state.view === 'editor') { flushSave(); setView('pages'); return; }
              if (state.view === 'pages') { setView('nav'); return; }
              flushSave(); P.exitApp();
            });
            P.onPause(() => { flushSave(); S.flush(); if (S.syncOn) Sync.syncNow(); });
            window.addEventListener('beforeunload', () => { flushSave(); });
            window.addEventListener('resize', () => { hideChip(); closeMenu(); });

            /* ===================================================================
               Start
               =================================================================== */
            (async function init() {
              try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) { /* noop */ }
              try {
                await S.load();
              } catch (err) {
                document.body.innerHTML = `<div style="padding:30px;font-family:sans-serif"><h2>Feynos Notes couldn't open its storage</h2><p>${esc(err && err.message || err)}</p></div>`;
                return;
              }
              applyTheme();
              const st = S.settings;
              state.sectionId = S.getSection(st.lastSectionId) ? st.lastSectionId : null;
              if (!state.sectionId) pickDefaultSection();
              const lp = S.getPage(st.lastPageId);
              const pageId = lp && !lp.deleted && lp.sectionId === state.sectionId ? lp.id : ((S.pagesIn(state.sectionId || '')[0] || {}).id || null);
              renderAll();
              openPage(pageId, false);
              setView(isNarrow() ? (pageId ? 'pages' : 'nav') : 'editor');
              startAutoBackup();
              setupSync();
              maybeRemind();
              setTimeout(autoCheckUpdates, 8000);
              setInterval(autoCheckUpdates, 3600 * 1000);
            })();
          })();
          FEYNOS_EOF

          mkdir -p "$(dirname src/www/cap-bundle.js)"
          cat > src/www/cap-bundle.js <<'FEYNOS_EOF'
          /* desktop/web build: no native bridge */
          FEYNOS_EOF

          mkdir -p "$(dirname src/desktop/main.js)"
          cat > src/desktop/main.js <<'FEYNOS_EOF'
          // Feynos Notes - Electron main process (Linux .rpm and Windows installer)
          'use strict';
          const { app, BrowserWindow, ipcMain, dialog, shell, Menu, screen } = require('electron');
          const path = require('path');
          const fs = require('fs');
          const crypto = require('crypto');

          app.setName('Feynos Notes');
          if (process.platform === 'win32') app.setAppUserModelId('com.feynos.notes');

          if (!app.requestSingleInstanceLock()) { app.quit(); }

          /* ---------------- updates (GitHub Releases) ---------------- */
          let autoUpdater = null;
          try { ({ autoUpdater } = require('electron-updater')); } catch (e) { console.warn('electron-updater not available:', e.message); }
          const newer = (a, b) => {
            const pa = String(a).replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
            const pb = String(b).replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
            for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0); }
            return false;
          };
          function sendToPage(channel, data) { if (win && !win.isDestroyed()) win.webContents.send(channel, data); }
          function setupUpdater() {
            if (!autoUpdater) return;
            autoUpdater.autoDownload = false;
            autoUpdater.autoInstallOnAppQuit = true;
            autoUpdater.on('download-progress', p => sendToPage('update-event', { type: 'progress', percent: Math.round(p.percent || 0) }));
            autoUpdater.on('update-downloaded', info => sendToPage('update-event', { type: 'downloaded', version: info.version }));
            autoUpdater.on('error', e => sendToPage('update-event', { type: 'error', message: String((e && e.message) || e).split('\n')[0] }));
          }
          ipcMain.handle('update:check', async () => {
            const current = app.getVersion();
            if (!autoUpdater) return { supported: false, current, reason: 'The updater is missing from this build.' };
            if (!app.isPackaged) return { supported: false, current, reason: 'Updates only work in the installed app.' };
            const r = await autoUpdater.checkForUpdates();
            const info = r && r.updateInfo;
            const latest = info ? info.version : current;
            const notes = info && typeof info.releaseNotes === 'string' ? info.releaseNotes.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() : '';
            return { supported: true, current, latest, available: newer(latest, current), notes };
          });
          ipcMain.handle('update:download', async () => { await autoUpdater.downloadUpdate(); return true; });
          ipcMain.handle('update:install', () => {
            // the page has already saved and synced; skip the close handshake
            allowClose = true;
            setImmediate(() => autoUpdater.quitAndInstall(true, true));
            return true;
          });

          let win = null;
          let allowClose = false;

          const CONFIG_PATH = () => path.join(app.getPath('userData'), 'desktop-config.json');
          function readConfig() {
            try { return JSON.parse(fs.readFileSync(CONFIG_PATH(), 'utf8')); } catch { return { folders: [], window: null }; }
          }
          function writeConfig(cfg) {
            try {
              fs.mkdirSync(path.dirname(CONFIG_PATH()), { recursive: true });
              fs.writeFileSync(CONFIG_PATH(), JSON.stringify(cfg, null, 2));
            } catch (e) { console.error('config write failed', e); }
          }
          let config = { folders: [], window: null };


          function createWindow() {
            const saved = config.window || {};
            const area = screen.getPrimaryDisplay().workAreaSize;
            win = new BrowserWindow({
              width: Math.min(saved.width || 1320, area.width),
              height: Math.min(saved.height || 860, area.height),
              x: saved.x, y: saved.y,
              minWidth: 380, minHeight: 480,
              title: 'Feynos Notes',
              backgroundColor: '#f4f2f7',
              autoHideMenuBar: true,
              icon: path.join(__dirname, 'www', 'icon.png'),
              show: false,
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true,
                spellcheck: true
              }
            });
            if (saved.maximized) win.maximize();
            win.once('ready-to-show', () => win.show());
            win.loadFile(path.join(__dirname, 'www', 'index.html'));

            // never navigate away from the app; open links in the real browser
            win.webContents.setWindowOpenHandler(({ url }) => { openSafe(url); return { action: 'deny' }; });
            win.webContents.on('will-navigate', (e, url) => { if (!url.startsWith('file://')) { e.preventDefault(); openSafe(url); } });

            // right-click spelling suggestions + clipboard menu
            win.webContents.on('context-menu', (e, p) => {
              if (!p.isEditable) return;
              const items = [];
              for (const s of (p.dictionarySuggestions || []).slice(0, 5)) items.push({ label: s, click: () => win.webContents.replaceMisspelling(s) });
              if (p.misspelledWord) items.push({ label: 'Add to dictionary', click: () => win.webContents.session.addWordToSpellCheckerDictionary(p.misspelledWord) }, { type: 'separator' });
              items.push({ role: 'cut' }, { role: 'copy' }, { role: 'paste' }, { role: 'selectAll' });
              Menu.buildFromTemplate(items).popup();
            });

            win.on('close', e => {
              saveWindowState();
              if (allowClose) return;
              e.preventDefault();
              // let the page save and run "backup on close", but never hang forever
              win.webContents.send('close-request');
              setTimeout(() => { allowClose = true; if (win && !win.isDestroyed()) win.close(); }, 15000);
            });
            win.on('closed', () => { win = null; });
          }

          function saveWindowState() {
            if (!win || win.isDestroyed()) return;
            const b = win.getNormalBounds();
            config.window = { ...b, maximized: win.isMaximized() };
            writeConfig(config);
          }

          function openSafe(url) {
            try {
              const u = new URL(url);
              if (['http:', 'https:', 'mailto:'].includes(u.protocol)) shell.openExternal(url);
            } catch { /* ignore bad urls */ }
          }

          /* ---------------- IPC: backup folders ---------------- */
          const publicFolder = f => ({ id: f.id, label: f.label, path: f.path, lastAt: f.lastAt || 0, lastOk: f.lastOk });
          ipcMain.handle('folders:list', () => config.folders.map(publicFolder));

          ipcMain.handle('folders:add', async (_e, label) => {
            const hintPaths = {
              'Google Drive': process.platform === 'win32' ? 'G:\\My Drive' : path.join(app.getPath('home')),
              'Proton Drive': path.join(app.getPath('home'), 'Proton Drive')
            };
            const def = hintPaths[label] && fs.existsSync(hintPaths[label]) ? hintPaths[label] : app.getPath('home');
            const r = await dialog.showOpenDialog(win, {
              title: `Choose your ${label} backup folder`,
              defaultPath: def,
              buttonLabel: 'Use this folder',
              properties: ['openDirectory', 'createDirectory']
            });
            if (r.canceled || !r.filePaths[0]) return null;
            const chosen = r.filePaths[0];
            // keep backups tidy in their own subfolder
            const target = path.basename(chosen).toLowerCase() === 'feynos notes backups' ? chosen : path.join(chosen, 'Feynos Notes Backups');
            try { fs.mkdirSync(target, { recursive: true }); } catch (err) {
              dialog.showErrorBox('Folder not writable', `Couldn't create ${target}\n\n${err.message}`);
              return null;
            }
            if (config.folders.some(f => path.resolve(f.path) === path.resolve(target))) return publicFolder(config.folders.find(f => path.resolve(f.path) === path.resolve(target)));
            const f = { id: crypto.randomUUID(), label: String(label || 'Folder').slice(0, 40), path: target };
            config.folders.push(f);
            writeConfig(config);
            return publicFolder(f);
          });

          ipcMain.handle('folders:remove', (_e, id) => {
            config.folders = config.folders.filter(f => f.id !== id);
            writeConfig(config);
            return true;
          });

          ipcMain.handle('folders:open', (_e, id) => {
            const f = config.folders.find(x => x.id === id);
            if (f) shell.openPath(f.path);
          });

          const BACKUP_RE = /^FeynosNotes-backup-\d{4}-\d{2}-\d{2}_\d{6}\.json$/;
          ipcMain.handle('backup:write', async (_e, name, text, keep) => {
            if (!BACKUP_RE.test(String(name))) throw new Error('Invalid backup name');
            if (typeof text !== 'string') throw new Error('Invalid backup data');
            keep = Math.max(1, Math.min(500, parseInt(keep, 10) || 10));
            const results = [];
            for (const f of config.folders) {
              try {
                await fs.promises.mkdir(f.path, { recursive: true });
                const tmp = path.join(f.path, name + '.part');
                await fs.promises.writeFile(tmp, text, 'utf8');
                await fs.promises.rename(tmp, path.join(f.path, name));
                // rotate: only ever touch our own backup files
                const files = (await fs.promises.readdir(f.path)).filter(n => BACKUP_RE.test(n)).sort();
                for (const old of files.slice(0, Math.max(0, files.length - keep))) {
                  await fs.promises.unlink(path.join(f.path, old)).catch(() => {});
                }
                f.lastAt = Date.now(); f.lastOk = true;
                results.push({ label: f.label, ok: true });
              } catch (err) {
                f.lastOk = false;
                results.push({ label: f.label, ok: false, error: err.code === 'ENOENT' ? 'folder not found (is the drive app running?)' : err.message });
              }
            }
            writeConfig(config);
            return results;
          });

          ipcMain.on('open-external', (_e, url) => openSafe(url));
          ipcMain.on('close-ready', () => { allowClose = true; if (win && !win.isDestroyed()) win.close(); });

          /* ---------------- lifecycle ---------------- */
          app.on('second-instance', () => { if (win) { if (win.isMinimized()) win.restore(); win.focus(); } });
          app.whenReady().then(() => {
            config = readConfig();
            if (!Array.isArray(config.folders)) config.folders = [];
            Menu.setApplicationMenu(null);
            setupUpdater();
            createWindow();
          });
          app.on('window-all-closed', () => app.quit());
          FEYNOS_EOF

          mkdir -p "$(dirname src/desktop/preload.js)"
          cat > src/desktop/preload.js <<'FEYNOS_EOF'
          // Feynos Notes - safe bridge between the page and the desktop shell
          'use strict';
          const { contextBridge, ipcRenderer } = require('electron');

          contextBridge.exposeInMainWorld('feynosDesktop', {
            listFolders: () => ipcRenderer.invoke('folders:list'),
            addFolder: label => ipcRenderer.invoke('folders:add', String(label || '')),
            removeFolder: id => ipcRenderer.invoke('folders:remove', String(id)),
            openFolder: id => ipcRenderer.invoke('folders:open', String(id)),
            writeBackup: (name, text, keep) => ipcRenderer.invoke('backup:write', String(name), String(text), Number(keep)),
            openExternal: url => ipcRenderer.send('open-external', String(url)),
            onCloseRequest: fn => ipcRenderer.on('close-request', () => fn()),
            closeReady: () => ipcRenderer.send('close-ready'),
            checkUpdate: () => ipcRenderer.invoke('update:check'),
            downloadUpdate: () => ipcRenderer.invoke('update:download'),
            installUpdate: () => ipcRenderer.invoke('update:install'),
            onUpdateEvent: fn => ipcRenderer.on('update-event', (_e, data) => fn(data))
          });
          FEYNOS_EOF

