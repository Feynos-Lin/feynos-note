                  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
                  maxX = Math.min(W, maxX + pad); maxY = Math.min(H, maxY + pad);
                  const out = document.createElement('canvas');
                  out.width = maxX - minX; out.height = maxY - minY;
                  out.getContext('2d').drawImage(canvas, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
                  return out.toDataURL('image/png');
                }

                host.querySelector('#skCancel').addEventListener('click', () => { host.classList.remove('wide'); resolve(null); });
                host.querySelector('#skInsert').addEventListener('click', () => {
                  const url = anyInk ? trimmed() : null;
                  host.classList.remove('wide');
                  resolve(url);
                });
              });
            }

            window.Sketch = { open: openSketch };
          })();
          FEYNOS_EOF

